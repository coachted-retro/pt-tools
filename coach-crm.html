<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var ALLOWED = ["Franchise Owner","Director of Fitness","General Manager","Men's Training Lead","PT Coach"];
  var session = null;
  try { session = JSON.parse(localStorage.getItem("staff_session")||"null"); } catch(e){}
  if (!session || ALLOWED.indexOf(session.role) === -1) {
    document.documentElement.innerHTML = "<body style='margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#F0F2F5;text-align:center;padding:24px'><div><h2 style='font-family:Oswald,sans-serif;color:#E0192B'>Not Authorized</h2><p style='color:#6B7280;max-width:320px;margin:0 auto'>This page is for coaches and management. <a href='staff-login.html' style='color:#E0192B;font-weight:700'>Sign in</a> with an authorized account, or head back to <a href='command-center.html' style='color:#E0192B;font-weight:700'>Command Center</a>.</p></div></body>";
    throw new Error("unauthorized access blocked");
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<link rel="manifest" href="coach-crm-manifest.json">
<title>My Clients — Coach CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#D98A0B;--soft:#F5F6F8;--lred:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 16px;min-height:56px;border-bottom:3px solid var(--red)}
@media(max-width:640px){
  .topbar{padding:10px 14px}
  .topbar .logo{font-size:16px;width:100%}
  .topbar a, .topbar button{margin-left:0 !important;font-size:11px;padding:7px 12px}
}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
.picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.picker select{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:'Inter';font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;color:inherit}
.card:hover{border-color:var(--red)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:800;font-size:16px;color:var(--muted);flex-shrink:0}
.name{font-weight:700;font-size:14px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.progress-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.progress-label{font-size:9px;color:var(--muted);width:44px;flex-shrink:0;text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.spark{display:flex;align-items:flex-end;gap:1.5px;height:14px;flex-shrink:0}
.spark-bar{width:4px;min-height:2px;border-radius:1px;background:var(--line)}
.progress-pct{font-size:11px;font-weight:800;color:var(--ink);width:30px;text-align:right;flex-shrink:0}
.progress-note{font-size:10px;color:var(--muted)}
.badges{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px}
.badge-red{background:var(--lred);color:var(--red)}
.badge-muted{background:var(--soft);color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center}

@media (max-width:640px){
  .wrap{padding:16px 12px 90px}
  .picker{flex-direction:column;align-items:stretch;gap:8px}
  .picker select{padding:14px;font-size:16px}
  .card{padding:16px;gap:12px}
  .intake-grid{grid-template-columns:1fr !important}
  #coach-stats{grid-template-columns:repeat(2,1fr) !important}
  .badges{flex-direction:column;align-items:flex-end;gap:4px}
  .name{font-size:15px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Coach <span>CRM</span></div>
  <div style="position:relative;margin-left:auto">
    <button onclick="toggleBell()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;position:relative">&#128276;<span id="bell-badge" style="display:none;position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:10px;padding:1px 5px">0</span></button>
    <div id="bell-drop" style="display:none;position:absolute;top:36px;right:0;width:300px;max-height:400px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:50;color:var(--ink)"></div>
  </div>
  <a href="coach-calendar.html" id="calendar-link" style="margin-left:12px;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700">Calendar</a>
  <a href="client-management.html" id="all-clients-link" style="display:none;margin-left:12px;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700">All Clients</a>
  <a href="coach-service-report.html" style="margin-left:12px;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700">Monthly Report</a>
  <a href="command-center.html" id="command-center-link" style="display:none;margin-left:12px">&larr; Command Center</a>
</div>
<div class="wrap">
  <div id="add-appt-form" style="display:none"></div>
  <div id="book-intake-form" style="display:none"></div>
  <div id="locked-header" style="display:none;background:var(--ink);color:#fff;border-radius:12px;padding:18px;margin-bottom:16px">
    <div style="font-family:'Oswald';font-size:20px;font-weight:800;text-transform:uppercase" id="locked-name"></div>
    <div style="font-size:12px;color:#9CA3AF;margin-top:2px">Your personal coach portal</div>
    <div id="coverage-toggle-wrap" style="display:none;margin-top:12px">
      <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9CA3AF">Viewing</label>
      <select id="coverage-toggle" onchange="switchCoverageView()" style="display:block;width:100%;margin-top:4px;padding:10px;border-radius:8px;border:none;font-weight:700"></select>
    </div>
  </div>
  <div class="picker" id="picker-box">
    <label style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)">Coach</label>
    <select id="coach-select" onchange="loadClients()">
      <option value="">Select your name</option>
      <option value="Ted Scholl">Ted Scholl</option>
      <option value="Danielle Pellegrini">Danielle Pellegrini</option>
      <option value="Roman Benedetti">Roman Benedetti</option>
      <option value="Marin">Marin</option>
      <option value="Tyler">Tyler</option>
      <option value="James">James</option>
    </select>
  </div>

  <div style="font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:0 0 10px">My Clients</div>
  <a class="card" onclick="openClientPanel()" style="cursor:pointer;margin-bottom:16px">
    <div class="avatar">👥</div>
    <div style="flex:1">
      <div class="name" id="client-count-label">Loading...</div>
      <div class="sub">Tap to view your full client list</div>
    </div>
    <div class="badges"><span class="badge badge-muted">View All &rarr;</span></div>
  </a>

  <div id="schedule-daynav" style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <button onclick="shiftScheduleDay(-1)" style="border:1.5px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer">←</button>
    <div id="schedule-day-label" style="font-family:'Oswald';font-weight:700;font-size:13px"></div>
    <button onclick="shiftScheduleDay(1)" style="border:1.5px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer">→</button>
    <a href="#" onclick="resetScheduleDay();return false" style="font-size:12px;color:var(--red);font-weight:700;margin-left:4px">Today</a>
  </div>
  <div id="today-schedule"></div>
  <div id="jeopardy-section"></div>

  <div style="font-family:'Oswald';font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:16px 0 8px">Stats at a Glance</div>
  <div id="coach-stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px"></div>

  <div style="font-family:'Oswald';font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:16px 0 8px">Today's Trainer Briefing</div>
  <div id="coach-daily-tip"></div>

  <div id="coach-inbox"></div>
</div>

<div id="client-panel-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100" onclick="if(event.target===this) closeClientPanel()">
  <div style="position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:#F8F9FB;overflow-y:auto;padding:20px;box-shadow:-8px 0 24px rgba(0,0,0,.2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'Oswald';font-size:16px;font-weight:800;text-transform:uppercase" id="client-panel-title">My Clients</div>
      <button onclick="closeClientPanel()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)">&times;</button>
    </div>
    <a href="#" onclick="openQuickAddClient();return false" style="display:block;text-align:center;background:var(--red);color:#fff;text-decoration:none;padding:10px;border-radius:8px;font-weight:700;font-size:13px;margin-bottom:12px">+ Quick Add Client</a>
    <div id="quick-add-form" style="display:none;margin-bottom:14px"></div>
    <input id="client-search" placeholder="Search by name, phone, or tag..." oninput="filterClientPanel()" style="width:100%;margin-bottom:10px;padding:9px 12px;border:1px solid var(--line,#E4E7EC);border-radius:8px;font-size:13px;font-family:inherit;box-sizing:border-box">
    <div id="tag-filter-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px"></div>
    <div id="client-list"><div class="empty">Select your name above to see your clients.</div></div>
  </div>
</div>
<script>
const WORKER = 'https://broken-cake-e9c2.tedscholl.workers.dev';

function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const COMMAND_CENTER_ALLOWED = ["Ted Scholl","Danielle Pellegrini","Bill Zolnowski","Sarah Aldrich"];
(function(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem('staff_session')||'null'); } catch(e){}
  var ccLink = document.getElementById('command-center-link');
  if (ccLink && s && COMMAND_CENTER_ALLOWED.indexOf(s.name) !== -1) ccLink.style.display = 'inline-block';
})();

const saved = localStorage.getItem('coach_crm_name');
const urlParams = new URLSearchParams(location.search);
const URL_COACH = urlParams.get('coach');
const IS_LOCKED = urlParams.get('locked') === '1' && !!URL_COACH;

if (IS_LOCKED) {
  document.getElementById('locked-header').style.display = 'block';
  document.getElementById('locked-name').textContent = URL_COACH;
  document.getElementById('picker-box').style.display = 'none';
  document.getElementById('coach-select').innerHTML = `<option value="${URL_COACH}">${URL_COACH}</option>`;
  document.getElementById('coach-select').value = URL_COACH;
  document.getElementById('calendar-link').href = 'coach-calendar.html?coach=' + encodeURIComponent(URL_COACH) + '&locked=1';
  localStorage.setItem('coach_crm_name', URL_COACH);
  loadActiveCoverage();
} else if (saved) {
  document.getElementById('coach-select').value = saved;
}

// All Clients is only for people who manage everyone's monthly check-ins
// (Ted, Danielle, Roman) or leadership roles -- a regular coach should only
// work their own assigned clients, not browse the full roster. Visibility
// is set from the live server response in loadClients(), not a cached
// session value, so it doesn't depend on someone having logged back in
// since this feature shipped.

async function loadActiveCoverage(){
  try {
    const r = await fetch(WORKER + '/coverage/active?coach=' + encodeURIComponent(URL_COACH));
    const d = await r.json();
    const covering = d.covering || [];
    if (!covering.length) return;
    // Restrict the underlying select to exactly what this coach is authorized to see —
    // their own clients, plus anyone they're actively covering for today.
    const sel = document.getElementById('coach-select');
    sel.innerHTML = `<option value="${URL_COACH}">My Clients (${URL_COACH})</option>` +
      covering.map(name => `<option value="${name}">Covering: ${name}'s Clients</option>`).join('');
    sel.value = URL_COACH;
    const toggleWrap = document.getElementById('coverage-toggle-wrap');
    const toggle = document.getElementById('coverage-toggle');
    toggle.innerHTML = sel.innerHTML;
    toggle.value = URL_COACH;
    toggleWrap.style.display = 'block';
  } catch(e) {}
}

function switchCoverageView(){
  const chosen = document.getElementById('coverage-toggle').value;
  document.getElementById('coach-select').value = chosen;
  loadClients();
  loadTodaySchedule();
  loadCoachStats();
}


async function loadBell(){
  const coach = document.getElementById('coach-select').value;
  if (!coach) return;
  try {
    const r = await fetch(WORKER + '/coach/notifications?coach=' + encodeURIComponent(coach));
    const d = await r.json();
    const badge = document.getElementById('bell-badge');
    if (d.unread>0){ badge.style.display='block'; badge.textContent=d.unread; } else badge.style.display='none';
    const drop = document.getElementById('bell-drop');
    drop.innerHTML = (d.notifications||[]).map(n=>{
      let p={}; try{p=JSON.parse(n.payload_json||'{}')}catch(e){}
      if (n.type==='self_workout') {
        return `<div style="padding:12px 14px;border-bottom:1px solid var(--line);${n.read?'':'background:var(--lred)'};cursor:pointer" onclick="bellTap(${n.id},${p.client_id},'${escH(p.client_name)}','${escH(p.title)}')">
          <div style="font-size:12px;font-weight:700">\uD83D\uDCAA ${escH(p.client_name)} logged a workout</div>
          <div style="font-size:12px;color:var(--muted)">${escH(p.title)} \u00B7 ${p.exercise_count||0} exercises</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${escH(p.date||'')} \u00B7 tap to send encouragement</div>
        </div>`;
      }
      return '';
    }).join('') || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No notifications</div>';
  } catch(e){}
}

function toggleBell(){
  const drop = document.getElementById('bell-drop');
  drop.style.display = drop.style.display==='none'?'block':'none';
}

async function bellTap(notifId, clientId, clientName, workoutTitle){
  document.getElementById('bell-drop').style.display = 'none';
  await fetch(WORKER + '/coach/notifications/read', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id: notifId})});
  loadBell();
  const msg = prompt('Send ' + clientName + ' a quick reaction to "' + workoutTitle + '":', '\uD83D\uDD25 Great work today, keep pushing!');
  if (!msg) return;
  const coach = document.getElementById('coach-select').value;
  await fetch(WORKER + '/coach/react-workout', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id: clientId, coach_name: coach, body: msg})});
}

async function loadJeopardy(){
  const coach = document.getElementById('coach-select').value;
  const box = document.getElementById('jeopardy-section');
  if (!coach) { box.innerHTML = ''; return; }
  try {
    const r = await fetch(WORKER + '/jeopardy/clients?coach=' + encodeURIComponent(coach));
    const d = await r.json();
    const rows = d.jeopardy || [];
    window._jeopardyClients = rows;
    if (!rows.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<div style="font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;color:var(--red);margin-bottom:8px">⚠ Clients In Jeopardy — ${rows.length}</div>` +
      rows.map(c => {
        const isExpiring = c.jeopardy_reason === 'package_expiring';
        const daysLeft = c.package_end_date ? Math.ceil((new Date(c.package_end_date+'T00:00:00') - new Date()) / 86400000) : null;
        const subText = isExpiring
          ? (daysLeft != null && daysLeft < 0 ? `Package expired ${escH(c.package_end_date)}` : `Package expires ${escH(c.package_end_date)}${daysLeft!=null?' ('+daysLeft+'d)':''}`)
          : (c.last_scheduled ? 'Last scheduled ' + escH(c.last_scheduled) : 'Never scheduled a session');
        return `<div class="card" style="border-left:4px solid var(--red);flex-direction:column;align-items:stretch;cursor:default">
          <div style="display:flex;align-items:center;gap:10px">
            <a href="coach-client-profile.html?client=${c.id}&coach=${encodeURIComponent(coach)}" style="display:flex;align-items:center;gap:10px;flex:1;text-decoration:none;color:inherit">
              <div class="avatar" style="background:var(--lred);color:var(--red)">${escH(((c.first_name||'?')[0]+(c.last_name||'')[0]).toUpperCase())}</div>
              <div style="flex:1">
                <div class="name">${escH(c.first_name)} ${escH(c.last_name)}</div>
                <div class="sub">${subText}</div>
              </div>
            </a>
            <span class="badge ${isExpiring?'badge-red':'badge-red'}">${isExpiring?'Expiring':'Reach out'}</span>
          </div>
          ${isExpiring ? `<div style="display:flex;gap:8px;margin-top:10px">
            <button onclick="openResignModal(${c.id},'${escH(c.first_name+' '+c.last_name).replace(/'/g,"")}')" style="flex:1;background:#1E9E5A;color:#fff;border:none;border-radius:8px;padding:8px;font-weight:700;font-size:12px;cursor:pointer">Resign</button>
            <button onclick="openNotResigningModal(${c.id},'${escH(c.first_name+' '+c.last_name).replace(/'/g,"")}')" style="flex:1;background:var(--soft);border:none;border-radius:8px;padding:8px;font-weight:700;font-size:12px;cursor:pointer">Not Resigning</button>
          </div>` : ''}
        </div>`;
      }).join('');
  } catch(e) { box.innerHTML = ''; }
}

function openResignModal(clientId, clientName){
  const overlay = document.createElement('div');
  overlay.id = 'resign-modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%">
    <div style="font-weight:800;font-size:16px;margin-bottom:4px">Resign — ${escH(clientName)}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Same package or an upgrade — this creates a new sale and resets their term.</div>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Package</label>
    <select id="rs-package" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px">
      <option value="weekly_1x">1x per week — $45 / half-hr (4 sessions)</option>
      <option value="weekly_2x">2x per week — $45 / half-hr</option>
      <option value="weekly_3x">3x per week — $45 / session</option>
      <option value="weekly_4x">4x per week — $45 / session</option>
      <option value="training">Training — $180 (no nutrition)</option>
      <option value="complete">Complete — $249 (AI meal plan)</option>
      <option value="complete_plus">Complete+ — $349 (8 sessions)</option>
    </select>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Sold Amount ($)</label>
    <input type="number" id="rs-amount" placeholder="e.g. 249" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px">
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Term Length</label>
    <select id="rs-term" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px">
      <option value="30">1 month</option>
      <option value="90">3 months</option>
      <option value="180">6 months</option>
      <option value="365">12 months</option>
    </select>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button style="flex:1;background:#1E9E5A;color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer" onclick="saveResign(${clientId})">Confirm Resign</button>
      <button style="background:var(--soft);border:none;border-radius:8px;padding:12px;cursor:pointer" onclick="document.getElementById('resign-modal-overlay').remove()">Cancel</button>
    </div>
    <div id="rs-status" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
  </div>`;
  document.body.appendChild(overlay);
}

async function saveResign(clientId){
  const status = document.getElementById('rs-status');
  const pkg = document.getElementById('rs-package').value;
  const amount = parseFloat(document.getElementById('rs-amount').value);
  const termDays = parseInt(document.getElementById('rs-term').value, 10);
  const coach = document.getElementById('coach-select').value;
  if (!amount || amount <= 0) { status.textContent = 'Enter the sold amount.'; return; }
  status.textContent = 'Saving...';
  const client = (window._jeopardyClients||[]).find(c => c.id === clientId);
  const clientName = client ? (client.first_name+' '+client.last_name) : '';
  const today = new Date();
  const endDate = new Date(today); endDate.setDate(endDate.getDate() + termDays);
  try {
    await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'update', table:'clients', values:{ package: pkg, package_start_date: today.toISOString().slice(0,10), package_end_date: endDate.toISOString().slice(0,10), status:'active_pt' }, where:{ id: clientId } }) });
    const r = await fetch(WORKER + '/sales/record', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ gym_id: 1, member_id: clientId, client_name: clientName, package_name: pkg, amount, sold_by: coach, sale_type: 'renewal' }) });
    const d = await r.json();
    if (d.ok === false) { status.textContent = d.error || 'Could not save sale.'; return; }
    status.textContent = 'Resigned! Tracked as a new sale.';
    setTimeout(() => { document.getElementById('resign-modal-overlay').remove(); loadJeopardy(); }, 900);
  } catch(e) { status.textContent = 'Error: ' + e.message; }
}

let SCHEDULE_DAY_OFFSET = 0;

function scheduleDateForOffset(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}

function shiftScheduleDay(dir){
  SCHEDULE_DAY_OFFSET += dir;
  loadTodaySchedule();
}

function resetScheduleDay(){
  SCHEDULE_DAY_OFFSET = 0;
  loadTodaySchedule();
}

async function loadTodaySchedule(){
  const coach = document.getElementById('coach-select').value;
  const box = document.getElementById('today-schedule');
  const dateStr = scheduleDateForOffset(SCHEDULE_DAY_OFFSET);
  const dateLabel = new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  const labelEl = document.getElementById('schedule-day-label');
  if (labelEl) labelEl.textContent = dateLabel + (SCHEDULE_DAY_OFFSET===0 ? ' (today)' : '');
  if (!coach) { box.innerHTML = ''; return; }
  try {
    const [r, roleRes, r3, clientsRes] = await Promise.all([
      fetch(WORKER + '/coach/today-schedule?coach=' + encodeURIComponent(coach) + '&date=' + dateStr),
      fetch(WORKER + '/db', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'select', table:'staff_roster', where:{name:coach}, limit:1})}),
      fetch(WORKER + '/appointments/coach-day?coach=' + encodeURIComponent(coach) + '&date=' + dateStr),
      fetch(WORKER + '/db', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'select', table:'clients', limit:2000})})
    ]);
    const d = await r.json();
    const roleRow = ((await roleRes.json()).results || [])[0];
    // ClubOS bookings (new-member InBody scans, intake-type appointments) carry
    // no per-coach assignment in that table at all, so they used to show up
    // identically on every single coach's agenda regardless of who was logged
    // in. Only the Training Lead runs intake-type work company-wide - matches
    // the same gate already used correctly on coach-profile.html - so only
    // they get this source; everyone else's agenda is strictly their own.
    const isTrainingLead = roleRow && roleRow.role === "Men's Training Lead";
    const d2 = isTrainingLead ? await (await fetch(WORKER + '/schedule/clubos-day?date=' + dateStr)).json() : { appointments: [] };
    const d3 = await r3.json();
    const clients = (await clientsRes.json()).results || [];
    const rows = d.today || [];
    const clubosRows = d2.appointments || [];
    const apptRows = d3.appointments || [];

    const typeLabels = { initial_consultation:'Initial Consultation', follow_up:'6-Wk Follow-Up', monthly_checkin:'Monthly Check-In', training_session:'Training Session', tour:'New Member Tour', staff_meeting:'Staff Meeting', other:'Appointment' };
    const toolFor = { initial_consultation:'fitness-consultation-tool.html', follow_up:'fitness-followup-tool.html', monthly_checkin:'fitness-monthly-checkin.html' };

    // Build one normalized list across all three sources (pt_appointments,
    // Club OS, Retro One Schedule) instead of three separate sections --
    // this is everything on the calendar for the day, one agenda, sorted
    // by time. Items with no specific time (Retro One Schedule sessions)
    // sort to the end.
    const items = [];

    apptRows.forEach(a => {
      const status = a.status || 'scheduled';
      const dimmed = ['showed','no_show','cancel','rescheduled'].includes(status);
      const clientName = a.first_name ? `${a.first_name} ${a.last_name}` : (a.prospect_name || 'Client');
      const routable = !!toolFor[a.appointment_type];
      const rescheduleNote = status==='rescheduled' ? (a.reschedule_tbd ? 'To be determined' : (a.reschedule_date ? 'to ' + fmtApptDate(a.reschedule_date) + (a.reschedule_time ? ' ' + a.reschedule_time : '') : '')) : '';
      const statusBadge = status==='showed' ? '<span class="badge" style="background:#DCFCE7;color:#166534">&#10003; Completed</span>'
        : status==='no_show' ? '<span class="badge" style="background:#FEE2E2;color:#991B1B">No Show</span>'
        : status==='cancel' ? '<span class="badge" style="background:#F3F4F6;color:#6B7280">Cancelled</span>'
        : status==='rescheduled' ? '<span class="badge" style="background:#FEF3C7;color:#92400E">&#8635; Rescheduled ' + escH(rescheduleNote) + '</span>'
        : '';
      items.push({
        uid: 'pt' + a.id, timeSort: a.appointment_time || '99:99',
        timeLabel: a.appointment_time ? new Date('2000-01-01T'+a.appointment_time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : '',
        name: clientName, typeLabel: typeLabels[a.appointment_type]||a.appointment_type,
        dimmed, statusBadge, clientId: a.client_id||null, accent: 'var(--red)',
        startHref: routable ? (toolFor[a.appointment_type] + (a.client_id?'?client_id='+a.client_id:'') + (a.client_id?'&':'?') + 'appt=' + a.id) : null,
        doneBtn: `openApptNoteAction(${a.id},${a.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','showed')`,
        noShowBtn: `openNoShowModal(${a.id},${a.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','${escH(typeLabels[a.appointment_type]||a.appointment_type)}')`,
        rescheduleBtn: `openRescheduleModal(${a.id},${a.client_id||'null'},'${escH(clientName).replace(/'/g,"")}')`,
        cancelBtn: `openApptNoteAction(${a.id},${a.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','cancel')`,
        undoBtn: `setApptStatus(${a.id},'scheduled')`,
        noteFallback: { source_table:'leads_or_appt', endpoint:'/appointments/status', idField:'id', idValue:a.id }
      });
    });

    clubosRows.forEach(a => {
      const resolved = resolveClubOsLinkCrm(a.summary, clients);
      const status = a.status || 'scheduled';
      const dimmed = ['done','rescheduled','no_show','cancel'].includes(status);
      const rescheduleNote = status==='rescheduled' ? (a.reschedule_tbd ? 'To be determined' : (a.reschedule_date ? 'to ' + fmtApptDate(a.reschedule_date) + (a.reschedule_time ? ' ' + a.reschedule_time : '') : '')) : '';
      const statusBadge = status==='done' ? '<span class="badge" style="background:#DCFCE7;color:#166534">&#10003; Done</span>'
        : status==='rescheduled' ? '<span class="badge" style="background:#FEF3C7;color:#92400E">&#8635; Rescheduled ' + escH(rescheduleNote) + '</span>'
        : status==='no_show' ? '<span class="badge" style="background:#FEE2E2;color:#991B1B">No Show</span>'
        : status==='cancel' ? '<span class="badge" style="background:#F3F4F6;color:#6B7280">Cancelled — following up</span>'
        : '';
      const summaryEsc = escH(a.summary||'Booking').replace(/'/g,"");
      const dt = new Date(a.start_datetime);
      items.push({
        uid: 'cb' + a.id, timeSort: dt.toTimeString().slice(0,5),
        timeLabel: dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) + (!resolved && !dimmed ? ' · no exact client match' : ''),
        name: a.summary || 'Booking', typeLabel: '',
        dimmed, statusBadge, clientId: resolved ? resolved.clientId : null, accent: '#2563EB',
        note: a.notes || null,
        startHref: resolved ? (resolved.tool + (resolved.clientId ? `?client_id=${resolved.clientId}&clubos_appt=${a.id}` : `?clubos_appt=${a.id}`)) : null,
        doneBtn: `openClubosDoneModal(${a.id},'${summaryEsc}')`,
        noShowBtn: `openClubosNoShowModal(${a.id},'${summaryEsc}')`,
        rescheduleBtn: `openClubosRescheduleModal(${a.id},'${summaryEsc}')`,
        cancelBtn: `openClubosCancelModal(${a.id},'${summaryEsc}')`,
        undoBtn: `setClubosStatus(${a.id},'scheduled')`,
        noteFallback: { endpoint:'/schedule/clubos-status', idValue:a.id }
      });
    });

    rows.forEach(s => {
      const status = s.status || 'scheduled';
      const dimmed = ['done','rescheduled','no_show','cancel'].includes(status);
      const clientName = `${s.first_name||''} ${s.last_name||''}`.trim();
      const statusBadge = status==='done' ? '<span class="badge" style="background:#DCFCE7;color:#166534">&#10003; Done</span>'
        : status==='rescheduled' ? '<span class="badge" style="background:#FEF3C7;color:#92400E">&#8635; Rescheduled</span>'
        : status==='no_show' ? '<span class="badge" style="background:#FEE2E2;color:#991B1B">No Show</span>'
        : status==='cancel' ? '<span class="badge" style="background:#F3F4F6;color:#6B7280">Cancelled — following up</span>'
        : '';
      items.push({
        uid: 'rs' + s.id, timeSort: '99:99',
        timeLabel: s.program_name || '',
        name: clientName, typeLabel: s.focus_notes || 'Training Session',
        dimmed, statusBadge, clientId: s.client_id||null, accent: 'var(--muted)',
        startHref: null,
        doneBtn: `openSessionActionModal(${s.id},${s.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','done')`,
        noShowBtn: `openSessionActionModal(${s.id},${s.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','no_show')`,
        rescheduleBtn: `openSessionActionModal(${s.id},${s.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','rescheduled')`,
        cancelBtn: `openSessionActionModal(${s.id},${s.client_id||'null'},'${escH(clientName).replace(/'/g,"")}','cancel')`,
        undoBtn: `setSessionStatus(${s.id},'scheduled')`,
        noteFallback: null
      });
    });

    items.sort((a,b) => a.timeSort.localeCompare(b.timeSort));

    let html = items.map(it => `
      <div class="card" style="border-left:4px solid ${it.dimmed?'#D1D5DB':it.accent};flex-direction:column;align-items:stretch;cursor:default;${it.dimmed?'opacity:.6':''}">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            <div class="name" style="${it.dimmed?'text-decoration:line-through':''}">${escH(it.name)}${it.typeLabel?' — '+escH(it.typeLabel):''}</div>
            <div class="sub">${it.timeLabel}</div>
            ${it.note ? `<div class="sub" style="margin-top:2px;font-style:italic">${escH(it.note)}</div>` : ''}
          </div>
          ${it.statusBadge}
        </div>
        ${!it.dimmed ? `
          <textarea id="note-${it.uid}" rows="2" placeholder="Notes — saved permanently to ${it.clientId?'their':'the'} profile" style="width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;resize:vertical"></textarea>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
            <button onclick='saveInlineNote(${JSON.stringify(it.uid)},${it.clientId||'null'},${JSON.stringify(it.noteFallback)})' style="background:var(--ink);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer">Save Note</button>
            <span id="note-status-${it.uid}" style="font-size:11px;color:var(--green,#1E9E5A);font-weight:700"></span>
          </div>
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            ${it.startHref ? `<a href="${it.startHref}" style="background:var(--red);color:#fff;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700">Start &rarr;</a>` : ''}
            <button onclick="${it.doneBtn}" style="background:#1E9E5A;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer">Mark Done</button>
            <button onclick="${it.rescheduleBtn}" style="background:#D98A0B;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer">Reschedule</button>
            <button onclick="${it.noShowBtn}" style="background:var(--soft);border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer">No Show</button>
            <button onclick="${it.cancelBtn}" style="background:var(--soft);border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer">Cancel</button>
          </div>
        ` : `<button onclick="${it.undoBtn}" style="background:none;border:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;margin-top:4px;align-self:flex-start">Undo</button>`}
      </div>`).join('');

    if (!items.length) {
      html = `<div class="card" style="padding:16px;color:var(--muted);font-size:13px">Nothing scheduled ${SCHEDULE_DAY_OFFSET===0?'today':'this day'}. Build a schedule from any client's profile.</div>`;
    }
    box.innerHTML = html;
  } catch(e) { box.innerHTML = ''; }
}

// Inline notes box on every agenda card -- always available regardless of
// appointment type, saved immediately as its own action, independent from
// Mark Done/Reschedule/No Show (which still capture their own closing note
// via their existing modals). This is for quick in-the-moment notes that
// need to land on the client's permanent profile without having to close
// the appointment out first.
async function saveInlineNote(uid, clientId, noteFallback){
  const ta = document.getElementById('note-' + uid);
  const statusEl = document.getElementById('note-status-' + uid);
  const body = ta ? ta.value.trim() : '';
  if (!body) { statusEl.textContent = 'Write something first.'; statusEl.style.color = 'var(--red)'; return; }
  statusEl.textContent = 'Saving...'; statusEl.style.color = 'var(--muted)';
  try {
    if (clientId) {
      const coach = document.getElementById('coach-select').value;
      const res = await fetch(WORKER + '/coach/touchpoint', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ client_id: clientId, coach_name: coach, type: 'note', body }) });
      const d = await res.json();
      if (d.ok === false) throw new Error(d.error||'save failed');
      statusEl.textContent = 'Saved to their profile ✓'; statusEl.style.color = 'var(--green,#1E9E5A)';
    } else if (noteFallback) {
      const res = await fetch(WORKER + noteFallback.endpoint, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: noteFallback.idValue, notes: body }) });
      const d = await res.json();
      if (d.ok === false) throw new Error(d.error||'save failed');
      statusEl.textContent = 'Saved ✓ (no client on file yet — kept with the appointment)'; statusEl.style.color = 'var(--green,#1E9E5A)';
    } else {
      throw new Error('nowhere to save this yet');
    }
    if (ta) ta.value = '';
  } catch(e) {
    statusEl.textContent = 'Could not save — try again.'; statusEl.style.color = 'var(--red)';
  }
}

function fmtApptDate(d){ if(!d) return ''; return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

// Cancel — status changes with a note that gets saved as a permanent
// touchpoint on the client's own profile, not just left on today's agenda.
const APPT_ACTION_LABELS = { showed:'Mark Done', cancel:'Cancel', no_show:'No Show' };
function openApptNoteAction(apptId, clientId, clientName, status){
  const label = APPT_ACTION_LABELS[status] || status;
  const overlay = document.createElement('div');
  overlay.id = 'appt-note-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%">
    <div style="font-weight:800;font-size:16px;margin-bottom:4px">${label} — ${escH(clientName)}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">This note gets saved to their profile permanently — what happened, and what's next.</div>
    <textarea id="appt-note-body" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit" placeholder="What happened, and what's next?"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="saveApptNoteAction(${apptId},${clientId||'null'},'${status}')" style="flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer">Save</button>
      <button onclick="document.getElementById('appt-note-overlay').remove()" style="background:var(--soft);border:none;border-radius:8px;padding:12px 20px;cursor:pointer">Cancel</button>
    </div>
    <div id="appt-note-status" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
  </div>`;
  document.body.appendChild(overlay);
}

async function saveApptNoteAction(apptId, clientId, status){
  const body = document.getElementById('appt-note-body').value.trim();
  const statusEl = document.getElementById('appt-note-status');
  if (!body) { statusEl.textContent = 'A note is required before this can be saved.'; statusEl.style.color = 'var(--red)'; return; }
  statusEl.textContent = 'Saving...';
  try {
    if (clientId) {
      await fetch(WORKER + '/appointments/status', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: apptId, status }) });
      const coach = document.getElementById('coach-select').value;
      await fetch(WORKER + '/coach/touchpoint', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ client_id: clientId, coach_name: coach, type: 'note', body }) });
    } else {
      // No client record yet -- keep the note with the appointment itself
      // rather than losing it.
      await fetch(WORKER + '/appointments/status', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: apptId, status, notes: body }) });
    }
    document.getElementById('appt-note-overlay').remove();
    loadTodaySchedule();
  } catch(e) { statusEl.textContent = 'Could not save — try again.'; }
}

// No Show — specifically structured, not just a free-text box. This is the
// exact reminder: notify ABC so the front desk manager reminds the member to
// reschedule their InBody/consultation next time they're in. The checkbox
// keeps that step from ever getting silently skipped, and Keelin's report
// gets a clear, consistent line either way.
function openNoShowModal(apptId, clientId, clientName, apptTypeLabel){
  const overlay = document.createElement('div');
  overlay.id = 'noshow-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%">
    <div style="font-weight:800;font-size:16px;margin-bottom:4px">No Show — ${escH(clientName)}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px">${escH(apptTypeLabel)} — didn't show today.</div>
    <label style="display:flex;align-items:flex-start;gap:10px;background:#FEF3E2;border:1px solid #D98A0B;border-radius:10px;padding:12px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="noshow-abc-confirm" style="margin-top:2px">
      <span style="font-size:13px;color:#92400E"><b>I put the member alert in ABC</b> — front desk will remind them to reschedule their ${escH(apptTypeLabel)} next time they're in.</span>
    </label>
    <textarea id="noshow-note-body" rows="2" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit" placeholder="Any other context (optional)"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="saveNoShow(${apptId},${clientId||'null'},'${escH(apptTypeLabel).replace(/'/g,"")}')" style="flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer">Save</button>
      <button onclick="document.getElementById('noshow-overlay').remove()" style="background:var(--soft);border:none;border-radius:8px;padding:12px 20px;cursor:pointer">Cancel</button>
    </div>

function resolveClubOsLinkCrm(summary, clients){
  const s = (summary||'').toLowerCase();
  let tool = null;
  if (s.includes('new member') && s.includes('inbody')) tool = 'fitness-consultation-tool.html';
  else if (s.includes('monthly') && (s.includes('progress') || s.includes('check'))) tool = 'fitness-monthly-checkin.html';
  else if (s.includes('follow') || s.includes('re-engagement') || s.includes('6 week') || s.includes('6-week')) tool = 'fitness-followup-tool.html';
  if (!tool) return null;
  const namePart = (summary||'').split(/[-–]/)[0].trim();
  if (!namePart) return { tool, clientId: null };
  const nameLower = namePart.toLowerCase();
  const match = (clients||[]).find(c => {
    const full = ((c.first_name||'')+' '+(c.last_name||'')).trim().toLowerCase();
    return full === nameLower || full.includes(nameLower) || nameLower.includes(full);
  });
  return { tool, clientId: match ? match.id : null };
}

function sparkBars(values, maxVal, colorFn) {
  return values.map(v => {
    const h = maxVal > 0 ? Math.max(2, Math.round((Math.min(v, maxVal) / maxVal) * 14)) : 2;
    const color = colorFn(v);
    return `<div class="spark-bar" style="height:${h}px;background:${color}"></div>`;
  }).join('');
}
function workoutColor(n){ return n >= 3 ? 'var(--green)' : n >= 1 ? 'var(--amber)' : 'var(--line)'; }
function macroColor(pct){ return pct >= 85 ? 'var(--green)' : pct >= 65 ? 'var(--amber)' : 'var(--red)'; }

function renderClientGraphs(c) {
  const weekly = c.workout_weekly_series || [0,0,0,0,0,0,0,0];
  const workoutPctText = c.workout_completion_pct != null ? c.workout_completion_pct + '%' : (c.workout_logged_30d || 0) + 'x';
  const workoutRow = `<div class="progress-row">
      <div class="progress-label">Workouts</div>
      <div class="spark">${sparkBars(weekly, 4, workoutColor)}</div>
      <div class="progress-pct">${workoutPctText}</div>
    </div>`;

  let macroRow;
  if (!c.macro_has_target) {
    macroRow = `<div class="progress-row"><div class="progress-label">Macros</div><div class="progress-note">No macro targets set</div></div>`;
  } else if (!c.macro_days_logged) {
    macroRow = `<div class="progress-row"><div class="progress-label">Macros</div><div class="progress-note">No meals logged yet</div></div>`;
  } else {
    const series = c.macro_series || [];
    const bars = series.map(d => d.pct);
    while (bars.length < 14) bars.unshift(0);
    macroRow = `<div class="progress-row">
        <div class="progress-label">Macros</div>
        <div class="spark">${sparkBars(bars.slice(-14), 100, macroColor)}</div>
        <div class="progress-pct">${c.macro_avg_pct}%</div>
      </div>`;
  }
  return workoutRow + macroRow;
}

let ACTIVE_TAG_FILTER = null;
function renderTagFilterChips(clients) {
  const el = document.getElementById('tag-filter-chips');
  if (!el) return;
  const tagCounts = {};
  clients.forEach(c => (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean).forEach(t => { tagCounts[t] = (tagCounts[t]||0)+1; }));
  const tags = Object.keys(tagCounts).sort((a,b) => tagCounts[b]-tagCounts[a]).slice(0, 10);
  if (!tags.length) { el.innerHTML = ''; return; }
  el.innerHTML = tags.map(t => {
    const active = ACTIVE_TAG_FILTER === t;
    return `<span onclick="toggleTagFilter('${escH(t).replace(/'/g,"")}')" style="cursor:pointer;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:${active?'#2563EB':'#EFF6FF'};color:${active?'#fff':'#2563EB'}">${escH(t)} (${tagCounts[t]})</span>`;
  }).join('');
}
function toggleTagFilter(tag) {
  ACTIVE_TAG_FILTER = ACTIVE_TAG_FILTER === tag ? null : tag;
  renderTagFilterChips(window._loadedClients||[]);
  filterClientPanel();
}
function filterClientPanel() {
  const q = (document.getElementById('client-search')||{}).value?.trim().toLowerCase() || '';
  const coach = document.getElementById('coach-select').value;
  let clients = window._loadedClients || [];
  if (ACTIVE_TAG_FILTER) clients = clients.filter(c => (c.tags||'').split(',').map(t=>t.trim()).includes(ACTIVE_TAG_FILTER));
  if (q) clients = clients.filter(c => {
    const blob = [c.first_name, c.last_name, c.phone, c.email, c.tags].filter(Boolean).join(' ').toLowerCase();
    return blob.includes(q);
  });
  renderClientPanel(clients, coach, true);
}
function renderClientPanel(clients, coach, isFiltered) {

      <div style="flex:1">
        <div class="name">${escH(c.first_name)} ${escH(c.last_name)}</div>
        ${renderClientGraphs(c)}
        ${tagChips ? `<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${tagChips}</div>` : ''}
      </div>
      <div class="badges">
        ${c.unread_messages > 0 ? `<span class="badge badge-red">${c.unread_messages} new msg</span>` : ''}
        ${stale ? `<span class="badge badge-red">Touch base</span>` : `<span class="badge badge-muted">${daysSince}d ago</span>`}
      </div>
    </a>`;
  }).join('');
}

async function saveIntakeAppointment(coach){
  const status = document.getElementById('intake-status');
  const type = document.getElementById('intake-type').value;
  const clientId = document.getElementById('intake-client').value;
  const date = document.getElementById('intake-date').value;
  const time = document.getElementById('intake-time').value;
  const notes = document.getElementById('intake-notes').value.trim();
  const prospectName = document.getElementById('intake-prospect-name').value.trim();
  const prospectPhone = document.getElementById('intake-prospect-phone').value.trim();
  const prospectEmail = document.getElementById('intake-prospect-email').value.trim();
  const otherText = document.getElementById('intake-other-text') ? document.getElementById('intake-other-text').value.trim() : '';
  if (!date) { status.textContent = 'Date is required.'; return; }
  if (!clientId && !prospectName && type !== 'staff_meeting' && type !== 'other') { status.textContent = 'Pick a client or enter a prospect name.'; return; }
  if (type === 'other' && !otherText) { status.textContent = 'Say what this appointment is for.'; return; }
  // Client-side pre-check for instant feedback — the server enforces this too, no exceptions either way.
  const requested = new Date(date + 'T' + (time || '00:00') + ':00');
  const minAllowed = new Date(Date.now() + 24*60*60*1000);
  if (requested < minAllowed) { status.textContent = 'Needs at least 24 hours notice — pick a later time.'; return; }
  status.textContent = 'Saving...';
  try {
    const finalNotes = type === 'other' ? (otherText + (notes ? ' — ' + notes : '')) : notes;
    const body = { appointment_date: date, appointment_time: time || null, appointment_type: type, assigned_coach: coach, booked_by: coach, notes: finalNotes || null };
    if (clientId) body.client_id = parseInt(clientId,10);
    else if (prospectName) { body.prospect_name = prospectName; body.prospect_phone = prospectPhone || null; body.prospect_email = prospectEmail || null; }
    else { body.prospect_name = type === 'staff_meeting' ? 'Staff Meeting' : (otherText || 'Appointment'); }
    const r = await fetch(WORKER + '/appointments/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { status.textContent = d.error || 'Could not save.'; return; }
    status.textContent = 'Booked!';
    setTimeout(() => { document.getElementById('book-intake-form').style.display = 'none'; loadTodaySchedule(); }, 800);
  } catch(e) { status.textContent = 'Error: ' + e.message; }
}

async function saveQuickAddClient(){
  const status = document.getElementById('qa-status');
  const coach = document.getElementById('coach-select').value;
  const first = document.getElementById('qa-first').value.trim();
  const last = document.getElementById('qa-last').value.trim();
  const phone = document.getElementById('qa-phone').value.trim();
  const email = document.getElementById('qa-email').value.trim();
  const birthday = document.getElementById('qa-birthday').value;
  if (!first && !last) { status.textContent = 'Enter a name.'; return; }
  status.textContent = 'Saving...';
  try {
    const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'insert', table:'clients', values:{ first_name: first, last_name: last, phone: phone||null, email: email||null, birthday: birthday||null, status: 'active_pt', coach: coach||null } }) });
    const d = await r.json();
    if (d.ok === false) { status.textContent = d.error || 'Could not save.'; return; }
    const newClientId = d.id;
    status.innerHTML = `Added! <a href="#" onclick="bookIntakeForNewClient(${newClientId},'${first.replace(/'/g,"")} ${last.replace(/'/g,"")}');return false" style="color:var(--red);font-weight:700">Book their intake appointment now →</a>`;
    loadClients();
  } catch(e) { status.textContent = 'Error: ' + e.message; }

function bookIntakeForNewClient(clientId, name){
  document.getElementById('quick-add-form').style.display = 'none';
  closeClientPanel();
  openBookIntake();
  const sel = document.getElementById('intake-client');
  if (sel) {

    if (!Array.from(sel.options).some(o => o.value === String(clientId))) {
      const opt = document.createElement('option');
      opt.value = clientId; opt.textContent = name;
      sel.appendChild(opt);
    }
    sel.value = clientId;
    toggleIntakeProspectFields();
  }
}

    <select id="appt-client" onchange="refreshBundleRecommendations()" style="margin-bottom:10px;padding:10px;border:1px solid var(--line);border-radius:8px">
      <option value="">Select client...</option>
      ${clients.map(c => `<option value="${c.id}">${escH(c.first_name)} ${escH(c.last_name)}</option>`).join('')}
    </select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px">
      <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Start Date</label><input type="date" id="appt-start" value="${today}" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:4px"></div>
      <div><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)">Repeat Weekly For</label>
        <select id="appt-weeks" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:4px">
          <option value="1">Just this week</option>
          <option value="4" selected>4 weeks</option>
          <option value="8">8 weeks</option>
          <option value="12">12 weeks</option>
          <option value="26">26 weeks (ongoing)</option>
        </select>
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Same weekly pattern repeats for however many weeks you pick — no need to re-enter it each week.</div>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Routine by Day</label>
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Check a day to schedule it, then pick that day's routine — Tuesday can be Push while Thursday is Pull, for example.</div>
    <div id="appt-day-routines" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px">
      ${[0,1,2,3,4,5,6].map(i => `
        <div style="border:1px solid var(--line);border-radius:8px;padding:10px">
          <label style="font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="appt-day-${i}" ${i>=1&&i<=5?'checked':''} onchange="toggleApptDay(${i})">${WEEKDAY_NAMES[i]}
          </label>
          <div id="appt-day-${i}-routine" style="margin-top:8px;${i>=1&&i<=5?'':'display:none'}">
            <select id="appt-day-${i}-bundle" onchange="renderDayRoutineOptions(${i})" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12px">
              <option value="">-- Custom / type your own --</option>
              ${bundleOptions}
            </select>
            <select id="appt-day-${i}-routinesel" onchange="applyDayRoutine(${i})" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12px;display:none"></select>
            <input id="appt-day-${i}-program" placeholder="Session name, e.g. Push Day" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12px">
            <input id="appt-day-${i}-exercises" placeholder="Exercises, comma separated" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:12px">
            <div id="appt-day-${i}-preview" style="margin-top:8px"></div>
          </div>
        </div>`).join('')}
    </div>
    <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:4px">Focus Notes (optional)</label>
    <textarea id="appt-notes" rows="2" style="margin-bottom:10px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit"></textarea>

    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="appt-program-name" placeholder="Name this weekly split, e.g. Sarah's PPL Split" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:8px">
      <button onclick="saveAsProgram()" style="background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer;font-size:12px">Save as Program</button>
    </div>

    <div style="display:flex;gap:8px">
      <button onclick="saveAppointment()" style="flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;cursor:pointer">Save Appointment(s)</button>
      <button onclick="document.getElementById('add-appt-form').style.display='none'" style="background:var(--soft);border:none;border-radius:8px;padding:12px;cursor:pointer">Cancel</button>
    </div>
    <div id="appt-status" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
  </div>`;
  loadSavedProgramsList();
}

async function loadSavedProgramsList(){
  const sel = document.getElementById('appt-load-program');
  if (!sel) return;
  try {
    const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'select', table:'saved_programs', orderBy:'created_at DESC', limit:100 }) });
    const d = await r.json();
    const programs = d.results || [];
    sel.innerHTML = '<option value="">-- Build from scratch --</option>' +
      programs.map(p => `<option value='${p.id}'>${escH(p.name)}</option>`).join('');
    window._savedPrograms = programs;
  } catch(e) {}
}

function loadSavedProgram(){
  const id = document.getElementById('appt-load-program').value;
  if (!id) return;
  const program = (window._savedPrograms || []).find(p => String(p.id) === id);
  if (!program) return;
  let dayRoutines;
  try { dayRoutines = JSON.parse(program.day_routines_json); } catch(e) { return; }
  for (let i = 0; i <= 6; i++) {
    const has = dayRoutines[i] || dayRoutines[String(i)];
    document.getElementById('appt-day-'+i).checked = !!has;
    toggleApptDay(i);
    if (has) {
      document.getElementById('appt-day-'+i+'-program').value = has.program_name || '';
      document.getElementById('appt-day-'+i+'-exercises').value = (has.exercises || []).join(', ');
    }
  }
  document.getElementById('appt-program-name').value = program.name;
}

async function saveAsProgram(){
  const status = document.getElementById('appt-status');
  const name = document.getElementById('appt-program-name').value.trim();
  if (!name) { status.textContent = 'Give the program a name first.'; return; }
  const weekdays = [0,1,2,3,4,5,6].filter(i => document.getElementById('appt-day-'+i).checked);
  const dayRoutines = {};
  for (const i of weekdays) {
    const programName = document.getElementById('appt-day-'+i+'-program').value.trim();
    const exercisesRaw = document.getElementById('appt-day-'+i+'-exercises').value.trim();
    if (programName || exercisesRaw) {
      dayRoutines[i] = { program_name: programName || 'Training Session', exercises: exercisesRaw ? exercisesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [] };
    }
  }
  if (!Object.keys(dayRoutines).length) { status.textContent = "Set up at least one day's routine before saving."; return; }
  const coach = document.getElementById('coach-select').value;
  try {
    await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'insert', table:'saved_programs', values:{ name, coach: coach||null, day_routines_json: JSON.stringify(dayRoutines), created_at: new Date().toISOString() } }) });
    status.textContent = 'Saved "' + name + '" as a reusable program.';
    loadSavedProgramsList();
  } catch(e) { status.textContent = 'Could not save program.'; }
}

const WEEKDAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function refreshBundleRecommendations(){
  const clients = window._loadedClients || [];
  const clientId = document.getElementById('appt-client').value;
  const clientObj = clients.find(c => String(c.id) === clientId);
  const recommendedIds = recommendedBundleIdsForGoalsCrm(clientObj && clientObj.goal_primary);
  for (let i = 0; i <= 6; i++) {
    const sel = document.getElementById('appt-day-'+i+'-bundle');
    if (!sel) continue;
    const current = sel.value;
    sel.innerHTML = '<option value="">-- Custom / type your own --</option>' +
      ROUTINE_LIBRARY.map(b => `<option value="${b.id}">${recommendedIds.has(b.id)?'\u2605 ':''}${b.icon} ${escH(b.name)}${recommendedIds.has(b.id)?' (recommended)':''}</option>`).join('');
    sel.value = current;
  }
}

function toggleApptDay(i) {
  const checked = document.getElementById('appt-day-'+i).checked;
  document.getElementById('appt-day-'+i+'-routine').style.display = checked ? 'block' : 'none';
}

function renderDayRoutineOptions(i) {
  const bundleId = document.getElementById('appt-day-'+i+'-bundle').value;
  const routineSel = document.getElementById('appt-day-'+i+'-routinesel');
  if (!bundleId) { routineSel.style.display = 'none'; routineSel.innerHTML = ''; return; }
  const bundle = ROUTINE_LIBRARY.find(b => b.id === bundleId);
  if (!bundle) return;
  routineSel.innerHTML = '<option value="">-- Pick a day from this split --</option>' +
    bundle.routines.map((r,idx) => `<option value="${idx}">${escH(r.label)}</option>`).join('');
  routineSel.style.display = 'block';
}

const COMPOUND_KEYWORDS = ['squat','deadlift','bench press','press','row','pull-up','pulldown','clean','snatch','lunge','thrust','dip'];
function isCompoundLiftCrm(name){ const n=(name||'').toLowerCase(); return COMPOUND_KEYWORDS.some(k=>n.includes(k)); }

function classifyGoalRepRangeCrm(goalText){
  const g = (goalText||'').toLowerCase();
  if (g.includes('improve strength')) return { bottom:4, top:6, label:'strength' };
  if (g.includes('improve cardio/endurance') || g.includes('lose weight')) return { bottom:12, top:20, label:'endurance/fat-loss' };
  if (/strength|power|1rm|powerlift/.test(g)) return { bottom:4, top:6, label:'strength' };
  if (/endur|fat loss|weight loss|tone|conditioning|cardio/.test(g)) return { bottom:12, top:20, label:'endurance/fat-loss' };
  return { bottom:8, top:12, label:'hypertrophy' };
}

const GOAL_PROGRAM_MAP = {
  'Lose Weight': ['fat_loss_circuit','core_conditioning'],
  'Gain Weight': ['bodybuilding_5day','push_pull_legs'],
  'Build Muscle': ['bodybuilding_5day','push_pull_legs','upper_lower'],
  'Improve Strength': ['strength_5x5','functional_strength'],
  'Improve Cardio/Endurance': ['fat_loss_circuit','core_conditioning'],
  'Tone & Definition': ['full_body','fat_loss_circuit'],
  'General Health & Wellness': ['full_body','beginner_foundation'],
  'Sports Performance': ['athletic_performance','functional_strength'],
  'Injury Recovery/Rehab': ['mobility_recovery'],
  'Flexibility & Mobility': ['mobility_recovery'],
  'Stress Relief/Mental Health': ['mobility_recovery','full_body'],
  'Preparing for an Event': ['full_body','fat_loss_circuit'],
};
function recommendedBundleIdsForGoalsCrm(goalText){
  const goals = (goalText||'').split(',').map(s=>s.trim());
  const ids = new Set();
  goals.forEach(g => (GOAL_PROGRAM_MAP[g]||[]).forEach(id => ids.add(id)));
  return ids;
}

let CLIENT_WORKOUT_HISTORY = {};
async function getClientWorkoutHistory(clientId){
  if (CLIENT_WORKOUT_HISTORY[clientId]) return CLIENT_WORKOUT_HISTORY[clientId];
  try {
    const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'select', table:'workouts', where:{ client_id: parseInt(clientId,10) }, orderBy:'workout_date DESC', limit:60 }) });
    const d = await r.json();
    CLIENT_WORKOUT_HISTORY[clientId] = d.results || [];
  } catch(e) { CLIENT_WORKOUT_HISTORY[clientId] = []; }
  return CLIENT_WORKOUT_HISTORY[clientId];
}

function getExerciseSessionsForClient(history, name, limit){
  limit = limit || 4;
  const out = [];
  for (const w of history) {
    try {
      const exs = JSON.parse(w.exercises_json||'[]') || [];
      const m = exs.find(x => (x.name||'').toLowerCase() === name.toLowerCase());
      if (m && Array.isArray(m.set_detail) && m.set_detail.length) {
        out.push({ date: w.workout_date, sets: m.set_detail });
        if (out.length >= limit) break;
      }
    } catch(e) {}
  }
  return out;
}

function suggestForExerciseCrm(history, name, clientGoal){
  const sessions = getExerciseSessionsForClient(history, name, 4);
  if (!sessions.length) return null;
  const last = sessions[0];
  const reps = last.sets.map(s => parseInt(s.reps)||0);
  const weights = last.sets.map(s => parseFloat(s.weight)||0);
  const minReps = Math.min(...reps);
  const topWt = Math.max(...weights);
  if (!topWt) return null;

  const goalRange = classifyGoalRepRangeCrm(clientGoal);
  const compound = isCompoundLiftCrm(name);
  const bump = compound ? 0.05 : 0.025;
  const maxJump = compound ? 10 : 5;
  const lastText = last.sets.length + 'x' + minReps + ' @ ' + topWt + ' lb (' + (last.date||'') + ')';

  if (sessions.length >= 3) {
    const last3 = sessions.slice(0,3);
    const sameWeight = last3.every(s => Math.max(...s.sets.map(x=>parseFloat(x.weight)||0)) === topWt);
    const noRepGain = last3.every(s => Math.min(...s.sets.map(x=>parseInt(x.reps)||0)) <= minReps);
    if (sameWeight && noRepGain) {
      const deloadWt = Math.round((topWt * 0.9) / 2.5) * 2.5;
      return { last: lastText, suggested: deloadWt + ' lb x ' + goalRange.bottom + ' reps (deload)', reason: 'Same weight/reps 3 sessions running — deload lighter this week, then push again.' };
    }
  }

  if (minReps >= goalRange.top) {
    let bumped = Math.round((topWt * (1 + bump)) / 2.5) * 2.5;
    if (bumped - topWt > maxJump) bumped = topWt + maxJump;
    return { last: lastText, suggested: bumped + ' lb x ' + goalRange.bottom + ' reps', reason: `Hit ${minReps}+ reps — top of ${goalRange.label} range. Step up and reset.` };
  }
  if (minReps >= goalRange.bottom) {
    return { last: lastText, suggested: topWt + ' lb x ' + (minReps+1) + ' reps', reason: `In ${goalRange.label} range — add a rep before adding weight.` };
  }
  return { last: lastText, suggested: topWt + ' lb x ' + (minReps+1) + '+ reps', reason: `Under ${goalRange.label} range (${goalRange.bottom}-${goalRange.top}) — hold and rebuild.` };
}

async function renderDayProgressionPreview(i, exercises){
  const clientId = document.getElementById('appt-client').value;
  const previewEl = document.getElementById('appt-day-'+i+'-preview');
  if (!previewEl) return;
  if (!clientId) { previewEl.innerHTML = '<div style="font-size:11px;color:var(--muted)">Pick a client above to see their progression for these exercises.</div>'; return; }
  previewEl.innerHTML = '<div style="font-size:11px;color:var(--muted)">Loading progression...</div>';
  const clientObj = (window._loadedClients||[]).find(c => String(c.id) === clientId);
  const history = await getClientWorkoutHistory(clientId);
  previewEl.innerHTML = exercises.map(name => {
    const sug = suggestForExerciseCrm(history, name, clientObj && clientObj.goal_primary);
    if (!sug) return `<div style="font-size:11px;padding:4px 0"><b>${escH(name)}</b> — no history yet, start light</div>`;
    return `<div style="font-size:11px;padding:4px 0;border-bottom:1px solid var(--line)">
      <b>${escH(name)}</b><br>Last: ${escH(sug.last)}<br><span style="color:#1E9E5A;font-weight:700">This week: ${escH(sug.suggested)}</span> — ${escH(sug.reason)}
    </div>`;
  }).join('');
}

function applyDayRoutine(i) {
  const bundleId = document.getElementById('appt-day-'+i+'-bundle').value;
  const routineIdx = document.getElementById('appt-day-'+i+'-routinesel').value;
  if (!bundleId || routineIdx === '') return;
  const bundle = ROUTINE_LIBRARY.find(b => b.id === bundleId);
  const routine = bundle?.routines[parseInt(routineIdx,10)];
  if (!routine) return;
  document.getElementById('appt-day-'+i+'-program').value = routine.label;
  document.getElementById('appt-day-'+i+'-exercises').value = routine.exercises.join(', ');
  renderDayProgressionPreview(i, routine.exercises);
}

async function saveAppointment() {
  const status = document.getElementById('appt-status');
  const clientId = document.getElementById('appt-client').value;
  const start = document.getElementById('appt-start').value;
  const weeks = parseInt(document.getElementById('appt-weeks').value, 10) || 1;
  const notes = document.getElementById('appt-notes').value.trim();
  const weekdays = [0,1,2,3,4,5,6].filter(i => document.getElementById('appt-day-'+i).checked);
  if (!clientId || !start || !weekdays.length) { status.textContent = 'Client, start date, and at least one day are required.'; return; }
  const startCheck = new Date(start + 'T00:00:00');
  const minAllowed = new Date(Date.now() + 24*60*60*1000);
  if (startCheck < minAllowed) { status.textContent = 'Needs at least 24 hours notice — pick a later start date.'; return; }
  const endDateObj = new Date(start + 'T00:00:00');
  endDateObj.setDate(endDateObj.getDate() + (weeks * 7) - 1);
  const end = endDateObj.toISOString().slice(0,10);
  const dayRoutines = {};
  for (const i of weekdays) {
    const programEl = document.getElementById('appt-day-'+i+'-program');
    const exercisesEl = document.getElementById('appt-day-'+i+'-exercises');
    const programName = programEl ? programEl.value.trim() : '';
    const exercisesRaw = exercisesEl ? exercisesEl.value.trim() : '';
    if (programName || exercisesRaw) {
      dayRoutines[i] = {
        program_name: programName || 'Training Session',
        exercises: exercisesRaw ? exercisesRaw.split(',').map(s => s.trim()).filter(Boolean) : []
      };
    }
  }
  status.textContent = 'Saving...';
  const coach = document.getElementById('coach-select').value;
  try {
    const body = { client_id: parseInt(clientId,10), start_date: start, end_date: end, weekdays, focus_notes: notes, coach_name: coach, assigned_coach: coach, booked_by: coach };
    if (Object.keys(dayRoutines).length) body.day_routines = dayRoutines;
    else body.program_name = 'Training Session';
    const r = await fetch(WORKER + '/schedule/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.ok) { status.textContent = d.error || 'Could not save.'; return; }
    status.textContent = 'Created ' + d.created_count + ' session(s).';
    loadTodaySchedule();
    setTimeout(() => { document.getElementById('add-appt-form').style.display = 'none'; }, 1000);
  } catch(e) { status.textContent = 'Connection error, try again.'; }
}
