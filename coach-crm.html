<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon-strong.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<link rel="manifest" href="coach-crm-manifest.json">
<title>My Clients — Coach CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#D98A0B;--soft:#F5F6F8;--lred:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
.picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.picker select{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:'Inter';font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;color:inherit}
.card:hover{border-color:var(--red)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:800;font-size:16px;color:var(--muted);flex-shrink:0}
.name{font-weight:700;font-size:14px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.progress-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.progress-label{font-size:9px;color:var(--muted);width:44px;flex-shrink:0;text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.spark{display:flex;align-items:flex-end;gap:1.5px;height:14px;flex-shrink:0}
.spark-bar{width:4px;min-height:2px;border-radius:1px;background:var(--line)}
.progress-pct{font-size:11px;font-weight:800;color:var(--ink);width:30px;text-align:right;flex-shrink:0}
.progress-note{font-size:10px;color:var(--muted)}
.badges{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px}
.badge-red{background:var(--lred);color:var(--red)}
.badge-muted{background:var(--soft);color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center}

@media (max-width:640px){
  .wrap{padding:16px 12px 90px}
  .picker{flex-direction:column;align-items:stretch;gap:8px}
  .picker select{padding:14px;font-size:16px}
  .card{padding:16px;gap:12px}
  .badges{flex-direction:column;align-items:flex-end;gap:4px}
  .name{font-size:15px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Coach <span>CRM</span></div>
  <div style="position:relative;margin-left:auto">
    <button onclick="toggleBell()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;position:relative">&#128276;<span id="bell-badge" style="display:none;position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:10px;padding:1px 5px">0</span></button>
    <div id="bell-drop" style="display:none;position:absolute;top:36px;right:0;width:300px;max-height:400px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:50;color:var(--ink)"></div>
  </div>
  <a href="coach-calendar.html" id="calendar-link" style="margin-left:12px;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700">Calendar</a>
  <a href="coach-service-report.html" style="margin-left:12px;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700">Monthly Report</a>
  <a href="command-center.html" style="margin-left:12px">&larr; Command Center</a>
</div>
<div class="wrap">
  <div id="locked-header" style="display:none;background:var(--ink);color:#fff;border-radius:12px;padding:18px;margin-bottom:16px">
    <div style="font-family:'Oswald';font-size:20px;font-weight:800;text-transform:uppercase" id="locked-name"></div>
    <div style="font-size:12px;color:#9CA3AF;margin-top:2px">Your personal coach portal</div>
  </div>
  <div class="picker" id="picker-box">
    <label style="font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted)">Coach</label>
    <select id="coach-select" onchange="loadClients()">
      <option value="">Select your name</option>
      <option value="Ted Scholl">Ted Scholl</option>
      <option value="Danielle Pellegrini">Danielle Pellegrini</option>
      <option value="Roman Benedetti">Roman Benedetti</option>
      <option value="Marin">Marin</option>
      <option value="Tyler">Tyler</option>
      <option value="James">James</option>
    </select>
  </div>
  <div id="today-schedule"></div>
  <div id="coach-inbox"></div>
  <div style="font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:18px 0 10px">My Clients</div>
  <div id="client-list"><div class="empty">Select your name above to see your clients.</div></div>
</div>
<script>
const WORKER = 'https://broken-cake-e9c2.tedscholl.workers.dev';

function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const saved = localStorage.getItem('coach_crm_name');
const urlParams = new URLSearchParams(location.search);
const URL_COACH = urlParams.get('coach');
const IS_LOCKED = urlParams.get('locked') === '1' && !!URL_COACH;

if (IS_LOCKED) {
  document.getElementById('locked-header').style.display = 'block';
  document.getElementById('locked-name').textContent = URL_COACH;
  document.getElementById('picker-box').style.display = 'none';
  document.getElementById('coach-select').value = URL_COACH;
  document.getElementById('calendar-link').href = 'coach-calendar.html?coach=' + encodeURIComponent(URL_COACH) + '&locked=1';
  localStorage.setItem('coach_crm_name', URL_COACH);
} else if (saved) {
  document.getElementById('coach-select').value = saved;
}


async function loadBell(){
  const coach = document.getElementById('coach-select').value;
  if (!coach) return;
  try {
    const r = await fetch(WORKER + '/coach/notifications?coach=' + encodeURIComponent(coach));
    const d = await r.json();
    const badge = document.getElementById('bell-badge');
    if (d.unread>0){ badge.style.display='block'; badge.textContent=d.unread; } else badge.style.display='none';
    const drop = document.getElementById('bell-drop');
    drop.innerHTML = (d.notifications||[]).map(n=>{
      let p={}; try{p=JSON.parse(n.payload_json||'{}')}catch(e){}
      if (n.type==='self_workout') {
        return `<div style="padding:12px 14px;border-bottom:1px solid var(--line);${n.read?'':'background:var(--lred)'};cursor:pointer" onclick="bellTap(${n.id},${p.client_id},'${escH(p.client_name)}','${escH(p.title)}')">
          <div style="font-size:12px;font-weight:700">\uD83D\uDCAA ${escH(p.client_name)} logged a workout</div>
          <div style="font-size:12px;color:var(--muted)">${escH(p.title)} \u00B7 ${p.exercise_count||0} exercises</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${escH(p.date||'')} \u00B7 tap to send encouragement</div>
        </div>`;
      }
      return '';
    }).join('') || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No notifications</div>';
  } catch(e){}
}

function toggleBell(){
  const drop = document.getElementById('bell-drop');
  drop.style.display = drop.style.display==='none'?'block':'none';
}

async function bellTap(notifId, clientId, clientName, workoutTitle){
  document.getElementById('bell-drop').style.display = 'none';
  await fetch(WORKER + '/coach/notifications/read', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id: notifId})});
  loadBell();
  const msg = prompt('Send ' + clientName + ' a quick reaction to "' + workoutTitle + '":', '\uD83D\uDD25 Great work today, keep pushing!');
  if (!msg) return;
  const coach = document.getElementById('coach-select').value;
  await fetch(WORKER + '/coach/react-workout', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id: clientId, coach_name: coach, body: msg})});
}

async function loadTodaySchedule(){
  const coach = document.getElementById('coach-select').value;
  const box = document.getElementById('today-schedule');
  if (!coach) { box.innerHTML = ''; return; }
  try {
    const r = await fetch(WORKER + '/coach/today-schedule?coach=' + encodeURIComponent(coach));
    const d = await r.json();
    const rows = d.today || [];
    if (!rows.length) {
      box.innerHTML = `<div style="font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Today's Schedule</div>
        <div class="card" style="padding:16px;color:var(--muted);font-size:13px">Nothing scheduled today. Build a schedule from any client's profile.</div>`;
      return;
    }
    box.innerHTML = `<div style="font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Today's Schedule — ${rows.length} client${rows.length===1?'':'s'}</div>` +
      rows.map(s => `<a class="card" href="gym-floor.html?client=${s.client_id}" style="border-left:4px solid var(--red)">
        <div class="avatar">${((s.first_name||'?')[0]+(s.last_name||'')[0]).toUpperCase()}</div>
        <div style="flex:1">
          <div class="name">${escH(s.first_name)} ${escH(s.last_name)}</div>
          <div class="sub">${escH(s.program_name)}${s.focus_notes ? ' — ' + escH(s.focus_notes) : ''}</div>
        </div>
        <div class="badges"><span class="badge badge-red">Start &rarr;</span></div>
      </a>`).join('');
  } catch(e) { box.innerHTML = ''; }
}

async function loadInbox(){
  const coach = document.getElementById('coach-select').value;
  const box = document.getElementById('coach-inbox');
  if (!coach) { box.innerHTML = ''; return; }
  try {
    const r = await fetch(WORKER + '/coach/inbox?coach=' + encodeURIComponent(coach));
    const d = await r.json();
    const threads = d.threads || [];
    const withUnread = threads.filter(t => t.unread_count > 0);
    box.innerHTML = `<div style="font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Inbox${withUnread.length ? ' — ' + withUnread.length + ' unread' : ''}</div>` +
      (threads.length ? threads.slice(0,8).map(t => `
        <a class="card" href="coach-client-profile.html?client=${t.client_id}&coach=${encodeURIComponent(coach)}&tab=chat" style="border-left:${t.unread_count>0?'4px solid var(--red)':'1px solid var(--line)'}">
          <div class="avatar">${escH(t.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div>
          <div style="flex:1;min-width:0">
            <div class="name">${escH(t.name)}</div>
            <div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.last_sender==='coach'?'You: ':''}${escH(t.last_body)}</div>
          </div>
          <div class="badges">${t.unread_count>0?`<span class="badge badge-red">${t.unread_count} new</span>`:''}</div>
        </a>`).join('') : '<div class="empty">No messages yet.</div>');
  } catch(e) { box.innerHTML = ''; }
}

function sparkBars(values, maxVal, colorFn) {
  return values.map(v => {
    const h = maxVal > 0 ? Math.max(2, Math.round((Math.min(v, maxVal) / maxVal) * 14)) : 2;
    const color = colorFn(v);
    return `<div class="spark-bar" style="height:${h}px;background:${color}"></div>`;
  }).join('');
}
function workoutColor(n){ return n >= 3 ? 'var(--green)' : n >= 1 ? 'var(--amber)' : 'var(--line)'; }
function macroColor(pct){ return pct >= 85 ? 'var(--green)' : pct >= 65 ? 'var(--amber)' : 'var(--red)'; }

function renderClientGraphs(c) {
  const weekly = c.workout_weekly_series || [0,0,0,0,0,0,0,0];
  const workoutPctText = c.workout_completion_pct != null ? c.workout_completion_pct + '%' : (c.workout_logged_30d || 0) + 'x';
  const workoutRow = `<div class="progress-row">
      <div class="progress-label">Workouts</div>
      <div class="spark">${sparkBars(weekly, 4, workoutColor)}</div>
      <div class="progress-pct">${workoutPctText}</div>
    </div>`;

  let macroRow;
  if (!c.macro_has_target) {
    macroRow = `<div class="progress-row"><div class="progress-label">Macros</div><div class="progress-note">No macro targets set</div></div>`;
  } else if (!c.macro_days_logged) {
    macroRow = `<div class="progress-row"><div class="progress-label">Macros</div><div class="progress-note">No meals logged yet</div></div>`;
  } else {
    const series = c.macro_series || [];
    const bars = series.map(d => d.pct);
    while (bars.length < 14) bars.unshift(0);
    macroRow = `<div class="progress-row">
        <div class="progress-label">Macros</div>
        <div class="spark">${sparkBars(bars.slice(-14), 100, macroColor)}</div>
        <div class="progress-pct">${c.macro_avg_pct}%</div>
      </div>`;
  }
  return workoutRow + macroRow;
}

async function loadClients(){
  const coach = document.getElementById('coach-select').value;
  const list = document.getElementById('client-list');
  if (!coach){ list.innerHTML = '<div class="empty">Select your name above to see your clients.</div>'; return; }
  localStorage.setItem('coach_crm_name', coach);
  list.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const r = await fetch(WORKER + '/coach/clients?coach=' + encodeURIComponent(coach));
    const d = await r.json();
    const clients = d.clients || [];
    if (!clients.length){ list.innerHTML = '<div class="empty">No clients assigned to you yet.</div>'; return; }
    list.innerHTML = clients.map(c => {
      const initials = ((c.first_name||'?')[0] + (c.last_name||'')[0]).toUpperCase();
      const daysSince = c.last_touchpoint ? Math.floor((Date.now() - new Date(c.last_touchpoint+'Z')) / 86400000) : null;
      const stale = daysSince === null || daysSince > 14;
      return `<a class="card" href="coach-client-profile.html?client=${c.id}&coach=${encodeURIComponent(coach)}">
        <div class="avatar">${escH(initials)}</div>
        <div style="flex:1">
          <div class="name">${escH(c.first_name)} ${escH(c.last_name)}</div>
          ${renderClientGraphs(c)}
        </div>
        <div class="badges">
          ${c.unread_messages > 0 ? `<span class="badge badge-red">${c.unread_messages} new msg</span>` : ''}
          ${stale ? `<span class="badge badge-red">Touch base</span>` : `<span class="badge badge-muted">${daysSince}d ago</span>`}
        </div>
      </a>`;
    }).join('');
  } catch(e) { list.innerHTML = '<div class="empty">Could not load clients.</div>'; }
  loadBell();
  loadTodaySchedule();
  loadInbox();
}
if (saved || IS_LOCKED) loadClients();
setInterval(loadBell, 60000);
</script>
</body>
</html>
