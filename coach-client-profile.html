<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>Client Profile — Coach CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--red-dk:#B0121F;--ink:#15171A;--bg:#E8EBEF;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#D98A0B;--soft:#F0F2F5;--lred:#FEF2F2;--blue:#2563EB}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero-name{font-family:'Oswald';font-size:22px;font-weight:800}
.hero-sub{font-size:12px;color:var(--muted);margin-top:2px}
.sess-pill{margin-left:auto;background:var(--soft);border-radius:10px;padding:10px 16px;text-align:center}
.sess-pill .n{font-family:'Oswald';font-size:22px;font-weight:800}
.sess-pill .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font-family:'Oswald';font-size:12px;font-weight:700;text-transform:uppercase;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pane{display:none}
.pane.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:'Oswald';font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);background:var(--soft)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:none}
.empty{color:var(--muted);padding:16px;text-align:center;font-size:13px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft)}
.tp-item{padding:10px 0;border-bottom:1px solid var(--line)}
.tp-type{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:8px;background:var(--soft);color:var(--muted);margin-right:6px}
.field-row{display:flex;gap:8px;margin-bottom:8px}
.field-row select,.field-row input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.field-row input{flex:1}
.btn{font-family:'Oswald';font-size:12px;font-weight:700;text-transform:uppercase;background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer}
.chat-box{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:13px}
.msg.coach{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:2px}
.msg.client{align-self:flex-start;background:var(--soft);border-bottom-left-radius:2px}
.msg .t{font-size:9px;opacity:.7;margin-top:3px}

@media (max-width:640px){
  .wrap{padding:16px 12px 90px}
  .hero{padding:16px;flex-direction:column;align-items:flex-start;gap:12px}
  .sess-pill{margin-left:0;width:100%}
  .tabs{position:sticky;top:0;background:var(--bg);z-index:10;padding:8px 0;margin:-16px -12px 14px;padding-left:12px;padding-right:12px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:12px 16px;font-size:13px}
  table{display:block}
  thead{display:none}
  tbody{display:block}
  tr{display:block;border-bottom:1px solid var(--line);padding:12px 0}
  td{display:block;border:none;padding:3px 0;font-size:14px}
  td:empty{display:none}
  .photo-grid{grid-template-columns:repeat(3,1fr)}
  .field-row{flex-direction:column}
  .field-row input, .field-row select, .field-row button{width:100%}
  .btn{width:100%;padding:14px;font-size:14px}
  .chat-box{max-height:50vh}
  td[data-label]::before{content:attr(data-label) ": ";font-weight:700;color:var(--ink);margin-right:4px}
}
</style>
</head>

  <div class="tabs">
    <button class="tab active" data-p="overview" onclick="switchPane('overview')">Overview</button>

  <div class="pane active" id="pane-overview">
    <div class="card" id="overview-stats"></div>
    <div id="overview-extra"></div>
  </div>

  <div class="pane" id="pane-workouts">

  </div>

  <div class="pane" id="pane-photos">
    <div class="card"><div class="photo-grid" id="photo-grid"></div></div>
  </div>

  <div class="pane" id="pane-touch">
    <div class="card">
      <div class="field-row">
        <select id="tp-type"><option value="note">Note</option><option value="text">Text</option><option value="call">Call</option><option value="email">Email</option></select>
        <input id="tp-body" placeholder="What did you cover / follow up on?">
        <button class="btn" onclick="logTouchpoint()">Log</button>
      </div>
      <div id="tp-list"></div>
    </div>
  </div>

  <div class="pane" id="pane-chat">
    <div class="card">
      <div class="chat-box" id="chat-box"></div>
      <div class="field-row" style="margin-top:10px">
        <input id="chat-input" placeholder="Message your client...">
        <button class="btn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

</div>

const params = new URLSearchParams(location.search);
const CLIENT_ID = params.get('client');
const COACH_NAME = params.get('coach') || localStorage.getItem('coach_crm_name') || 'Coach';
let DATA = null;

function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(s){ return s ? new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''; }

function switchPane(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.p===name));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active', p.id==='pane-'+name));
  if (name==='chat') markMessagesRead();
}


async function saveRecommendation(){
  const text = document.getElementById('coach-rec-input').value.trim();
  if (!text) return;
  await fetch(WORKER + '/coach/set-recommendation', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id: CLIENT_ID, coach_name: COACH_NAME, text})});
  const r = await fetch(WORKER + `/coach/client-detail?client_id=${CLIENT_ID}`);
  DATA = await r.json();
  load();
}

function renderMuscleBalance(scan) {
  if (!scan || !scan.segmental_json) return '';
  let seg; try { seg = JSON.parse(scan.segmental_json); } catch(e) { return ''; }
  const parts = [['Right Arm',seg.right_arm],['Left Arm',seg.left_arm],['Trunk',seg.trunk],['Right Leg',seg.right_leg],['Left Leg',seg.left_leg]];
  const rows = parts.filter(p => p[1] != null).map(([label,pct]) => {
    const color = pct >= 100 ? 'var(--green)' : pct >= 90 ? 'var(--amber)' : '#DC2626';
    const width = Math.min(100, (pct/140)*100);
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="font-weight:600">${label}</span><span style="font-weight:700;color:${color}">${pct}%</span>
      </div>
      <div style="height:8px;background:var(--soft);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${width}%;background:${color};border-radius:4px"></div>
      </div>
    </div>`;
  }).join('');
  if (!rows) return '';
  return `<div class="card"><div style="font-family:'Oswald';font-size:14px;font-weight:700;text-transform:uppercase;margin-bottom:10px">Muscle Balance</div>${rows}</div>`;
}

  const c = DATA.client || {};
  document.getElementById('c-name').textContent = (c.first_name||'') + ' ' + (c.last_name||'');

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <span style="font-size:11px;color:var(--muted)">${c.coach_recommendation_date ? 'Last updated ' + fmtDate(c.coach_recommendation_date) : 'Not set yet'}</span>
        <button class="btn" onclick="saveRecommendation()" style="padding:8px 16px;font-size:12px">Save</button>
      </div>
    </div>`;

  const allWorkouts = [
    ...(DATA.sessions||[]).map(s=>({date:s.session_date, label:'Coached Session', notes:s.notes||''})),
    ...(DATA.selfWorkouts||[]).map(s=>({date:s.workout_date, label:s.title||'Self-guided', notes:s.notes||''}))
  ].sort((a,b)=> new Date(b.date) - new Date(a.date));
  document.getElementById('workouts-body').innerHTML = allWorkouts.length ? allWorkouts.map(w =>
    `<tr><td data-label="Date">${fmtDate(w.date)}</td><td data-label="Session">${escH(w.label)}</td><td data-label="Notes" style="color:var(--muted)">${escH(w.notes)}</td></tr>`

        </div>

        <div style="display:flex;gap:10px;margin-top:10px">
          <button onclick="closeScheduleModal()" style="flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;cursor:pointer">Cancel</button>
          <button onclick="saveSchedule()" style="flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px;cursor:pointer;font-weight:700">Save Schedule</button>
        </div>
        <div id="sc-msg" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
      </div>
    </div>`);
  scPopulateFilters();
}

let SC_MODE = 'routine';
let SC_SELECTED = [];

function scSwitchMode(mode){
  SC_MODE = mode;
  document.getElementById('sc-mode-routine').style.display = mode==='routine' ? 'block' : 'none';
  document.getElementById('sc-mode-custom').style.display = mode==='custom' ? 'block' : 'none';
  document.getElementById('sc-tab-routine').style.background = mode==='routine' ? 'var(--ink)' : '#fff';
  document.getElementById('sc-tab-routine').style.color = mode==='routine' ? '#fff' : 'var(--ink)';
  document.getElementById('sc-tab-custom').style.background = mode==='custom' ? 'var(--ink)' : '#fff';
  document.getElementById('sc-tab-custom').style.color = mode==='custom' ? '#fff' : 'var(--ink)';
}

function scRenderBundleDays(){
  const idx = document.getElementById('sc-bundle-select').value;
  const box = document.getElementById('sc-bundle-days');
  if (idx === '') { box.innerHTML = ''; return; }
  const bundle = ROUTINE_LIBRARY[idx];
  box.innerHTML = bundle.routines.map((r,i) => `
    <label style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer">
      <input type="radio" name="sc-bundle-day" value="${idx}:${i}">
      <span style="font-size:13px"><b>${escH(r.label)}</b> — ${r.exercises.length} exercises</span>
    </label>`).join('');
}

function scPopulateFilters(){
  const parts = [...new Set(EXERCISE_DB.map(e=>e.body_part))].sort();
  const equips = [...new Set(EXERCISE_DB.map(e=>e.equipment))].sort();
  const mechs = [...new Set(EXERCISE_DB.map(e=>e.mechanics))].sort();
  const types = [...new Set(EXERCISE_DB.map(e=>e.type))].sort();
  document.getElementById('sc-f-part').innerHTML += parts.map(p=>`<option value="${p}">${p}</option>`).join('');
  document.getElementById('sc-f-equip').innerHTML += equips.map(p=>`<option value="${p}">${p}</option>`).join('');
  document.getElementById('sc-f-mech').innerHTML += mechs.map(p=>`<option value="${p}">${p}</option>`).join('');
  document.getElementById('sc-f-type').innerHTML += types.map(p=>`<option value="${p}">${p}</option>`).join('');
  scFilterExercises();
}

function scFilterExercises(){
  const q = (document.getElementById('sc-ex-search').value||'').toLowerCase();
  const part = document.getElementById('sc-f-part').value;
  const equip = document.getElementById('sc-f-equip').value;
  const mech = document.getElementById('sc-f-mech').value;
  const type = document.getElementById('sc-f-type').value;
  const results = EXERCISE_DB.filter(e =>
    (!q || e.name.toLowerCase().includes(q)) &&
    (!part || e.body_part===part) && (!equip || e.equipment===equip) &&
    (!mech || e.mechanics===mech) && (!type || e.type===type)
  ).slice(0,40);
  document.getElementById('sc-ex-results').innerHTML = results.length ? results.map(e => `
    <div onclick='scAddExercise(${JSON.stringify(e.name)})' style="padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px">
      <b>${escH(e.name)}</b> <span style="color:var(--muted);font-size:11px">${e.body_part} &middot; ${e.equipment}</span>
    </div>`).join('') : '<div style="padding:12px;color:var(--muted);font-size:13px">No matches.</div>';
}

function scAddExercise(name){
  if (SC_SELECTED.some(x => x.name.toLowerCase() === name.toLowerCase())) return;
  SC_SELECTED.push({name, kind:'weighted', sets:'3', reps:'10', weight:'', duration:''});
  scRenderSelected();
}

function scAddManualExercise(){
  const input = document.getElementById('sc-manual-name');
  const name = input.value.trim();
  if (!name) return;
  scAddExercise(name);
  input.value = '';
}

function scRemoveExercise(i){
  SC_SELECTED.splice(i, 1);
  scRenderSelected();
}

function scUpdateField(i, field, value){
  SC_SELECTED[i][field] = value;
}

function scSetKind(i, kind){
  SC_SELECTED[i].kind = kind;
  scRenderSelected();
}

function scPrescriptionText(item){
  if (item.kind === 'time') return item.duration ? item.duration : '';
  if (item.kind === 'bodyweight') return (item.sets && item.reps) ? `${item.sets}x${item.reps} (bodyweight)` : '';
  return (item.sets && item.reps) ? `${item.sets}x${item.reps}${item.weight ? ' @ '+item.weight+'lb' : ''}` : '';
}

function scRenderSelected(){
  const box = document.getElementById('sc-selected-list');
  if (!SC_SELECTED.length) { box.innerHTML = '<span style="color:var(--muted)">None selected yet — search above, or add a custom exercise.</span>'; return; }
  box.innerHTML = SC_SELECTED.map((item, i) => `
    <div style="border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="font-size:13px">${escH(item.name)}</b>
        <span onclick="scRemoveExercise(${i})" style="cursor:pointer;color:var(--red);font-weight:700;font-size:16px;line-height:1">&times;</span>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <button onclick="scSetKind(${i},'weighted')" style="flex:1;font-size:10px;padding:5px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-weight:700;text-transform:uppercase;background:${item.kind==='weighted'?'var(--ink)':'#fff'};color:${item.kind==='weighted'?'#fff':'var(--ink)'}">Sets/Reps/Weight</button>
        <button onclick="scSetKind(${i},'bodyweight')" style="flex:1;font-size:10px;padding:5px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-weight:700;text-transform:uppercase;background:${item.kind==='bodyweight'?'var(--ink)':'#fff'};color:${item.kind==='bodyweight'?'#fff':'var(--ink)'}">Sets/Reps Only</button>
        <button onclick="scSetKind(${i},'time')" style="flex:1;font-size:10px;padding:5px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-weight:700;text-transform:uppercase;background:${item.kind==='time'?'var(--ink)':'#fff'};color:${item.kind==='time'?'#fff':'var(--ink)'}">By Time</button>
      </div>
      ${item.kind === 'time' ? `
        <input placeholder="e.g. 45s, or 3 rounds x 30s" value="${escH(item.duration)}" oninput="scUpdateField(${i},'duration',this.value)" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px">
      ` : `
        <div style="display:flex;gap:6px">
          <input placeholder="Sets" value="${escH(item.sets)}" oninput="scUpdateField(${i},'sets',this.value)" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px">
          <input placeholder="Reps" value="${escH(item.reps)}" oninput="scUpdateField(${i},'reps',this.value)" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px">
          ${item.kind === 'weighted' ? `<input placeholder="Weight (lb)" value="${escH(item.weight)}" oninput="scUpdateField(${i},'weight',this.value)" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px">` : ''}
        </div>
      `}
    </div>`).join('');
}

function openScheduleModal(){
  document.getElementById('schedule-modal').style.display='flex';
  SC_SELECTED = [];
  SC_MODE = 'routine';
  setTimeout(() => { scSwitchMode('routine'); scRenderSelected(); }, 0);
}
function closeScheduleModal(){ document.getElementById('schedule-modal').style.display='none'; }

async function saveSchedule(){
  const program = document.getElementById('sc-program').value.trim();
  const notes = document.getElementById('sc-notes').value.trim();
  const weekdays = Array.from(document.querySelectorAll('.sc-day:checked')).map(c => parseInt(c.value));
  const start = document.getElementById('sc-start').value;
  const end = document.getElementById('sc-end').value;
  const msg = document.getElementById('sc-msg');
  if (!program || !weekdays.length || !start || !end) { msg.textContent = 'Name the day, at least one repeat day, and both dates are required.'; return; }

  let exercises = [];
  if (SC_MODE === 'routine') {
    const picked = document.querySelector('input[name="sc-bundle-day"]:checked');
    if (!picked) { msg.textContent = 'Pick a program day, or switch to Build Custom.'; return; }
    const [bIdx, rIdx] = picked.value.split(':').map(Number);
    exercises = ROUTINE_LIBRARY[bIdx].routines[rIdx].exercises.map(n => ({name: n, prescription: ''}));
  } else {
    if (!SC_SELECTED.length) { msg.textContent = 'Add at least one exercise, or switch to Use a Routine.'; return; }
    exercises = SC_SELECTED.map(item => ({name: item.name, prescription: scPrescriptionText(item)}));
  }

  msg.textContent = 'Building schedule...';
  const r = await fetch(WORKER + '/schedule/create', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id: CLIENT_ID, program_name: program, focus_notes: notes, weekdays, start_date: start, end_date: end, coach_name: COACH_NAME, exercises})});
  const d = await r.json();
  if (d.created_count != null) { closeScheduleModal(); load(); }
  else { msg.textContent = d.error || 'Something went wrong.'; }
}

async function editScheduleItem(s){
  const newDate = prompt('Reschedule to (YYYY-MM-DD), or leave as-is:', s.scheduled_date);
  if (newDate === null) return;
  const newProgram = prompt('Program name:', s.program_name || '');
  if (newProgram === null) return;
  const newNotes = prompt('Focus notes:', s.focus_notes || '');
  await fetch(WORKER + '/schedule/update', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id: s.id, scheduled_date: newDate, program_name: newProgram, focus_notes: newNotes||''})});
  load();
}

async function cancelSchedule(id){
  await fetch(WORKER + '/schedule/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
  load();
}

function renderTouchpoints(){
  const tps = DATA.touchpoints || [];
  document.getElementById('tp-list').innerHTML = tps.length ? tps.map(t => `
    <div class="tp-item"><span class="tp-type">${escH(t.type)}</span>${escH(t.body)}
      <div style="font-size:10px;color:var(--muted);margin-top:4px">${escH(t.coach_name)} \\u00B7 ${fmtDate(t.created_at)}</div>
    </div>`).join('') : '<div class="empty">No touchpoints logged yet.</div>';
}

async function logTouchpoint(){
  const type = document.getElementById('tp-type').value;
  const body = document.getElementById('tp-body').value.trim();
  if (!body) return;
  await fetch(WORKER + '/coach/touchpoint', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id:CLIENT_ID, coach_name:COACH_NAME, type, body})});
  document.getElementById('tp-body').value = '';
  const r = await fetch(WORKER + `/coach/client-detail?client_id=${CLIENT_ID}`);
  DATA = await r.json();
  renderTouchpoints();
}

function renderChat(){
  const msgs = DATA.messages || [];
  const box = document.getElementById('chat-box');
  box.innerHTML = msgs.length ? msgs.map(m => `
    <div class="msg ${m.sender==='coach'?'coach':'client'}">${escH(m.body)}<div class="t">${fmtDate(m.created_at)}</div></div>
  `).join('') : '<div class="empty">No messages yet. Say hi!</div>';
  box.scrollTop = box.scrollHeight;
}

async function sendChat(){
  const input = document.getElementById('chat-input');
  const body = input.value.trim();
  if (!body) return;
  await fetch(WORKER + '/portal/messages/send', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id:CLIENT_ID, coach_name:COACH_NAME, sender:'coach', body})});
  input.value = '';
  const r = await fetch(WORKER + `/portal/messages?client_id=${CLIENT_ID}`);
  const d = await r.json();
  DATA.messages = d.messages || [];
  renderChat();
}

async function markMessagesRead(){
  await fetch(WORKER + '/portal/messages/read', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id:CLIENT_ID, mark_sender:'client'})});
}

load();
</script>
</body>
</html>
