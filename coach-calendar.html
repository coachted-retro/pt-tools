<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Coach Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#D98A0B;--soft:#F5F6F8;--lred:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:16px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 12px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:600px;margin:0 auto;padding:16px 14px 90px}
.picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.picker select{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer}
.month-nav .label{font-family:'Oswald';font-size:18px;font-weight:800;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.day{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:13px}
.day.empty{background:transparent;border:none;cursor:default}
.day.today{border-color:var(--red);border-width:2px}
.day .n{font-weight:600}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:3px}
.day-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.day-panel h3{font-family:'Oswald';font-size:15px;text-transform:uppercase;margin-bottom:10px}
.sess-item{padding:10px 0;border-bottom:1px solid var(--line)}
.sess-item:last-child{border-bottom:none}
.sess-item .top{display:flex;justify-content:space-between;align-items:center}
.sess-item .name{font-weight:700;font-size:14px}
.sess-item .prog{font-size:13px;color:var(--muted)}
.edit-btn{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;font-weight:700}
.empty-state{color:var(--muted);text-align:center;padding:20px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:min(400px,92vw)}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;margin-bottom:10px}
.modal-box .row{display:flex;gap:10px}
.modal-box button{flex:1;border-radius:8px;padding:10px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Coach <span>Calendar</span></div>
  <a href="coach-crm.html">&larr; My Clients</a>
</div>
<div class="wrap">
  <div class="picker">
    <select id="coach-select" onchange="init()">
      <option value="">All Coaches</option>
      <option value="Ted Scholl">Ted Scholl</option>
      <option value="Danielle Pellegrini">Danielle Pellegrini</option>
      <option value="Roman Benedetti">Roman Benedetti</option>
      <option value="Marin">Marin</option>
      <option value="Tyler">Tyler</option>
      <option value="James">James</option>
    </select>
  </div>
  <div class="month-nav">
    <button onclick="shiftMonth(-1)">&lsaquo;</button>
    <div class="label" id="month-label"></div>
    <button onclick="shiftMonth(1)">&rsaquo;</button>
  </div>
  <div class="grid" id="dow-row"></div>
  <div class="grid" id="cal-grid"></div>
  <div class="day-panel" id="day-panel"><div class="empty-state">Tap a day to see what's scheduled.</div></div>
</div>

<div class="modal" id="edit-modal">
  <div class="modal-box">
    <div style="font-family:'Oswald';font-size:16px;font-weight:800;text-transform:uppercase;margin-bottom:12px" id="edit-title">Edit Session</div>
    <label style="font-size:11px;color:var(--muted)">Date</label>
    <input type="date" id="e-date">
    <label style="font-size:11px;color:var(--muted)">Program</label>
    <input id="e-program" placeholder="Program name">
    <label style="font-size:11px;color:var(--muted)">Focus notes</label>
    <textarea id="e-notes" rows="2" placeholder="Optional"></textarea>
    <label style="font-size:11px;color:var(--muted)">Assigned Coach — sub someone in if needed</label>
    <select id="e-coach">
      <option value="Ted Scholl">Ted Scholl</option>
      <option value="Danielle Pellegrini">Danielle Pellegrini</option>
      <option value="Roman Benedetti">Roman Benedetti</option>
      <option value="Marin">Marin</option>
      <option value="Tyler">Tyler</option>
      <option value="James">James</option>
    </select>
    <div class="row" style="margin-top:8px">
      <button onclick="closeEdit()" style="border:1px solid var(--line);background:#fff">Cancel</button>
      <button onclick="deleteSession()" style="border:1px solid var(--red);background:#fff;color:var(--red)">Delete</button>
      <button onclick="saveEdit()" style="background:var(--red);color:#fff;border:none">Save</button>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://broken-cake-e9c2.tedscholl.workers.dev';
let VIEW_MONTH = new Date();
let MONTH_DAYS = {};
let EDIT_ID = null;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(s){ return s ? new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''; }

function init(){
  document.getElementById('dow-row').innerHTML = ['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  renderCalendar();
}

function shiftMonth(n){
  VIEW_MONTH.setMonth(VIEW_MONTH.getMonth()+n);
  renderCalendar();
}

async function renderCalendar(){
  const y = VIEW_MONTH.getFullYear(), m = VIEW_MONTH.getMonth();
  document.getElementById('month-label').textContent = VIEW_MONTH.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const monthStr = y + '-' + String(m+1).padStart(2,'0');
  const coach = document.getElementById('coach-select').value;
  try {
    const r = await fetch(WORKER + `/schedule/month?month=${monthStr}` + (coach?`&coach=${encodeURIComponent(coach)}`:''));
    const d = await r.json();
    MONTH_DAYS = {};
    (d.days||[]).forEach(row => MONTH_DAYS[row.scheduled_date] = row.n);
  } catch(e) { MONTH_DAYS = {}; }

  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  let cells = '';
  for (let i=0; i<firstDow; i++) cells += '<div class="day empty"></div>';
  for (let day=1; day<=daysInMonth; day++){
    const dateStr = monthStr + '-' + String(day).padStart(2,'0');
    const has = MONTH_DAYS[dateStr];
    cells += `<div class="day ${dateStr===todayStr?'today':''}" onclick="openDay('${dateStr}')">
      <div class="n">${day}</div>${has ? '<div class="dot"></div>' : ''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cells;
}

async function openDay(dateStr){
  const coach = document.getElementById('coach-select').value;
  const panel = document.getElementById('day-panel');
  panel.innerHTML = '<div class="empty-state">Loading...</div>';
  const r = await fetch(WORKER + `/schedule/day?date=${dateStr}` + (coach?`&coach=${encodeURIComponent(coach)}`:''));
  const d = await r.json();
  const rows = d.sessions || [];
  panel.innerHTML = `<h3>${new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</h3>` +
    (rows.length ? rows.map(s => `
      <div class="sess-item">
        <div class="top">
          <div>
            <div class="name">${esc(s.first_name)} ${esc(s.last_name)}</div>
            <div class="prog">${esc(s.program_name)}${s.focus_notes ? ' — ' + esc(s.focus_notes) : ''}</div>
            <div class="prog" style="margin-top:2px">Coach: ${esc(s.assigned_coach || s.default_coach || '—')}</div>
          </div>
          <button class="edit-btn" onclick='openEdit(${JSON.stringify(s).replace(/'/g,"&apos;")})'>Edit</button>
        </div>
      </div>`).join('') : '<div class="empty-state">Nothing scheduled this day.</div>');
}

function openEdit(s){
  EDIT_ID = s.id;
  document.getElementById('edit-title').textContent = 'Edit — ' + s.first_name + ' ' + s.last_name;
  document.getElementById('e-date').value = s.scheduled_date;
  document.getElementById('e-program').value = s.program_name || '';
  document.getElementById('e-notes').value = s.focus_notes || '';
  document.getElementById('e-coach').value = s.assigned_coach || s.default_coach || '';
  document.getElementById('edit-modal').style.display = 'flex';
}
function closeEdit(){ document.getElementById('edit-modal').style.display = 'none'; }

async function saveEdit(){
  const payload = {
    id: EDIT_ID,
    scheduled_date: document.getElementById('e-date').value,
    program_name: document.getElementById('e-program').value.trim(),
    focus_notes: document.getElementById('e-notes').value.trim(),
    assigned_coach: document.getElementById('e-coach').value
  };
  await fetch(WORKER + '/schedule/update', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  closeEdit();
  renderCalendar();
  document.getElementById('day-panel').innerHTML = '<div class="empty-state">Updated. Tap a day to review.</div>';
}

async function deleteSession(){
  if (!EDIT_ID) return;
  await fetch(WORKER + '/schedule/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: EDIT_ID})});
  closeEdit();
  renderCalendar();
  document.getElementById('day-panel').innerHTML = '<div class="empty-state">Removed. Tap a day to review.</div>';
}

init();
</script>
</body>
</html>
