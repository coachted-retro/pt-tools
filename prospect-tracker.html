<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Tracker — Retro Fitness vv1780068474</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #00e5a0;
    --accent2: #ff6b35;
    --warm: #ffb830;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --hot: #ff4444;
    --warm-c: #ffb830;
    --cold: #4488ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    font-family: 'Barlow', sans-serif; transition: all .2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .logo-text { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 1px; color: var(--accent); }
  .logo-sub { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .header-right { display: flex; gap: 10px; align-items: center; }
  .btn-primary {
    background: var(--accent); color: #000; border: none; padding: 9px 20px;
    border-radius: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 14px; letter-spacing: .5px; cursor: pointer; transition: all .2s;
  }
  .btn-primary:hover { background: #00ffb3; transform: translateY(-1px); }
  .btn-outline {
    background: none; color: var(--text); border: 1px solid var(--border); padding: 8px 16px;
    border-radius: 8px; font-family: 'Barlow', sans-serif; font-size: 13px; cursor: pointer; transition: all .2s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  /* LAYOUT */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* STATS BAR */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; text-align: center;
  }
  .stat-num { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
  .stat-hot .stat-num { color: var(--hot); }
  .stat-warm .stat-num { color: var(--warm-c); }
  .stat-cold .stat-num { color: var(--cold); }
  .stat-total .stat-num { color: var(--accent); }

  /* MAIN GRID */
  .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }

  /* ADD PROSPECT FORM */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .panel-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-title { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
  .panel-body { padding: 20px; }

  .form-group { margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 7px; font-family: 'Barlow', sans-serif; font-size: 14px;
    transition: border-color .2s; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 80px; }

  .interest-btns { display: flex; gap: 8px; }
  .interest-btn {
    flex: 1; padding: 8px; border: 2px solid var(--border); background: none;
    border-radius: 7px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: .5px; transition: all .2s; color: var(--muted);
  }
  .interest-btn.hot { border-color: var(--hot); color: var(--hot); }
  .interest-btn.hot.active { background: var(--hot); color: #fff; }
  .interest-btn.warm { border-color: var(--warm-c); color: var(--warm-c); }
  .interest-btn.warm.active { background: var(--warm-c); color: #000; }
  .interest-btn.cold { border-color: var(--cold); color: var(--cold); }
  .interest-btn.cold.active { background: var(--cold); color: #fff; }

  /* PROSPECT LIST */
  .search-bar {
    padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px;
  }
  .search-bar input { margin: 0; }

  .prospect-list { max-height: 600px; overflow-y: auto; }
  .prospect-item {
    border-bottom: 1px solid var(--border); padding: 14px 20px; cursor: pointer;
    transition: background .15s; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start;
  }
  .prospect-item:hover { background: var(--surface2); }
  .prospect-item.active { background: rgba(0,229,160,.07); border-left: 3px solid var(--accent); }
  .prospect-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .prospect-meta { font-size: 12px; color: var(--muted); }
  .prospect-type { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .interest-badge {
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase; font-family: 'Barlow Condensed', sans-serif;
  }
  .badge-hot { background: rgba(255,68,68,.15); color: var(--hot); }
  .badge-warm { background: rgba(255,184,48,.15); color: var(--warm-c); }
  .badge-cold { background: rgba(68,136,255,.15); color: var(--cold); }
  .last-touch { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* DETAIL PANEL */
  .detail-panel { display: none; }
  .detail-panel.visible { display: block; }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 300px; color: var(--muted); text-align: center; gap: 10px;
  }
  .empty-icon { font-size: 48px; opacity: .3; }

  .detail-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
  .detail-name { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; }
  .detail-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .detail-actions { display: flex; gap: 8px; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px; border-bottom: 1px solid var(--border); }
  .info-item label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .info-value { font-size: 14px; font-weight: 500; }

  /* TOUCHPOINT LOG */
  .touchpoint-section { padding: 20px; }
  .touchpoint-section h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  .add-touchpoint { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .tp-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: end; }
  .btn-add-tp {
    background: var(--accent); color: #000; border: none; padding: 9px 16px; border-radius: 7px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all .2s;
  }
  .btn-add-tp:hover { background: #00ffb3; }

  .tp-history { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
  .tp-entry {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    position: relative;
  }
  .tp-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tp-date { font-size: 11px; color: var(--accent); font-weight: 600; }
  .tp-advisor { font-size: 11px; color: var(--muted); }
  .tp-outcome { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .outcome-interested { background: rgba(0,229,160,.15); color: var(--accent); }
  .outcome-callback { background: rgba(255,184,48,.15); color: var(--warm-c); }
  .outcome-notinterested { background: rgba(255,68,68,.15); color: var(--hot); }
  .outcome-leftmessage { background: rgba(68,136,255,.15); color: var(--cold); }
  .outcome-other { background: rgba(107,107,133,.15); color: var(--muted); }
  .tp-notes { font-size: 13px; color: var(--text); line-height: 1.5; }

  .status-msg { padding: 10px 14px; border-radius: 7px; font-size: 13px; margin-top: 10px; display: none; }
  .status-msg.success { background: rgba(0,229,160,.15); color: var(--accent); border: 1px solid rgba(0,229,160,.3); display: block; }
  .status-msg.error { background: rgba(255,68,68,.15); color: var(--hot); border: 1px solid rgba(255,68,68,.3); display: block; }

  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='index.html'">← Hub</button>
    <div>
      <div class="logo-text">PROSPECT TRACKER</div>
      <div class="logo-sub">Retro Fitness of Fairless Hills</div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-outline" onclick="openSheet()">View Sheet</button>
    <button class="btn-primary" onclick="showAddForm()">+ Add Prospect</button>
  </div>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card stat-total"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Prospects</div></div>
    <div class="stat-card stat-hot"><div class="stat-num" id="stat-hot">0</div><div class="stat-label">Hot</div></div>
    <div class="stat-card stat-warm"><div class="stat-num" id="stat-warm">0</div><div class="stat-label">Warm</div></div>
    <div class="stat-card stat-cold"><div class="stat-num" id="stat-cold">0</div><div class="stat-label">Cold</div></div>
  </div>

  <div class="main-grid">
    <!-- LEFT: Add Form + List -->
    <div>
      <!-- Add Prospect Form -->
      <div class="panel" id="add-form-panel" style="margin-bottom:16px;display:none">
        <div class="panel-header">
          <span class="panel-title">New Prospect</span>
          <button class="btn-outline" onclick="hideAddForm()" style="padding:4px 10px;font-size:12px">Cancel</button>
        </div>
        <div class="panel-body">
          <div class="form-row">
            <div class="form-group"><label>First Name *</label><input id="f-first" placeholder="First"></div>
            <div class="form-group"><label>Last Name *</label><input id="f-last" placeholder="Last"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Phone *</label><input id="f-phone" placeholder="(215) 555-0000"></div>
            <div class="form-group"><label>Email</label><input id="f-email" placeholder="email@example.com"></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Type</label>
              <select id="f-type">
                <option>Gym Member</option>
                <option>Walk-In</option>
                <option>Referral</option>
                <option>Social Media</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Timeframe</label>
              <select id="f-timeframe">
                <option>ASAP</option>
                <option>1-2 weeks</option>
                <option>1 month</option>
                <option>2-3 months</option>
                <option>Just browsing</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Referred By</label>
            <input id="f-referred" placeholder="Name of referral source (optional)">
          </div>
          <div class="form-group">
            <label>Interest Level</label>
            <div class="interest-btns">
              <button class="interest-btn hot" onclick="setInterest('Hot')">🔥 Hot</button>
              <button class="interest-btn warm" onclick="setInterest('Warm')">⚡ Warm</button>
              <button class="interest-btn cold" onclick="setInterest('Cold')">❄️ Cold</button>
            </div>
            <input type="hidden" id="f-interest" value="Warm">
          </div>
          <div class="form-group">
            <label>Initial Notes</label>
            <textarea id="f-notes" placeholder="What did they say? What are they looking for?" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>Advisor</label>
            <input id="f-advisor" placeholder="Your name">
          </div>
          <button class="btn-primary" style="width:100%;padding:11px" onclick="addProspect()">Save Prospect</button>
          <div class="status-msg" id="add-status"></div>
        </div>
      </div>

      <!-- Prospect List -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Prospects</span>
          <span id="list-count" style="font-size:12px;color:var(--muted)">Loading...</span>
        </div>
        <div class="search-bar">
          <input id="search-input" placeholder="Search by name, phone, or notes..." oninput="filterProspects()">
        </div>
        <div class="prospect-list" id="prospect-list">
          <div class="empty-state"><div class="empty-icon">👥</div><div>No prospects yet</div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Detail + Touchpoints -->
    <div class="panel">
      <div id="empty-detail" class="empty-state" style="height:400px">
        <div class="empty-icon">👆</div>
        <div>Select a prospect to view details</div>
      </div>
      <div id="detail-view" style="display:none">
        <div class="detail-header">
          <div>
            <div class="detail-name" id="d-name"></div>
            <div class="detail-meta" id="d-meta"></div>
          </div>
          <div class="detail-actions">
            <span class="interest-badge" id="d-badge"></span>
          </div>
        </div>
        <div class="info-grid">
          <div class="info-item"><label>Phone</label><div class="info-value" id="d-phone"></div></div>
          <div class="info-item"><label>Email</label><div class="info-value" id="d-email"></div></div>
          <div class="info-item"><label>Type</label><div class="info-value" id="d-type"></div></div>
          <div class="info-item"><label>Timeframe</label><div class="info-value" id="d-timeframe"></div></div>
          <div class="info-item"><label>Referred By</label><div class="info-value" id="d-referred"></div></div>
          <div class="info-item"><label>Added By</label><div class="info-value" id="d-advisor"></div></div>
        </div>
        <div class="touchpoint-section">
          <h3>Touchpoint Log</h3>
          <div class="add-touchpoint">
            <div class="tp-row">
              <div><label>Date</label><input type="date" id="tp-date"></div>
              <div>
                <label>Outcome</label>
                <select id="tp-outcome">
                  <option value="Interested">Interested</option>
                  <option value="Callback">Callback Requested</option>
                  <option value="LeftMessage">Left Message</option>
                  <option value="NotInterested">Not Interested</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div style="padding-top:18px"><button class="btn-add-tp" onclick="addTouchpoint()">+ Log</button></div>
            </div>
            <div class="form-row">
              <div><label>Your Name</label><input id="tp-advisor" placeholder="Advisor name"></div>
            </div>
            <div><label>Notes</label><textarea id="tp-notes" placeholder="What happened? What did they say?" rows="2"></textarea></div>
            <div class="status-msg" id="tp-status"></div>
          </div>
          <div class="tp-history" id="tp-history"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const WORKER = 'https://broken-cake-e9c2.tedscholl.workers.dev/sheets-write';
const SHEET_LINK = 'https://docs.google.com/spreadsheets/d/1sSLy4Zuai4Vrh1GjyRXgfXoLCBLDuLYfLdKz3VWiT4g';
const PROSPECT_TAB = 'Prospects';
const TOUCHPOINT_TAB = 'Touchpoints';

let prospects = [];
let touchpoints = [];
let selectedId = null;
let interestVal = 'Warm';

function openSheet() { window.open(SHEET_LINK, '_blank'); }
function showAddForm() { document.getElementById('add-form-panel').style.display='block'; }
function hideAddForm() { document.getElementById('add-form-panel').style.display='none'; }

function setInterest(val) {
  interestVal = val;
  document.getElementById('f-interest').value = val;
  document.querySelectorAll('.interest-btn').forEach(b => b.classList.remove('active'));
  const cls = val.toLowerCase();
  const btn = document.querySelector('.interest-btn.' + cls);
  if (btn) btn.classList.add('active');
}

function gv(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'status-msg ' + type;
  el.textContent = msg;
  if (type === 'success') setTimeout(() => { el.className = 'status-msg'; }, 3000);
}

async function writeToSheet(tab, row) {
  try {
    const resp = await fetch(WORKER, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({tab, row})
    });
    const data = JSON.parse(await resp.text());
    return data.ok;
  } catch(e) { console.error('Sheet write failed:', e); return false; }
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function saveLocal() {
  localStorage.setItem('pt_prospects', JSON.stringify(prospects));
  localStorage.setItem('pt_touchpoints', JSON.stringify(touchpoints));
}

function loadLocal() {
  try { prospects = JSON.parse(localStorage.getItem('pt_prospects') || '[]'); } catch(e) { prospects = []; }
  try { touchpoints = JSON.parse(localStorage.getItem('pt_touchpoints') || '[]'); } catch(e) { touchpoints = []; }
}

async function addProspect() {
  const first = gv('f-first'), last = gv('f-last'), phone = gv('f-phone');
  if (!first || !last || !phone) { setStatus('add-status','error','Name and phone are required.'); return; }
  const prospect = {
    id: genId(),
    name: first + ' ' + last,
    phone, email: gv('f-email'),
    type: gv('f-type'), timeframe: gv('f-timeframe'),
    referred: gv('f-referred'), interest: interestVal,
    notes: gv('f-notes'), advisor: gv('f-advisor'),
    date: new Date().toLocaleDateString('en-US')
  };
  prospects.unshift(prospect);
  saveLocal();
  const row = [prospect.date, prospect.name, prospect.phone, prospect.email, prospect.type, prospect.interest, prospect.timeframe, prospect.referred, prospect.advisor, prospect.notes];
  const ok = await writeToSheet(PROSPECT_TAB, row);
  setStatus('add-status', ok ? 'success' : 'error', ok ? 'Prospect saved!' : 'Saved locally. Sheet write failed.');
  renderList();
  updateStats();
  hideAddForm();
  clearForm();
}

function clearForm() {
  ['f-first','f-last','f-phone','f-email','f-referred','f-notes','f-advisor'].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = '';
  });
  setInterest('Warm');
}

async function addTouchpoint() {
  if (!selectedId) return;
  const date = gv('tp-date') || new Date().toLocaleDateString('en-US');
  const notes = gv('tp-notes'), outcome = gv('tp-outcome'), advisor = gv('tp-advisor');
  if (!notes) { setStatus('tp-status','error','Please add notes.'); return; }
  const tp = { id: genId(), prospectId: selectedId, date, outcome, notes, advisor };
  touchpoints.unshift(tp);
  saveLocal();
  const p = prospects.find(x => x.id === selectedId);
  const row = [date, p ? p.name : selectedId, outcome, notes, advisor];
  const ok = await writeToSheet(TOUCHPOINT_TAB, row);
  setStatus('tp-status', ok ? 'success' : 'error', ok ? 'Touchpoint logged!' : 'Saved locally. Sheet write failed.');
  document.getElementById('tp-notes').value = '';
  renderTouchpoints(selectedId);
}

function renderList(filter='') {
  const el = document.getElementById('prospect-list');
  const fl = filter.toLowerCase();
  const filtered = prospects.filter(p =>
    !fl || p.name.toLowerCase().includes(fl) || p.phone.includes(fl) ||
    (p.notes||'').toLowerCase().includes(fl)
  );
  document.getElementById('list-count').textContent = filtered.length + ' prospect' + (filtered.length!==1?'s':'');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>No matches</div></div>';
    return;
  }
  el.innerHTML = filtered.map(p => {
    const tps = touchpoints.filter(t => t.prospectId === p.id);
    const last = tps[0];
    const badgeClass = 'badge-' + p.interest.toLowerCase();
    return '<div class="prospect-item' + (p.id===selectedId?' active':'') + '" onclick="selectProspect('' + p.id + '')">' +
      '<div>' +
        '<div class="prospect-name">' + p.name + '</div>' +
        '<div class="prospect-meta">' + p.phone + (p.email?' · '+p.email:'') + '</div>' +
        '<div class="prospect-type">' + p.type + ' · ' + p.timeframe + '</div>' +
        (last ? '<div class="last-touch">Last: ' + last.date + ' — ' + last.outcome + '</div>' : '') +
      '</div>' +
      '<div><span class="interest-badge ' + badgeClass + '">' + p.interest + '</span></div>' +
    '</div>';
  }).join('');
}

function selectProspect(id) {
  selectedId = id;
  const p = prospects.find(x => x.id === id);
  if (!p) return;
  document.getElementById('empty-detail').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('d-name').textContent = p.name;
  document.getElementById('d-meta').textContent = 'Added ' + p.date + (p.advisor ? ' by ' + p.advisor : '');
  document.getElementById('d-phone').textContent = p.phone || '—';
  document.getElementById('d-email').textContent = p.email || '—';
  document.getElementById('d-type').textContent = p.type || '—';
  document.getElementById('d-timeframe').textContent = p.timeframe || '—';
  document.getElementById('d-referred').textContent = p.referred || '—';
  document.getElementById('d-advisor').textContent = p.advisor || '—';
  const badge = document.getElementById('d-badge');
  badge.textContent = p.interest;
  badge.className = 'interest-badge badge-' + p.interest.toLowerCase();
  document.getElementById('tp-date').value = new Date().toISOString().split('T')[0];
  renderTouchpoints(id);
  renderList(document.getElementById('search-input').value);
}

function renderTouchpoints(id) {
  const tps = touchpoints.filter(t => t.prospectId === id);
  const el = document.getElementById('tp-history');
  if (!tps.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No touchpoints yet — log your first contact above.</div>'; return; }
  el.innerHTML = tps.map(t => {
    const cls = 'outcome-' + t.outcome.replace(/\s+/g,'').toLowerCase();
    return '<div class="tp-entry">' +
      '<div class="tp-meta">' +
        '<span class="tp-date">' + t.date + '</span>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<span class="tp-outcome ' + cls + '">' + t.outcome + '</span>' +
          '<span class="tp-advisor">' + (t.advisor||'') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="tp-notes">' + t.notes + '</div>' +
    '</div>';
  }).join('');
}

function updateStats() {
  document.getElementById('stat-total').textContent = prospects.length;
  document.getElementById('stat-hot').textContent = prospects.filter(p=>p.interest==='Hot').length;
  document.getElementById('stat-warm').textContent = prospects.filter(p=>p.interest==='Warm').length;
  document.getElementById('stat-cold').textContent = prospects.filter(p=>p.interest==='Cold').length;
}

function filterProspects() { renderList(document.getElementById('search-input').value); }

// Init
loadLocal();
renderList();
updateStats();
setInterest('Warm');
document.getElementById('tp-date').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
