<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My HR — Ironclad</title>
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<link rel="manifest" href="retro-strong.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--red-dk:#B8101F;--red-lt:#FEF2F2;--ink:#15171A;--ink3:#6B7280;--bg:#F2F4F7;--card:#FFFFFF;--soft:#F8F9FB;--line:#E5E7EB;--green:#1E9E5A;--green-lt:#E3F5EC;--amber:#D97706;--amber-lt:#FEF3C7;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px}
.topbar img{height:32px;border-radius:6px}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 12px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.sec-label{font-family:'Oswald';text-transform:uppercase;letter-spacing:.4px;font-size:12px;color:var(--red);font-weight:700;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--ink3);font-weight:600}
.doc-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.doc-row:last-child{border-bottom:none}
.doc-status{font-size:9px;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:10px}
.doc-done{background:var(--green-lt);color:var(--green)}
.doc-pending{background:var(--amber-lt);color:var(--amber)}
.empty-state{text-align:center;color:var(--ink3);padding:16px;font-size:13px}
.adp-note{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--ink3)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--ink3);margin-bottom:4px}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:'Inter';font-size:14px;background:var(--soft)}
.action-btn{width:100%;background:var(--red);color:#fff;font-family:'Oswald';font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:13px;border-radius:10px;border:none;cursor:pointer}
.status-msg{font-size:12px;color:var(--ink3);text-align:center;margin-top:8px}
</style>
</head>
<body>

<div class="topbar">
  <img src="icons-strong/apple-touch-icon.png" alt="Ironclad" style="height:34px;width:34px;border-radius:8px;flex-shrink:0;object-fit:cover">
  <a href="member-app.html">&larr; Back</a>
</div>

<div class="wrap">
  <div class="card">
    <div class="sec-label">Personal Info</div>
    <div id="personal-info"><div class="empty-state">Loading...</div></div>
  </div>

  <div class="card">
    <div class="sec-label">Payroll</div>
    <div class="adp-note">Not connected yet. This will pull directly from ADP once the connection is set up — pay stubs, hours, and next pay date will show here automatically. No action needed on your end.</div>
  </div>

  <div class="card">
    <div class="sec-label">Time Off</div>
    <div class="fld"><label>Dates</label><input type="date" id="pto-start"> to <input type="date" id="pto-end" style="margin-top:8px"></div>
    <div class="fld"><label>Reason (optional)</label><textarea id="pto-reason" rows="2" placeholder="Optional note for management"></textarea></div>
    <button class="action-btn" onclick="submitTimeOff()">Request Time Off</button>
    <div class="status-msg" id="pto-status"></div>
  </div>

  <div class="card">
    <div class="sec-label">My Documents</div>
    <div id="doc-list"><div class="empty-state">Loading...</div></div>
  </div>
</div>

<script>
const WORKER = RETRO_WORKER_URL;
const params = new URLSearchParams(window.location.search);
const staffId = params.get('staff_id');

function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function db(body) {
  const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return r.json();
}

async function loadPersonalInfo() {
  const el = document.getElementById('personal-info');
  if (!staffId) { el.innerHTML = '<div class="empty-state">No staff account linked.</div>'; return; }
  try {
    const r = await db({ op:'select', table:'staff_roster', where:{ id: parseInt(staffId) }, limit:1 });
    const emp = (r.results||[])[0];
    if (!emp) { el.innerHTML = '<div class="empty-state">Could not find your record.</div>'; return; }
    el.innerHTML = `
      <div class="info-row"><span class="info-label">Name</span><span>${esc(emp.name)}</span></div>
      <div class="info-row"><span class="info-label">Role</span><span>${esc(emp.role)}</span></div>
      <div class="info-row"><span class="info-label">Email</span><span>${esc(emp.email||'—')}</span></div>
      <div class="info-row"><span class="info-label">Phone</span><span>${esc(emp.phone||'—')}</span></div>
      <div class="info-row"><span class="info-label">Hire Date</span><span>${esc(emp.hire_date||'—')}</span></div>
      <div class="status-msg" style="text-align:left;margin-top:10px">To update any of this, contact management — changes here are kept in sync with payroll records.</div>`;
  } catch(e) { el.innerHTML = '<div class="empty-state">Could not load.</div>'; }
}

async function loadDocuments() {
  const el = document.getElementById('doc-list');
  if (!staffId) { el.innerHTML = ''; return; }
  try {
    const r = await db({ op:'select', table:'hr_documents', where:{ employee_id: parseInt(staffId) }, limit:50 });
    const docs = r.results || [];
    if (!docs.length) { el.innerHTML = '<div class="empty-state">No documents on file yet.</div>'; return; }
    el.innerHTML = docs.map(d => `<div class="doc-row">
      <div style="flex:1">${esc(d.doc_type||'Document')}</div>
      <span class="doc-status ${d.completed ? 'doc-done' : 'doc-pending'}">${d.completed ? 'Complete' : 'Pending'}</span>
    </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="empty-state">Could not load documents.</div>'; }
}

async function submitTimeOff() {
  const start = document.getElementById('pto-start').value;
  const end = document.getElementById('pto-end').value;
  const reason = document.getElementById('pto-reason').value.trim();
  const status = document.getElementById('pto-status');
  if (!start || !end) { status.textContent = 'Pick a start and end date.'; return; }
  status.textContent = 'Submitting...';
  try {
    await fetch(WORKER + '/timeoff/request', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ staff_id: parseInt(staffId), start_date: start, end_date: end, reason }) });
    status.textContent = 'Request sent to management.';
    document.getElementById('pto-reason').value = '';
  } catch(e) { status.textContent = 'Could not submit, try again.'; }
}

loadPersonalInfo();
loadDocuments();
</script>
</body>
</html>
