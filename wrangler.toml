name = "broken-cake-e9c2"
main = "worker-v34.js"
compatibility_date = "2026-07-12"
account_id = "e3507901699c196c82b78ea540a58612"

# CRITICAL: without this explicitly set to true, adding [[routes]] below
# causes Cloudflare to silently disable the free broken-cake-e9c2.
# tedscholl.workers.dev subdomain on deploy. Several tools (confirmed:
# client-management.html) call that exact URL directly, not through
# myretrostrong.com -- disabling it broke their ability to load or save
# any data on July 12, even though the D1 database itself was completely
# untouched. Keep this true unless every single caller of this Worker is
# confirmed to go through the custom domain instead.
workers_dev = true

# ── SECRETS -- do NOT put these here. This file is committed to GitHub.
# ANTHROPIC_KEY, JWT_SECRET, ADMIN_KEY, RESEND_KEY, and MAIL_FROM are all
# already set as encrypted Worker secrets on the live Cloudflare Worker,
# and this file does not touch them. If they ever need to change, do it
# with `wrangler secret put NAME` from the command line (one-time, asks
# for the value interactively, never written to any file) -- never add
# a [vars] block here with a real key value in it.

# ── FAIRLESS HILLS (the real, live production club) ──────────────────
[[d1_databases]]
binding = "DB"
database_name = "retro-crm"
database_id = "3ded4438-bca8-44fb-82ce-89cdf07f31a7"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "retro-photos"

# ── PILOT CLUB SLOTS (all 11 blank, unclaimed as of July 12 2026 --
# see provisioning/CLUB_DATABASE_REGISTRY.md for the authoritative
# slot-to-club mapping once clubs start getting assigned to slots).
# R2 photo isolation for these needs NO separate binding -- the Worker
# code itself prefixes every key by club automatically, using the same
# PHOTOS bucket above. See the clubPrefix wrapper in worker-v34.js.
[[d1_databases]]
binding = "DB_SLOT_01"
database_name = "retro-fitness-forest-hills"
database_id = "5e84df74-7f0f-4fcd-ac3b-58424f7f99ee"

