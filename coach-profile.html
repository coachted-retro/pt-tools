<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<script>
(function(){
  var ALLOWED = ["Franchise Owner","Director of Fitness","General Manager","Men's Training Lead","PT Coach"];
  var session = null;
  try { session = JSON.parse(localStorage.getItem("staff_session")||"null"); } catch(e){}
  if (!session || ALLOWED.indexOf(session.role) === -1) {
    document.documentElement.innerHTML = "<body style='margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#F0F2F5;text-align:center;padding:24px'><div><h2 style='font-family:Oswald,sans-serif;color:#E0192B'>Not Authorized</h2><p style='color:#6B7280;max-width:320px;margin:0 auto'>This page is for coaches and management. <a href='staff-login.html' style='color:#E0192B;font-weight:700'>Sign in</a> with an authorized account, or head back to <a href='command-center.html' style='color:#E0192B;font-weight:700'>Command Center</a>.</p></div></body>";
    throw new Error("unauthorized access blocked");
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Profile — Ironclad</title>
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<link rel="manifest" href="retro-strong.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--red-dk:#B8101F;--red-lt:#FEF2F2;--ink:#15171A;--ink3:#6B7280;--bg:#F2F4F7;--card:#FFFFFF;--soft:#F8F9FB;--line:#E5E7EB;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px}
.topbar img{height:32px;border-radius:6px}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 12px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:520px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.photo-wrap{width:100%;height:220px;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:14px}
.photo-wrap img{width:100%;height:100%;object-fit:cover}
.name{font-family:'Oswald';text-transform:uppercase;font-weight:800;font-size:22px}
.role{font-size:12px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.tagline{font-size:14px;color:var(--ink3);margin-top:8px;font-style:italic}
.sec-label{font-family:'Oswald';text-transform:uppercase;letter-spacing:.4px;font-size:12px;color:var(--red);font-weight:700;margin:16px 0 8px}
.body-text{font-size:13px;line-height:1.7;color:var(--ink)}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--ink3);margin-bottom:4px}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:'Inter';font-size:14px;background:var(--soft)}
.action-btn{width:100%;background:var(--red);color:#fff;font-family:'Oswald';font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:13px;border-radius:10px;border:none;cursor:pointer;margin-top:6px}
.action-btn.secondary{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.status-msg{font-size:12px;color:var(--ink3);text-align:center;margin-top:8px}
.empty-state{text-align:center;color:var(--ink3);padding:30px;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <img src="icons-strong/apple-touch-icon.png" alt="Ironclad" style="height:34px;width:34px;border-radius:8px;flex-shrink:0;object-fit:cover">
  <a href="member-app.html?forceGuest=1">&larr; Back</a>
</div>

<div class="wrap" id="wrap">
  <div class="empty-state">Loading...</div>
</div>

<script>
const WORKER = RETRO_WORKER_URL;
function todayET() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date()); }
const NEEDS_COVERAGE_ROLES = ['MEA', 'Floor Tech'];
const params = new URLSearchParams(window.location.search);
const sessionForFallback = (function(){ try { return JSON.parse(localStorage.getItem('staff_session')||'null'); } catch(e){ return null; } })();
const staffId = parseInt(params.get('staff_id'), 10) || (sessionForFallback && parseInt(sessionForFallback.staff_id, 10)) || null;

function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function getStaffSession() {
  try { return JSON.parse(localStorage.getItem('staff_session') || 'null'); } catch(e) { return null; }
}

async function load() {
  if (!staffId) { document.getElementById('wrap').innerHTML = '<div class="empty-state">No coach specified.</div>'; return; }
  try {
    const r = await fetch(WORKER + '/coaches/profile?staff_id=' + staffId);
    const d = await r.json();
    if (!d.ok) { document.getElementById('wrap').innerHTML = '<div class="empty-state">Could not find that coach.</div>'; return; }
    const staff = d.staff, profile = d.profile || {};
    const session = getStaffSession();
    const isMine = session && String(session.staff_id) === String(staffId);
    renderView(staff, profile, isMine);
  } catch(e) { document.getElementById('wrap').innerHTML = '<div class="empty-state">Could not load profile.</div>'; }
}

function renderView(staff, profile, isMine) {
  const specialties = (profile.specialties || '').split(',').map(s=>s.trim()).filter(Boolean);
  const photo = profile.photo_url
    ? `<img src="${esc(profile.photo_url)}" onerror="this.style.display='none'">`
    : `🏋️`;
  let tenureText = '';
  if (staff.hire_date) {
    const days = Math.floor((new Date() - new Date(staff.hire_date)) / 86400000);
    const years = days / 365;
    tenureText = years >= 1 ? `${years.toFixed(1)} yrs with Ironclad` : `${Math.max(1, Math.round(days/30))} mo with Ironclad`;
  }
  const statsRow = (tenureText || staff.sessions_coached != null) ? `
    <div style="display:flex;gap:10px;justify-content:center;margin:12px 0">
      ${tenureText ? `<div style="background:var(--soft,#F5F6F8);border:1px solid var(--line,#E5E7EB);border-radius:10px;padding:8px 14px;text-align:center">
        <div style="font-family:'Oswald',sans-serif;font-size:16px;font-weight:800">${esc(tenureText)}</div></div>` : ''}
      ${staff.sessions_coached != null ? `<div style="background:var(--soft,#F5F6F8);border:1px solid var(--line,#E5E7EB);border-radius:10px;padding:8px 14px;text-align:center">
        <div style="font-family:'Oswald',sans-serif;font-size:16px;font-weight:800">${staff.sessions_coached}</div>
        <div style="font-size:10px;color:var(--ink3,#6B7280);text-transform:uppercase;letter-spacing:.3px">Sessions Coached</div></div>` : ''}
    </div>` : '';
  document.getElementById('wrap').innerHTML = `
    <div class="card">
      <div class="photo-wrap">${photo}</div>
      <div class="name">${esc(staff.name)}</div>
      <div class="role">${esc(staff.role)}</div>
      ${statsRow}
      ${profile.tagline ? `<div class="tagline">"${esc(profile.tagline)}"</div>` : ''}
      ${profile.bio ? `<div class="sec-label">About</div><div class="body-text">${esc(profile.bio)}</div>` : ''}
      ${specialties.length ? `<div class="sec-label">Specialties</div>${specialties.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}` : ''}
      ${profile.certifications ? `<div class="sec-label">Certifications</div><div class="body-text">${esc(profile.certifications)}</div>` : ''}
      ${(profile.public_email || profile.public_phone) ? `<div class="sec-label">Contact</div><div class="body-text">${profile.public_email?esc(profile.public_email)+'<br>':''}${profile.public_phone?esc(profile.public_phone):''}</div>` : ''}
    </div>
    ${isMine ? `<button class="action-btn secondary" onclick="showEdit()">Edit My Profile</button>` : ''}
    ${isMine ? `
    <div class="card" style="margin-top:14px">
      <div class="sec-label" style="margin-top:0">Today &amp; Upcoming</div>
      <div id="my-shifts-body"><div class="empty-state">Loading...</div></div>
      <button class="action-btn secondary" style="margin-top:10px" onclick="syncCalendarToPhone(${staff.id})">Sync to My Phone Calendar</button>
    </div>
    <div class="card">
      <div class="sec-label" style="margin-top:0">My Work Shifts</div>
      <div id="my-shift-calendar" style="margin-bottom:12px"></div>
      <div id="my-work-shifts-body"><div class="empty-state">Loading...</div></div>
    </div>
    <div class="card">
      <div class="sec-label" style="margin-top:0">Open Shifts — Need Coverage</div>
      <p style="font-size:12px;color:var(--ink3,#6B7280);margin:-4px 0 10px">Claiming one goes to your manager for approval before it's official.</p>
      <div id="open-work-shifts-body"><div class="empty-state">Loading...</div></div>
    </div>
    <a href="coach-crm.html?coach=${encodeURIComponent(staff.name)}&locked=1" class="action-btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px">Open Coach CRM — My Clients</a>
    <div class="card">
      <div class="sec-label" style="margin-top:0">Upcoming at the Gym</div>
      <div id="gym-events-body"><div class="empty-state">Loading...</div></div>
    </div>
    ${NEEDS_COVERAGE_ROLES.includes(staff.role) ? `
    <div class="card">
      <div class="sec-label" style="margin-top:0">My Availability</div>
      <p style="font-size:12px;color:var(--ink3,#6B7280);margin:-4px 0 10px">This feeds directly into the same calendar Sarah uses for coverage scheduling. Changes need manager approval before they're official.</p>
      <div id="availability-body"><div class="empty-state">Loading...</div></div>
    </div>
    ` : ''}
    ${staff.role !== "Men's Training Lead" ? `
    <div class="card">
      <div class="sec-label" style="margin-top:0">Time Off</div>
      <div class="fld"><label>Dates</label><input type="date" id="pto-start-profile"> to <input type="date" id="pto-end-profile" style="margin-top:8px"></div>
      <div class="fld"><label>Reason (optional)</label><textarea id="pto-reason-profile" rows="2"></textarea></div>
      <button class="action-btn" onclick="submitTimeOffProfile(${staff.id})">Request Time Off</button>
      <div class="status-msg" id="pto-status-profile"></div>
      <div id="my-timeoff-list-profile" style="margin-top:14px"></div>
    </div>
    ` : ''}
    ` : ''}
    <div style="text-align:center;margin-top:20px;font-size:11px;color:var(--ink3,#6B7280);display:flex;align-items:center;justify-content:center;gap:5px"><img src="icons-strong/icon-192.png" alt="" style="width:14px;height:14px;border-radius:3px" onerror="this.style.display='none'"> Powered by <b style="color:var(--red,#E0192B)">Ironclad</b></div>
  `;
  window._currentStaff = staff;
  window._currentProfile = profile;
  if (isMine) {
    loadMyShiftsProfile(staff.id, staff.name, staff.role);
    loadMyWorkShifts(staff.id);
    loadOpenWorkShifts(staff.id, staff.name, staff.role);
    loadGymEventsProfile();
    if (NEEDS_COVERAGE_ROLES.includes(staff.role)) loadAvailabilityProfile(staff.id);
    if (staff.role !== "Men's Training Lead") loadMyTimeOffProfile(staff.id);
  }
}

async function loadMyWorkShifts(staffId) {
  const el = document.getElementById('my-work-shifts-body');
  if (!el) return;
  try {
    const r = await fetch(WORKER + '/shifts/mine?staff_id=' + staffId);
    const d = await r.json();
    const shifts = d.shifts || [];
    renderShiftCalendar('my-shift-calendar', shifts);
    if (!shifts.length) { el.innerHTML = '<div class="empty-state">No upcoming shifts scheduled.</div>'; return; }
    el.innerHTML = shifts.map(s => renderWorkShiftRow(s, true)).join('');
  } catch(e) { el.innerHTML = '<div class="empty-state">Could not load your schedule.</div>'; }
}

function renderShiftCalendar(containerId, shifts) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const byDate = {};
  (shifts||[]).forEach(s => { (byDate[s.shift_date] = byDate[s.shift_date]||[]).push(s); });
  const todayStr = todayET();
  const dotColor = s => s.status==='needs_coverage' ? '#D98A0B' : s.status==='pending_swap_approval' ? '#2563EB' : '#1E9E5A';
  let cells = '';
  for (let i=0;i<startWeekday;i++) cells += '<div></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayShifts = byDate[dateStr]||[];
    const isToday = dateStr===todayStr;
    cells += `<div style="aspect-ratio:1;border-radius:8px;background:${isToday?'#FDEAEC':'var(--soft,#F5F6F8)'};border:${isToday?'2px solid var(--red,#E0192B)':'1px solid transparent'};padding:3px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start">
      <div style="font-weight:${isToday?800:600}">${d}</div>
      ${dayShifts.length ? `<div style="display:flex;gap:2px;margin-top:2px">${dayShifts.slice(0,3).map(s=>`<span style="width:6px;height:6px;border-radius:50%;background:${dotColor(s)}"></span>`).join('')}</div>` : ''}
    </div>`;
  }
  const monthLabel = firstDay.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  el.innerHTML = `
    <div style="text-align:center;font-weight:700;font-family:'Oswald',sans-serif;font-size:13px;margin-bottom:8px">${monthLabel}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:9px;text-align:center;color:var(--ink3,#6B7280);margin-bottom:4px;font-weight:700">
      <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>
    <div style="display:flex;gap:10px;margin-top:10px;font-size:9.5px;color:var(--ink3,#6B7280);flex-wrap:wrap">
      <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#1E9E5A;margin-right:3px"></span>Scheduled</span>
      <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#D98A0B;margin-right:3px"></span>Needs Coverage</span>
      <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#2563EB;margin-right:3px"></span>Pending Approval</span>
    </div>`;
}

async function loadOpenWorkShifts(staffId, staffName, role) {
  const el = document.getElementById('open-work-shifts-body');
  if (!el) return;
  try {
    const r = await fetch(WORKER + '/shifts/open?role=' + encodeURIComponent(role));
    const d = await r.json();
    const shifts = (d.shifts || []).filter(s => String(s.staff_id) !== String(staffId));
    if (!shifts.length) { el.innerHTML = '<div class="empty-state">No open shifts matching your role right now.</div>'; return; }
    el.innerHTML = shifts.map(s => renderWorkShiftRow(s, false, staffId, staffName)).join('');
  } catch(e) { el.innerHTML = '<div class="empty-state">Could not load open shifts.</div>'; }
}

function renderWorkShiftRow(s, isMine, staffId, staffName) {
  const dateLabel = new Date(s.shift_date + 'T00:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  const timeLabel = s.start_time + ' \u2013 ' + s.end_time;
  let statusBadge = '';
  let actionBtn = '';
  if (s.status === 'needs_coverage') {
    statusBadge = '<span class="wp-supp-tag" style="background:#FEF3C7;color:#92400E">Needs Coverage</span>';
    if (isMine) actionBtn = `<button class="wp-swap-btn" onclick="cancelShiftCoverageRequest(${s.id},${staffId||'null'})">Undo Request</button>`;
    else actionBtn = `<button class="action-btn" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="claimWorkShiftCoverage(${s.id},${staffId},'${esc(staffName).replace(/'/g,"\\'")}','${esc(s.role).replace(/'/g,"\\'")}')">I'll Cover This</button>`;
  } else if (s.status === 'pending_swap_approval') {
    statusBadge = '<span class="wp-supp-tag" style="background:#DBEAFE;color:#1E40AF">Pending manager approval \u2014 ' + esc(s.covered_by_name||'') + '</span>';
  } else if (s.status === 'covered') {
    statusBadge = '<span class="wp-supp-tag" style="background:var(--green-lt,#DCFCE7);color:var(--green,#1E9E5A)">Covered by ' + esc(s.covered_by_name||'') + '</span>';
  } else if (isMine) {
    actionBtn = `<button class="wp-swap-btn" onclick="requestShiftCoverageProfile(${s.id},${staffId})">Need Coverage / Swap</button>`;
  }
  return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line,#E4E7EC)">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:13px">${esc(dateLabel)} &middot; ${esc(timeLabel)}</div>
      <div style="font-size:12px;color:var(--ink3,#6B7280)">${esc(s.role)}${!isMine ? ' &middot; ' + esc(s.staff_name) : ''} ${statusBadge}</div>
    </div>
    ${actionBtn}
  </div>`;
}

async function requestShiftCoverageProfile(id, staffId) {
  if (!confirm('Flag this shift as needing coverage? Other staff in your role will see it and can pick it up.')) return;
  try {
    await fetch(WORKER + '/shifts/request-coverage', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
    loadMyWorkShifts(staffId);
  } catch(e) {}
}

async function cancelShiftCoverageRequest(id, staffId) {
  try {
    await fetch(WORKER + '/shifts/cancel-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
    loadMyWorkShifts(staffId);
  } catch(e) {}
}

async function claimWorkShiftCoverage(id, staffId, staffName, role) {
  if (!confirm("Cover this shift? It'll be sent to your manager for approval before it's official.")) return;
  try {
    const r = await fetch(WORKER + '/shifts/claim-coverage', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id, covering_staff_id: staffId, covering_name: staffName }) });
    const d = await r.json();
    if (!d.pending_approval) { alert(d.error || 'Could not claim this shift \u2014 it may already be covered.'); }
    loadMyWorkShifts(staffId);
    loadOpenWorkShifts(staffId, staffName, role);
  } catch(e) {}
}

async function loadMyShiftsProfile(staffId, coachName, role) {
  const el = document.getElementById('my-shifts-body');
  if (!el) return;
  const isTrainingLead = role === "Men's Training Lead";
  try {
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
    // Training Lead sees every intake-type appointment across the whole department
    // (consultations/InBody scans, follow-ups, check-ins) plus their own training
    // sessions. Regular coaches only see training sessions with their own clients.
    const apptWhere = isTrainingLead ? { status:'scheduled' } : { assigned_coach:coachName, status:'scheduled', appointment_type:'training_session' };
    const [shiftsRes, sessRes, apptRes, clubosRes, clientsRes] = await Promise.all([
      fetch(WORKER + '/shifts/mine?staff_id=' + staffId),
      fetch(WORKER + '/db', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'select', table:'scheduled_sessions', where:{assigned_coach:coachName, status:'scheduled'}, orderBy:'scheduled_date asc', limit:50})}),
      fetch(WORKER + '/db', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'select', table:'pt_appointments', where: apptWhere, orderBy:'appointment_date asc', limit:200})}),
      fetch(WORKER + '/schedule/clubos-day?date=' + today),
      fetch(WORKER + '/db', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({op:'select', table:'clients', limit:2000})})
    ]);
    const shifts = (await shiftsRes.json()).shifts || [];
    const sessions = (await sessRes.json()).results || [];
    const ptAppts = (await apptRes.json()).results || [];
    // ClubOS bookings only apply to the Training Lead's system-wide view — a
    // regular coach's calendar is strictly their own training sessions.
    const clubosRows = isTrainingLead ? ((await clubosRes.json()).appointments || []) : [];
    const clients = (await clientsRes.json()).results || [];

    const typeLabels = { initial_consultation:'Initial Consultation', follow_up:'6-Wk Follow-Up', monthly_checkin:'Monthly Check-In', training_session:'Training Session', tour:'New Member Tour', staff_meeting:'Staff Meeting', other:'Appointment' };
    const toolFor = (type) => ({ initial_consultation:'fitness-consultation-tool.html', follow_up:'fitness-followup-tool.html', monthly_checkin:'fitness-monthly-checkin.html' }[type] || null);

    let items = [];
    shifts.filter(s => s.shift_date >= today).forEach(s => items.push({
      date: s.shift_date, label: 'Shift — ' + (s.role||'Work'), sub: s.start_time+'–'+s.end_time, href: null, color: '#7C3AED'
    }));
    sessions.forEach(s => items.push({
      date: s.scheduled_date, label: s.program_name || 'Training Session', sub: 'Ironclad Schedule', href: 'gym-floor.html?client='+s.client_id, color: 'var(--red,#E0192B)'
    }));
    const apptHref = (a) => {
      if (a.appointment_type === 'training_session') return 'gym-floor.html' + (a.client_id ? '?client='+a.client_id : '');
      const tool = toolFor(a.appointment_type);
      return (tool || 'client-profile.html') + (a.client_id ? '?client_id='+a.client_id : '');
    };
    ptAppts.forEach(a => items.push({
      date: a.appointment_date, label: typeLabels[a.appointment_type] || a.appointment_type, sub: (a.appointment_time || '') + (isTrainingLead && a.assigned_coach && a.assigned_coach !== coachName ? ' · ' + a.assigned_coach : ''), href: apptHref(a), color: '#2563EB'
    }));
    clubosRows.forEach(c => {
      const namePart = (c.summary||'').split(/[-–]/)[0].trim().toLowerCase();
      const match = clients.find(cl => { const full=((cl.first_name||'')+' '+(cl.last_name||'')).trim().toLowerCase(); return full===namePart||full.includes(namePart)||namePart.includes(full); });
      const s = (c.summary||'').toLowerCase();
      let tool = null;
      if (s.includes('new member') && s.includes('inbody')) tool = 'fitness-consultation-tool.html';
      else if (s.includes('monthly') && (s.includes('progress')||s.includes('check'))) tool = 'fitness-monthly-checkin.html';
      else if (s.includes('follow') || s.includes('6 week') || s.includes('6-week')) tool = 'fitness-followup-tool.html';
      items.push({
        date: (c.start_datetime||'').slice(0,10),
        label: c.summary || 'ClubOS Booking',
        sub: new Date(c.start_datetime).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) + ' · ClubOS',
        href: tool ? (tool + (match ? '?client_id='+match.id : '')) : (match ? 'coach-client-profile.html?client='+match.id : null),
        color: '#D98A0B'
      });
    });

    items = items.filter(i => i.date >= today).sort((a,b) => a.date.localeCompare(b.date));

    if (!items.length) { el.innerHTML = '<div class="empty-state">Nothing on your schedule right now.</div>'; return; }
    el.innerHTML = items.map(i => {
      const dateLabel = new Date(i.date + 'T00:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
      const inner = `<div style="font-weight:700;font-size:13px">${esc(dateLabel)}${i.sub?' · '+esc(i.sub):''}</div><div style="font-size:12px;color:${i.color}">${esc(i.label)}</div>`;
      return i.href
        ? `<a href="${i.href}" style="display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit">${inner}</a>`
        : `<div style="padding:8px 0;border-bottom:1px solid var(--line)">${inner}</div>`;
    }).join('');
  } catch(e) { el.innerHTML = '<div class="empty-state">Could not load your schedule.</div>'; }
}

function syncCalendarToPhone(staffId) {
  const url = WORKER + '/calendar/ics?staff_id=' + staffId;
  const webcalUrl = url.replace(/^https?:\/\//, 'webcal://');
  window.location.href = webcalUrl;
  setTimeout(() => { alert('Synced. To remove this later: open your phone\'s Calendar app, go to Settings, find "Ironclad" under your added calendars, and unsubscribe/remove it -- wont touch anything else on your calendar.\n\nIf nothing opened just now, copy this link into your calendar apps Subscribe by URL option instead:\n\n' + url); }, 800);
}

async function loadGymEventsProfile() {
  const el = document.getElementById('gym-events-body');
  if (!el) return;
  try {
    const r = await fetch(WORKER + '/events/upcoming?gym_id=1&days=90');
    const d = await r.json();
    const events = d.events || [];
    if (!events.length) { el.innerHTML = '<div class="empty-state">Nothing on the calendar right now.</div>'; return; }
    el.innerHTML = events.map(e => {
      const dateLabel = new Date(e.event_date + 'T00:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div style="font-weight:700;font-size:13px">${e.type==='holiday'?'🎉 ':''}${esc(e.title)}</div>
        <div style="font-size:12px;color:var(--ink3)">${esc(dateLabel)}${e.notes ? ' · '+esc(e.notes) : ''}</div>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = '<div class="empty-state">Could not load the gym calendar.</div>'; }
}

const AVAIL_DAYS_P = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

async function loadAvailabilityProfile(staffId) {
  const el = document.getElementById('availability-body');
  if (!el) return;
  let existing = [];
  try {
    const r = await fetch(WORKER + '/availability/get?staff_id=' + staffId);
    const d = await r.json();
    existing = d.availability || [];
  } catch(e) {}
  const anyPending = existing.some(a => a.status === 'pending');
  const statusNote = existing.length
    ? (anyPending ? '<div class="status-msg" style="color:#D98A0B;text-align:left;margin-bottom:8px">Awaiting manager approval</div>' : '<div class="status-msg" style="color:#1E9E5A;text-align:left;margin-bottom:8px">Approved</div>')
    : '';
  el.innerHTML = statusNote + AVAIL_DAYS_P.map((label, i) => {
    const match = existing.find(a => a.day_of_week === i);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)">
      <label style="width:40px;font-size:12px;font-weight:700"><input type="checkbox" id="av-on-${i}" ${match?'checked':''} style="margin-right:4px">${label}</label>
      <input type="time" id="av-start-${i}" value="${match&&match.start_time?match.start_time:'09:00'}" style="flex:1;font-size:12px;padding:4px">
      <span style="font-size:11px;color:var(--ink3)">to</span>
      <input type="time" id="av-end-${i}" value="${match&&match.end_time?match.end_time:'17:00'}" style="flex:1;font-size:12px;padding:4px">
    </div>`;
  }).join('') + `<button class="action-btn secondary" style="margin-top:10px" onclick="saveAvailabilityProfile(${staffId})">Submit for Approval</button>
  <div class="status-msg" id="avail-status-profile"></div>`;
}

async function saveAvailabilityProfile(staffId) {
  const status = document.getElementById('avail-status-profile');
  const slots = [];
  AVAIL_DAYS_P.forEach((label, i) => {
    if (document.getElementById('av-on-'+i).checked) {
      slots.push({ day_of_week: i, start_time: document.getElementById('av-start-'+i).value, end_time: document.getElementById('av-end-'+i).value });
    }
  });
  status.textContent = 'Saving...';
  try {
    await fetch(WORKER + '/availability/set', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ staff_id: staffId, slots }) });
    status.textContent = 'Submitted — awaiting manager approval.';
    loadAvailabilityProfile(staffId);
  } catch(e) { status.textContent = 'Could not save, try again.'; }
}

async function submitTimeOffProfile(staffId) {
  const status = document.getElementById('pto-status-profile');
  const start = document.getElementById('pto-start-profile').value;
  const end = document.getElementById('pto-end-profile').value;
  const reason = document.getElementById('pto-reason-profile').value.trim();
  if (!start || !end) { status.textContent = 'Pick a start and end date.'; return; }
  status.textContent = 'Submitting...';
  try {
    await fetch(WORKER + '/timeoff/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ staff_id: staffId, start_date: start, end_date: end, reason }) });
    status.textContent = 'Request sent to management.';
    document.getElementById('pto-reason-profile').value = '';
    loadMyTimeOffProfile(staffId);
  } catch(e) { status.textContent = 'Could not submit, try again.'; }
}

async function loadMyTimeOffProfile(staffId) {
  const el = document.getElementById('my-timeoff-list-profile');
  if (!el) return;
  try {
    const r = await fetch(WORKER + '/timeoff/mine?staff_id=' + staffId);
    const d = await r.json();
    const reqs = d.requests || [];
    if (!reqs.length) { el.innerHTML = ''; return; }
    const badge = s => s==='approved' ? '<span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:#ECFDF3;color:#1E9E5A">Approved</span>'
      : s==='denied' ? '<span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:#FEF2F2;color:#E0192B">Denied</span>'
      : '<span style="font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:#FFFBEB;color:#D98A0B">Pending</span>';
    el.innerHTML = '<div class="sec-label" style="margin-top:0">Your Requests</div>' + reqs.slice(0,10).map(r =>
      `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:12px">${esc(r.start_date)} – ${esc(r.end_date)}</span>${badge(r.status)}
      </div>`).join('');
  } catch(e) { el.innerHTML = ''; }
}

async function uploadProfilePhoto(ev, staffId){
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const status = document.getElementById('photo-upload-status');
  status.textContent = 'Uploading...';
  try {
    const r = await fetch(`${WORKER}/staff/photo-upload?staff_id=${staffId}`, { method:'POST', body: file });
    const d = await r.json();
    if (!d.ok) { status.textContent = d.error || 'Could not upload.'; return; }
    document.getElementById('e-photo').value = d.url;
    const preview = document.getElementById('photo-preview');
    preview.src = d.url; preview.style.display = 'block';
    status.textContent = 'Uploaded — hit Save Profile to keep it.';
  } catch(e) { status.textContent = 'Upload failed — try again.'; }
}

function showEdit() {
  renderEdit(window._currentStaff, window._currentProfile || {});
}

function renderEdit(staff, profile) {
  document.getElementById('wrap').innerHTML = `
    <div class="card">
      <div class="name" style="margin-bottom:14px">Edit Your Profile</div>
      <div class="fld"><label>Profile Photo</label>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
          <img id="photo-preview" src="${esc(profile.photo_url||'')}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--soft,#F5F6F8);${profile.photo_url?'':'display:none'}">
          <label style="cursor:pointer;background:var(--red);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px">Upload Photo
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadProfilePhoto(event, ${staff.id})">
          </label>
        </div>
        <input id="e-photo" value="${esc(profile.photo_url||'')}" placeholder="Or paste a photo link" oninput="document.getElementById('photo-preview').src=this.value;document.getElementById('photo-preview').style.display=this.value?'block':'none'">
        <div id="photo-upload-status" style="font-size:12px;color:var(--muted,#6B7280);margin-top:4px"></div>
      </div>
      <div class="fld"><label>Tagline</label><input id="e-tagline" value="${esc(profile.tagline||'')}" placeholder="A short line about your style"></div>
      <div class="fld"><label>Bio / Background</label><textarea id="e-bio" rows="5" placeholder="Your history, how you got into training, what drives you">${esc(profile.bio||'')}</textarea></div>
      <div class="fld"><label>Specialties (comma separated)</label><input id="e-specialties" value="${esc(profile.specialties||'')}" placeholder="Strength training, weight loss, mobility"></div>
      <div class="fld"><label>Certifications</label><input id="e-certs" value="${esc(profile.certifications||'')}" placeholder="e.g. NASM-CPT, CSCS"></div>
      <div class="fld"><label>Public Email (optional)</label><input id="e-email" value="${esc(profile.public_email||'')}" type="email"></div>
      <div class="fld"><label>Public Phone (optional)</label><input id="e-phone" value="${esc(profile.public_phone||'')}" type="tel"></div>
      <button class="action-btn" onclick="saveProfile(${staff.id})">Save Profile</button>
      <button class="action-btn secondary" onclick="load()">Cancel</button>
      <div class="status-msg" id="save-status"></div>
    </div>
  `;
}

async function saveProfile(staffIdToSave) {
  const status = document.getElementById('save-status');
  status.textContent = 'Saving...';
  const values = {
    staff_id: staffIdToSave,
    photo_url: document.getElementById('e-photo').value.trim(),
    tagline: document.getElementById('e-tagline').value.trim(),
    bio: document.getElementById('e-bio').value.trim(),
    specialties: document.getElementById('e-specialties').value.trim(),
    certifications: document.getElementById('e-certs').value.trim(),
    public_email: document.getElementById('e-email').value.trim(),
    public_phone: document.getElementById('e-phone').value.trim()
  };
  try {
    const r = await fetch(WORKER + '/coaches/profile/update', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(values) });
    const d = await r.json();
    if (!d.ok) { status.textContent = d.error || 'Could not save'; return; }
    status.textContent = 'Saved!';
    setTimeout(load, 600);
  } catch(e) { status.textContent = 'Connection error, try again'; }
}

load();
