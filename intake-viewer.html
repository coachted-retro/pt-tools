<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intake Summary | Retro Fitness PT</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #181818;
      --border: #222222;
      --red: #e02020;
      --red-dim: rgba(224,32,32,0.10);
      --text: #f0f0f0;
      --muted: #888;
      --label: #555;
      --green: #22c55e;
      --yellow: #f59e0b;
      --orange: #f97316;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }

    /* TOP BAR */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .topbar-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      color: var(--red);
      text-transform: uppercase;
    }
    .topbar-sep { color: var(--border); font-size: 1.2rem; }
    .topbar-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .back-btn {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .back-btn:hover { border-color: var(--red); color: var(--text); }

    /* STATES */
    .state-center {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 14px;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* LAYOUT */
    .container { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }

    /* HERO */
    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      border-radius: 8px;
      padding: 28px 32px;
      margin-bottom: 20px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .hero-left { flex: 1; min-width: 200px; }
    .hero-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 2.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 8px;
    }
    .hero-date {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-date span { color: var(--red); font-weight: 600; }
    .hero-contacts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hero-contact {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-contact b { color: var(--text); font-weight: 500; }

    .hero-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 160px;
      align-items: flex-end;
    }

    /* OUTCOME BADGE */
    .outcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 5px;
      padding: 8px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .outcome-accepted  { background: rgba(34,197,94,0.12);  border: 1px solid rgba(34,197,94,0.3);  color: #4ade80; }
    .outcome-declined  { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }
    .outcome-followup  { background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.3); color: #fb923c; }
    .outcome-default   { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .meta-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .meta-pill b { color: var(--text); }

    /* SECTION CARD */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .section-hdr {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .section-body { padding: 20px 24px; }

    /* FIELD GRID */
    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--label);
      font-weight: 600;
    }
    .field-value {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.4;
    }
    .field-value.empty { color: var(--label); font-style: italic; }

    /* GOAL */
    .goal-block {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .goal-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .goal-text {
      font-size: 1.05rem;
      color: var(--text);
      font-weight: 500;
      line-height: 1.5;
    }

    /* NOTES */
    .notes-block {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.75;
      white-space: pre-wrap;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }

    /* SUMMARY */
    .summary-block {
      font-size: 0.9rem;
      color: #ccc;
      line-height: 1.75;
      background: var(--surface2);
      border-left: 3px solid var(--red);
      border-radius: 0 6px 6px 0;
      padding: 16px 18px;
    }
    .summary-block p { margin-bottom: 10px; }
    .summary-block p:last-child { margin-bottom: 0; }
    .ai-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--red-dim);
      border: 1px solid rgba(224,32,32,0.2);
      color: #f87171;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 3px;
      margin-bottom: 12px;
    }

    /* DECLINE REASON */
    .decline-box {
      background: rgba(239,68,68,0.07);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 6px;
      padding: 14px 18px;
      font-size: 0.88rem;
      color: #fca5a5;
      line-height: 1.5;
    }

    /* ACTIONS */
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px;
      border-radius: 5px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { color: var(--text); }

    @media (max-width: 600px) {
      .hero { flex-direction: column; }
      .hero-right { align-items: flex-start; }
      .meta-pills { justify-content: flex-start; }
      .hero-name { font-size: 1.8rem; }
      .field-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">Retro Fitness</span>
  <span class="topbar-sep">|</span>
  <span class="topbar-title">Intake Summary</span>
  <a href="index.html" class="back-btn">← Hub</a>
</div>

<div id="loading" class="state-center">
  <div class="spinner"></div>
  <p>Loading intake record…</p>
</div>

<div id="error" class="state-center" style="display:none;">
  <p style="font-size:2rem;">⚠️</p>
  <p id="error-msg">Could not load intake.</p>
  <a href="index.html" class="btn btn-ghost" style="margin-top:12px;">← Back to Hub</a>
</div>

<div id="app" class="container" style="display:none;"></div>

<script>
  // ── UPDATE THIS TO YOUR CORRECT APPS SCRIPT URL ──
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby79Hg7mnge7SWS41RsDz9_Wjtx5DkMbQPBrszYaVqiD3eKwxvc1Zo73rInH365E0-2yw/exec';
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1sSLy4Zuai4Vrh1GjyRXgfXoLCBLDuLYfLdKz3VWiT4g/edit';

  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  function val(v) {
    const s = String(v || '').trim();
    return s || null;
  }

  function display(v) {
    return val(v) || '<span class="empty">—</span>';
  }

  function outcomeClass(outcome) {
    if (!outcome) return 'outcome-default';
    const o = outcome.toLowerCase();
    if (o.includes('accept') || o.includes('sign') || o.includes('yes') || o.includes('sold') || o.includes('closed')) return 'outcome-accepted';
    if (o.includes('declin') || o.includes('no') || o.includes('not interest')) return 'outcome-declined';
    if (o.includes('follow') || o.includes('maybe') || o.includes('think')) return 'outcome-followup';
    return 'outcome-default';
  }

  function outcomeIcon(outcome) {
    if (!outcome) return '●';
    const o = outcome.toLowerCase();
    if (o.includes('accept') || o.includes('sign') || o.includes('yes') || o.includes('sold') || o.includes('closed')) return '✓';
    if (o.includes('declin') || o.includes('no') || o.includes('not interest')) return '✕';
    if (o.includes('follow') || o.includes('maybe') || o.includes('think')) return '↻';
    return '●';
  }

  function formatDate(d) {
    if (!d) return null;
    const dt = new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  // Truncate summary to ~2 sentences for the abbreviated view
  function abbreviateSummary(text) {
    if (!text) return null;
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
    if (sentences.length <= 2) return text;
    return sentences.slice(0, 2).join(' ').trim() + '…';
  }

  function render(data) {
    // Map exact column headers from your sheet
    const name         = val(data['Name'])               || 'Unknown';
    const date         = val(data['Date']);
    const followUpDate = val(data['Follow-Up Date']);
    const advisor      = val(data['Advisor']);
    const gender       = val(data['Gender']);
    const age          = val(data['Age']);
    const phone        = val(data['Phone']);
    const email        = val(data['Email']);
    const goal         = val(data['Goal']);
    const outcome      = val(data['Outcome']);
    const declineReason= val(data['Decline Reason']);
    const program      = val(data['Program']);
    const frequency    = val(data['Frequency']);
    const notes        = val(data['Notes']);
    const fullSummary  = val(data['Assessment Summary']);
    const shortSummary = abbreviateSummary(fullSummary);

    const rowNum   = getParam('row') || '';
    const sheetRow = rowNum ? `#gid=0&range=A${rowNum}` : '';

    const oClass = outcomeClass(outcome);
    const oIcon  = outcomeIcon(outcome);

    document.getElementById('app').innerHTML = `

      <!-- HERO -->
      <div class="hero">
        <div class="hero-left">
          <div class="hero-name">${name}</div>
          <div class="hero-date">
            Initial Consultation · <span>${formatDate(date) || 'Unknown Date'}</span>
          </div>
          <div class="hero-contacts">
            ${phone ? `<div class="hero-contact">📞 <b>${phone}</b></div>` : ''}
            ${email ? `<div class="hero-contact">✉️ <b>${email}</b></div>` : ''}
            ${advisor ? `<div class="hero-contact">👤 Advisor: <b>${advisor}</b></div>` : ''}
          </div>
        </div>
        <div class="hero-right">
          ${outcome ? `
            <div class="outcome-badge ${oClass}">
              <span>${oIcon}</span> ${outcome}
            </div>` : ''}
          <div class="meta-pills">
            ${gender ? `<span class="meta-pill"><b>${gender}</b></span>` : ''}
            ${age    ? `<span class="meta-pill">Age <b>${age}</b></span>` : ''}
          </div>
          ${followUpDate ? `<div style="font-size:0.75rem;color:var(--muted);text-align:right;">Follow-up: <span style="color:var(--yellow)">${formatDate(followUpDate)}</span></div>` : ''}
        </div>
      </div>

      <!-- GOAL -->
      <div class="section">
        <div class="section-hdr">
          <div class="section-dot"></div>
          <div class="section-title">Member Goal</div>
        </div>
        <div class="section-body">
          <div class="goal-block">
            <div class="goal-icon">🎯</div>
            <div class="goal-text">${goal || '<span class="empty">No goal recorded</span>'}</div>
          </div>
        </div>
      </div>

      <!-- PROGRAM DETAILS -->
      <div class="section">
        <div class="section-hdr">
          <div class="section-dot"></div>
          <div class="section-title">Program Details</div>
        </div>
        <div class="section-body">
          <div class="field-grid">
            <div class="field">
              <div class="field-label">Program</div>
              <div class="field-value">${display(program)}</div>
            </div>
            <div class="field">
              <div class="field-label">Frequency</div>
              <div class="field-value">${display(frequency)}</div>
            </div>
            <div class="field">
              <div class="field-label">Advisor</div>
              <div class="field-value">${display(advisor)}</div>
            </div>
            <div class="field">
              <div class="field-label">Follow-Up Date</div>
              <div class="field-value">${followUpDate ? formatDate(followUpDate) : '<span class="empty">—</span>'}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- OUTCOME / DECLINE -->
      ${declineReason ? `
      <div class="section">
        <div class="section-hdr">
          <div class="section-dot"></div>
          <div class="section-title">Decline Reason</div>
        </div>
        <div class="section-body">
          <div class="decline-box">${declineReason}</div>
        </div>
      </div>` : ''}

      <!-- NOTES -->
      ${notes ? `
      <div class="section">
        <div class="section-hdr">
          <div class="section-dot"></div>
          <div class="section-title">Coach Notes</div>
        </div>
        <div class="section-body">
          <div class="notes-block">${notes}</div>
        </div>
      </div>` : ''}

      <!-- ASSESSMENT SUMMARY (abbreviated) -->
      ${shortSummary ? `
      <div class="section">
        <div class="section-hdr">
          <div class="section-dot"></div>
          <div class="section-title">Assessment Summary</div>
        </div>
        <div class="section-body">
          <div class="ai-label">✦ AI Generated</div>
          <div class="summary-block">${shortSummary}</div>
          ${fullSummary !== shortSummary ? `
          <div id="full-summary" style="display:none;">
            <div class="summary-block" style="margin-top:10px;">${fullSummary}</div>
          </div>
          <button onclick="toggleFull()" id="expand-btn"
            style="margin-top:12px;background:none;border:1px solid var(--border);color:var(--muted);
            font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:700;
            letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;border-radius:4px;cursor:pointer;">
            Read Full Summary ↓
          </button>` : ''}
        </div>
      </div>` : ''}

      <!-- ACTIONS -->
      <div class="actions">
        <a href="${SHEET_URL}${sheetRow}" target="_blank" class="btn btn-primary">📊 View Row in Sheet</a>
        <a href="index.html" class="btn btn-ghost">← Back to Hub</a>
      </div>
    `;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  function toggleFull() {
    const full = document.getElementById('full-summary');
    const btn  = document.getElementById('expand-btn');
    if (!full) return;
    const expanded = full.style.display === 'block';
    full.style.display = expanded ? 'none' : 'block';
    btn.textContent = expanded ? 'Read Full Summary ↓' : 'Collapse ↑';
  }

  async function load() {
    const row = getParam('row');
    if (!row) {
      document.getElementById('error-msg').textContent = 'No intake ID provided. Please open from the Hub.';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
      return;
    }

    try {
      const res  = await fetch(`${APPS_SCRIPT_URL}?action=getIntakeByRow&row=${row}`);
      const json = await res.json();
      if (json.success && json.data) {
        render(json.data);
      } else {
        throw new Error(json.error || 'Empty response');
      }
    } catch (e) {
      document.getElementById('error-msg').textContent = `Failed to load intake: ${e.message}`;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
    }
  }

  load();
</script>
</body>
</html>
