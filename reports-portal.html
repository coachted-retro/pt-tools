<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>The Body Shoppe — Regional Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#D98A0B;--soft:#F5F6F8;--lred:#FEF2F2;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar .role-tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9CA3AF;padding:3px 10px;border:1px solid #374151;border-radius:20px}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.controls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:'Inter';font-size:13px;background:#fff}
.std-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.std-btn{font-family:'Oswald';font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.std-btn:hover{border-color:var(--red);color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card-title{font-family:'Oswald';font-size:15px;font-weight:800;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card-title .actions{margin-left:auto;display:flex;gap:8px}
.mini-btn{font-size:11px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:'Oswald';font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);background:var(--soft)}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:none}
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--soft);border-radius:10px;padding:12px 14px}
.kpi .v{font-family:'Oswald';font-size:26px;font-weight:800}
.kpi .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.bar-label{width:150px;font-size:12px;font-weight:600;flex-shrink:0}
.bar-track{flex:1;height:16px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);border-radius:8px}
.bar-val{width:80px;text-align:right;font-family:'Oswald';font-weight:700;font-size:13px}
.empty{color:var(--muted);padding:20px;text-align:center}
.note{font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="topbar">
  <img src="assets/retro-fitness-logo.png" alt="Retro Fitness" style="height:28px;width:auto">
  <div class="role-tag">Reports</div>
  <a href="keelin-dashboard.html" id="back-link">&larr; Command Center</a>
</div>
<div class="wrap">

  <div class="controls">
    <div class="fld"><label>From</label><input type="date" id="r-from"></div>
    <div class="fld"><label>To</label><input type="date" id="r-to"></div>
    <div class="fld"><label>Club</label><select id="r-gym"><option value="">All Clubs</option></select></div>
  </div>

  <div class="std-row">
    <button class="std-btn" onclick="runFunnel()">Welcome Workout Funnel</button>
    <button class="std-btn" onclick="runAgg('pt_sales','coach','total','Sales by Coach')">Sales by Coach</button>
    <button class="std-btn" onclick="runAgg('pt_sales','sale_type','total','Sales by Type')">New / Renewal / Upgrade</button>
    <button class="std-btn" onclick="runAgg('pt_sales','month','total','Monthly Sales Trend')">Monthly Sales Trend</button>
    <button class="std-btn" onclick="runAgg('members','membership_type','count','Joins by Membership Type')">Joins by Membership Type</button>
    <button class="std-btn" onclick="runBoard()">Region Board Snapshot</button>
  </div>

  <div class="card">
    <div class="card-title">Custom Report Builder</div>
    <div class="controls" style="border:none;padding:0;margin:0">
      <div class="fld"><label>Data Source</label>
        <select id="cb-source" onchange="cbDims()">
          <option value="members">Members / Joins</option>
          <option value="pt_sales">PT Sales</option>
          <option value="guest_shares">Guest Pass Shares</option>
        </select></div>
      <div class="fld"><label>Group By</label><select id="cb-group"></select></div>
      <div class="fld"><label>Measure</label><select id="cb-measure"></select></div>
      <button class="std-btn" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="runCustom()">Run Report</button>
    </div>
  </div>

  <div class="card" id="result-card" style="display:none">
    <div class="card-title"><span id="result-title">Report</span>
      <div class="actions">
        <button class="mini-btn" onclick="exportCSV()">&#11015; CSV</button>
        <button class="mini-btn" onclick="emailReport()">&#9993; Email This Report</button>
      </div>
    </div>
    <div id="result-body"><div class="empty">Run a report above.</div></div>
    <div class="note" id="result-note"></div>
  </div>

</div>
<script>
const WORKER = RETRO_WORKER_URL;
function todayET() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date()); }
const DEMO_VIEW = new URLSearchParams(location.search).get('demo') === '1';
const DEMO_Q = DEMO_VIEW ? '&demo=1' : '';
if (DEMO_VIEW) { const bl = document.getElementById('back-link'); if (bl) bl.href = 'keelin-dashboard.html?demo=1'; }
const DIMS = {
  members: { club:'Club', outcome:'WW Outcome', membership_type:'Membership Type', month:'Month', week:'Week' },
  pt_sales: { club:'Club', coach:'Coach', package:'Package', sale_type:'Sale Type', month:'Month', week:'Week' },
  guest_shares: { month:'Month', channel:'Channel' }
};
const MEASURES = {
  members: { count:'Count' },
  pt_sales: { count:'Count', total:'Total $', average:'Average $' },
  guest_shares: { count:'Count' }
};
let GYMS = {}, lastRows = null, lastTitle = '';

function fmtMoney(n){ return '$' + Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qs(){ return { from: document.getElementById('r-from').value, to: document.getElementById('r-to').value, gym: document.getElementById('r-gym').value }; }

function cbDims(){
  const s = document.getElementById('cb-source').value;
  document.getElementById('cb-group').innerHTML = Object.entries(DIMS[s]).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  document.getElementById('cb-measure').innerHTML = Object.entries(MEASURES[s]).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
}

async function init(){
  const now = new Date();
  document.getElementById('r-to').value = todayET();
  document.getElementById('r-from').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-01';
  cbDims();
  try {
    const r = await fetch(WORKER + '/region/summary?x=1'+DEMO_Q);
    const d = await r.json();
    GYMS = {};
    document.getElementById('r-gym').innerHTML = '<option value="">All Clubs</option>' +
      (d.gyms||[]).map(g=>{ GYMS[g.gym_id]=g.name; return `<option value="${g.gym_id}">${escH(g.name)}</option>`; }).join('');
  } catch(e){}
}

function showResult(title, html, rows, note){
  lastTitle = title; lastRows = rows || null;
  document.getElementById('result-card').style.display = 'block';
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-body').innerHTML = html;
  document.getElementById('result-note').textContent = note || '';
  document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
}

async function runFunnel(){
  const p = qs();
  const r = await fetch(WORKER + `/reports/funnel?from=${p.from}&to=${p.to}` + (p.gym?`&gym_id=${p.gym}`:''));
  const d = await r.json();
  const html = `
    <div class="kpi-strip">
      <div class="kpi"><div class="v">${d.total_joins}</div><div class="l">New Members</div></div>
      <div class="kpi"><div class="v">${d.booked_pct}%</div><div class="l">Sets Booked</div></div>
      <div class="kpi"><div class="v">${d.show_pct}%</div><div class="l">Show Rate</div></div>
      <div class="kpi"><div class="v" style="color:${d.close_pct>=33?'var(--green)':'var(--red)'}">${d.close_pct}%</div><div class="l">Close Rate</div></div>
      <div class="kpi"><div class="v" style="color:var(--amber)">${d.open_loops}</div><div class="l">Open Loops</div></div>
    </div>
    ${['Purchased PT','Attended','Appointment Set','Declined','Minor','Online Join'].map(k=>{
      const n = d.outcomes[k]||0; const pct = d.total_joins?Math.round(n/d.total_joins*100):0;
      return `<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">${n} (${pct}%)</div></div>`;
    }).join('')}`;
  const rows = Object.entries(d.outcomes).map(([k,v])=>({dimension:k, value:v}));
  showResult('Welcome Workout Funnel ' + d.from + ' to ' + d.to + (p.gym ? ' — ' + (GYMS[p.gym]||'') : ' — All Clubs'), html, rows,
    'Corporate targets: 70% sets booked minimum (low-volume clubs), 33-40% close rate.');
}

async function runAgg(source, group, measure, title){
  const p = qs();
  const r = await fetch(WORKER + '/reports/aggregate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({source, group_by:group, measure, from:p.from, to:p.to, gym_id:p.gym||null})});
  const d = await r.json();
  renderAgg(d, title + ' ' + p.from + ' to ' + p.to + (p.gym ? ' — ' + (GYMS[p.gym]||'') : ' — All Clubs'));
}

function renderAgg(d, title){
  const rows = d.rows || [];
  if (!rows.length) { showResult(title, '<div class="empty">No data in this range.</div>', [], ''); return; }
  const isMoney = d.measure === 'total' || d.measure === 'average';
  const html = '<table><thead><tr><th>' + escH(d.group_by) + '</th><th>' + escH(d.measure) + '</th></tr></thead><tbody>' +
    rows.map(r=>{
      const dim = d.group_by === 'club' ? (GYMS[r.dimension] || ('Gym ' + r.dimension)) : r.dimension;
      return `<tr><td>${escH(dim)}</td><td style="font-family:'Oswald';font-weight:700">${isMoney?fmtMoney(r.value):r.value}</td></tr>`;
    }).join('') + '</tbody></table>';
  showResult(title, html, rows.map(r=>({dimension: d.group_by==='club'?(GYMS[r.dimension]||r.dimension):r.dimension, value:r.value})), '');
}

async function runCustom(){
  const s = document.getElementById('cb-source').value;
  const g = document.getElementById('cb-group').value;
  const m = document.getElementById('cb-measure').value;
  await runAgg(s, g, m, 'Custom: ' + DIMS[s][g] + ' x ' + MEASURES[s][m] + ' (' + s.replace('_',' ') + ')');
}

async function runBoard(){
  const r = await fetch(WORKER + '/region/summary?x=1'+DEMO_Q);
  const d = await r.json();
  const html = '<table><thead><tr><th>#</th><th>Club</th><th>Goal</th><th>MTD</th><th>%</th><th>Note</th></tr></thead><tbody>' +
    (d.gyms||[]).map((g,i)=>`<tr><td>${i+1}</td><td>${escH(g.name)}</td><td>${fmtMoney(g.goal)}</td><td style="font-family:'Oswald';font-weight:700">${fmtMoney(g.actual)}</td><td style="font-weight:700;color:${(g.pct||0)>=90?'var(--green)':(g.pct||0)>=50?'var(--amber)':'var(--red)'}">${g.pct==null?'—':g.pct+'%'}</td><td>${escH(g.note||'')} ${g.emoji||''}</td></tr>`).join('') + '</tbody></table>';
  showResult('Region Board Snapshot — ' + d.month, html, (d.gyms||[]).map(g=>({dimension:g.name, value:g.actual})), 'Region: ' + fmtMoney(d.region_actual) + ' / ' + fmtMoney(d.region_goal) + (d.region_pct!=null?' ('+d.region_pct+'%)':''));
}

function exportCSV(){
  if (!lastRows || !lastRows.length) return alert('Run a report first.');
  const csv = 'dimension,value\n' + lastRows.map(r=>`"${String(r.dimension).replace(/"/g,'""')}",${r.value}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = lastTitle.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '.csv';
  a.click();
}

async function emailReport(){
  if (!lastRows) return alert('Run a report first.');
  const to = prompt('Send this report to (email):', '');
  if (!to) return;
  const bodyHtml = '<h2 style="font-family:Arial">' + escH(lastTitle) + '</h2>' + document.getElementById('result-body').innerHTML;
  const r = await fetch(WORKER + '/reports/email', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({to, subject: 'The Body Shoppe — ' + lastTitle, html: bodyHtml})});
  const d = await r.json();
  alert(d.sent ? 'Report sent to ' + to : 'Send failed: ' + (d.error||'unknown'));
}

init();
</script>
</body>
</html>
