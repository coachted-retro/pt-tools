<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Roster Import — Retro Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#D98A0B;--lgreen:#E3F5EC;--lamber:#FBEFD9;--lred:#FDEAEC;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
.summary-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;flex:1;min-width:130px}
.sum-card .n{font-family:'Oswald';font-size:26px;font-weight:800}
.sum-card .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.action-bar{display:flex;gap:10px;margin-bottom:20px}
.btn{font-family:'Oswald';font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:11px 20px;border-radius:10px;border:none;cursor:pointer}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{font-family:'Oswald';font-size:12px;font-weight:700;text-transform:uppercase;padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#F8F9FB;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:none}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px}
.badge-new{background:var(--lgreen);color:var(--green)}
.badge-match{background:var(--lamber);color:var(--amber)}
.badge-skip{background:#F0F1F3;color:var(--muted)}
.status-msg{font-size:12px;color:var(--muted);margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Member <span>Roster Import</span></div>
  <a href="command-center.html">&larr; Command Center</a>
</div>
<div class="wrap">
  <div class="summary-bar" id="summary-bar"></div>
  <div class="action-bar">
    <button class="btn btn-red" onclick="importNew()">Import All New Members</button>
    <button class="btn btn-outline" onclick="updateMatches()">Update Tier on Existing Matches</button>
    <button class="btn btn-outline" onclick="syncBirthdays()">Sync Birthdays (Oct data)</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="new" onclick="setView('new')">New Members</div>
    <div class="tab" data-tab="match" onclick="setView('match')">Matches Existing Client</div>
    <div class="tab" data-tab="skip" onclick="setView('skip')">Not Active / Skipped</div>
  </div>
  <div id="table-wrap"><div class="empty">Loading roster and checking against your live client list...</div></div>
  <div class="status-msg" id="status"></div>
</div>

let existingClients = [];
let categorized = { new: [], match: [], skip: [] };
let currentView = 'new';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function normName(f,l){ return (f+' '+l).toLowerCase().trim().replace(/\s+/g,' '); }

async function db(body){
  const r = await fetch(WORKER+'/db', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

async function init(){
  const res = await db({op:'select', table:'clients', limit:3000});
  existingClients = res.results || [];
  const existingByName = {};
  existingClients.forEach(c => { existingByName[normName(c.first_name||'', c.last_name||'')] = c; });

  ROSTER.forEach(r => {
    const key = normName(r.first_name, r.last_name);
    const match = existingByName[key];
    if (r.status !== 'active_member') {
      categorized.skip.push({...r, reason: 'Status is ' + r.status + ', not active'});
    } else if (match) {
      categorized.match.push({...r, existing_id: match.id, existing_status: match.status, existing_tier: match.membership_tier});
    } else {
      categorized.new.push(r);
    }
  });
  renderSummary();
  renderTable();
}

function renderSummary(){
  document.getElementById('summary-bar').innerHTML = `
    <div class="sum-card"><div class="n">${ROSTER.length}</div><div class="l">Total in Roster</div></div>
    <div class="sum-card"><div class="n" style="color:var(--green)">${categorized.new.length}</div><div class="l">New Members</div></div>
    <div class="sum-card"><div class="n" style="color:var(--amber)">${categorized.match.length}</div><div class="l">Matches Existing</div></div>
    <div class="sum-card"><div class="n" style="color:var(--muted)">${categorized.skip.length}</div><div class="l">Not Active</div></div>
  `;
}

function setView(v){
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === v));
  renderTable();
}

function renderTable(){
  const rows = categorized[currentView];
  const el = document.getElementById('table-wrap');
  if (!rows.length) { el.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  let head = '', body = '';
  if (currentView === 'new') {
    head = '<tr><th>Name</th><th>Tier</th><th>Phone</th><th>Join Date</th></tr>';
    body = rows.map(r => `<tr><td>${esc(r.first_name)} ${esc(r.last_name)}</td><td>${esc(r.membership_tier)}</td><td>${esc(r.phone)}</td><td>${esc(r.join_date)}</td></tr>`).join('');
  } else if (currentView === 'match') {
    head = '<tr><th>Name</th><th>Roster Tier</th><th>Existing Status</th><th>Existing Tier</th></tr>';
    body = rows.map(r => `<tr><td>${esc(r.first_name)} ${esc(r.last_name)}</td><td>${esc(r.membership_tier)}</td><td><span class="badge badge-match">${esc(r.existing_status||'—')}</span></td><td>${esc(r.existing_tier||'none yet')}</td></tr>`).join('');
  } else {
    head = '<tr><th>Name</th><th>Status</th><th>Tier</th><th>Reason</th></tr>';
    body = rows.map(r => `<tr><td>${esc(r.first_name)} ${esc(r.last_name)}</td><td><span class="badge badge-skip">${esc(r.status)}</span></td><td>${esc(r.membership_tier)}</td><td>${esc(r.reason)}</td></tr>`).join('');
  }
  el.innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

async function importNew(){
  const status = document.getElementById('status');
  if (!categorized.new.length) { status.textContent = 'No new members to import.'; return; }
  if (!confirm('Import ' + categorized.new.length + ' new members into your live clients table?')) return;
  status.textContent = 'Importing 0 / ' + categorized.new.length + '...';
  let done = 0, failed = 0;
  for (const r of categorized.new) {
    const res = await db({op:'insert', table:'clients', values:{
      first_name: r.first_name, last_name: r.last_name, phone: r.phone,
      status: 'active_member', membership_tier: r.membership_tier
    }});
    if (res.ok === false) failed++;
    done++;
    status.textContent = 'Importing ' + done + ' / ' + categorized.new.length + '...' + (failed ? ' (' + failed + ' failed)' : '');
  }
  status.textContent = 'Done. Imported ' + (done-failed) + ' of ' + categorized.new.length + (failed ? ', ' + failed + ' failed — check console.' : '.');
}

async function updateMatches(){
  const status = document.getElementById('status');
  if (!categorized.match.length) { status.textContent = 'No matches to update.'; return; }
  if (!confirm('Update membership tier on ' + categorized.match.length + ' existing client records? This will NOT change their PT status.')) return;
  status.textContent = 'Updating 0 / ' + categorized.match.length + '...';
  let done = 0, failed = 0;
  for (const r of categorized.match) {
    const res = await db({op:'update', table:'clients', values:{ membership_tier: r.membership_tier }, where:{ id: r.existing_id }});
    if (res.ok === false) failed++;
    done++;
    status.textContent = 'Updating ' + done + ' / ' + categorized.match.length + '...' + (failed ? ' (' + failed + ' failed)' : '');
  }
  status.textContent = 'Done. Updated ' + (done-failed) + ' of ' + categorized.match.length + (failed ? ', ' + failed + ' failed.' : '.');
}

async function syncBirthdays(){
  const status = document.getElementById('status');
  status.textContent = 'Matching birthday data against your client list...';
  const existingByName = {};
  existingClients.forEach(c => { existingByName[normName(c.first_name||'', c.last_name||'')] = c; });
  const toUpdate = [];
  BDAY_DATA.forEach(b => {
    const key = normName(b.first_name, b.last_name);
    const match = existingByName[key];
    if (match && !match.birthday) toUpdate.push({ id: match.id, birthday: b.birthday, name: b.first_name+' '+b.last_name });
  });
  if (!toUpdate.length) { status.textContent = 'No matches found needing a birthday update (October data only — Nov/Dec/Jan still to come).'; return; }
  if (!confirm('Set birthday on ' + toUpdate.length + ' matched existing clients (October birthdays only)?')) return;
  let done = 0;
  for (const u of toUpdate) {
    await db({op:'update', table:'clients', values:{ birthday: u.birthday }, where:{ id: u.id }});
    done++;
    status.textContent = 'Syncing birthdays ' + done + ' / ' + toUpdate.length + '...';
  }
  status.textContent = 'Done. Set birthday on ' + done + ' clients from October data. Nov/Dec/Jan data still needs to be added.';
}

init();
