<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Profile — Retro Fitness PT</title>

<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E0192B"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--red:#E0192B;--red-dk:#B0121F;--ink:#15171A;--bg:#E8EBEF;--card:#FFFFFF;--line:#E4E7EC;--muted:#6B7280;--soft:#F0F2F5;--green:#1E9E5A;--amber:#D98A0B;--blue:#2563EB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
  .topbar{display:flex;align-items:center;gap:14px;background:var(--card);border-bottom:3px solid var(--red);padding:12px 20px;position:sticky;top:0;z-index:30}
  @media(max-width:640px){
    .topbar{flex-wrap:wrap;gap:8px;padding:10px 14px}
    .topbar img{height:26px}
    .topbar .t{font-size:15px}
    .search{order:10;flex:1 1 100%;min-width:0}
    .search input{width:100%}
    .topbar .btn{padding:8px 10px;font-size:12px}
  }
  .topbar img{height:34px;border-radius:4px}
  .topbar .t{font-family:'Oswald';font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:1px}
  .topbar .t span{color:var(--red)}
  .topbar .spacer{flex:1}
  .search{position:relative}
  .search input{font-family:'Inter';font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:240px;background:var(--soft)}
  .btn{font-family:'Oswald';text-transform:uppercase;letter-spacing:.5px;font-weight:600;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.red:hover{background:var(--red-dk)}
  .wrap{max-width:1040px;margin:0 auto;padding:20px}
  .head-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;gap:18px;align-items:center;margin-bottom:14px}
  .avatar{width:64px;height:64px;border-radius:50%;background:#1E3A5F;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:24px;font-weight:700;flex:0 0 auto}
  .head-main{flex:1;min-width:0}
  .head-main h1{font-family:'Oswald';text-transform:uppercase;letter-spacing:.5px;font-size:26px;margin:0 0 4px}
  .head-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
  .head-meta b{color:var(--ink);font-weight:600}
  .pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--muted)}
  .pill.active{background:#E3F5EC;color:var(--green)} .pill.prospect{background:#E7EEFE;color:var(--blue)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .stat .num{font-family:'Oswald';font-size:26px;font-weight:700;line-height:1}
  .stat .delta{font-size:11.5px;margin-top:4px;font-weight:600}
  .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .panel.collapsible .ph{cursor:pointer;user-select:none}
  .panel.collapsed .pb{display:none}
  .panel .chev{transition:transform .15s;color:var(--muted);font-size:13px;margin-left:8px}
  .panel.collapsed .chev{transform:rotate(-90deg)}
  .panel .ph{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .panel .ph h3{font-family:'Oswald';text-transform:uppercase;letter-spacing:.5px;font-size:15px;margin:0}
  .panel .pb{padding:16px 18px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .main{flex:1;min-width:0}
  .row .name{font-weight:600}
  .row .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .scorechip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink);margin-left:6px}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
  .empty .big{font-family:'Oswald';font-size:16px;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  canvas{max-height:240px}
  .soon{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.open{display:flex}
  .modal .box{background:var(--card);border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--line)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{font-family:'Oswald';text-transform:uppercase;letter-spacing:.5px;font-size:17px;margin:0}
  .modal .mb{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal .mb .full{grid-column:1/3}
  .fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .fld input,.fld select{width:100%;font-family:'Inter';font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .x{cursor:pointer;color:var(--muted);font-size:20px;background:none;border:none}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}

  /* ── WORKOUT LOGGER ── */
  .wo-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
  .wo-view-tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .wo-view-tab{padding:6px 14px;font-size:12px;font-weight:700;font-family:Oswald;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;background:var(--soft);color:var(--muted);border:none;}
  .wo-view-tab.active{background:var(--ink);color:#fff;}
  .wo-cal{padding:14px 18px;}
  .wo-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .wo-cal-title{font-family:Oswald;font-size:17px;font-weight:700;letter-spacing:.5px;}
  .wo-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .wo-cal-dow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:4px 0;}
  .wo-day{min-height:54px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;cursor:pointer;transition:background .1s;position:relative;}
  .wo-day:hover{background:var(--soft);}
  .wo-day.today{border-color:var(--red);border-width:2px;}
  .wo-day.has-workout{background:#E3F5EC;}
  .wo-day.has-workout:hover{background:#d0eddf;}
  .wo-day.other-month{opacity:.35;}
  .wo-day-num{font-size:11px;font-weight:700;color:var(--muted);}
  .wo-day.today .wo-day-num{color:var(--red);}
  .wo-day-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:2px;}
  .wo-day-label{font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.3px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wo-list-view{padding:0 18px 14px;}
  .wo-session-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .wo-session-row:last-child{border-bottom:none;}
  .wo-session-date{font-family:Oswald;font-size:13px;font-weight:700;color:var(--muted);width:72px;flex-shrink:0;padding-top:2px;}
  .wo-session-body{flex:1;}
  .wo-session-title{font-weight:700;font-size:14px;}
  .wo-session-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .wo-ex-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  .wo-ex-table th{background:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:5px 8px;text-align:left;}
  .wo-ex-table td{padding:5px 8px;border-bottom:1px solid var(--line);}
  .wo-ex-table tr:last-child td{border-bottom:none;}

  /* session logger modal */
  .wo-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:16px;overflow-y:auto;}
  .wo-modal.open{display:flex;}
  .wo-box{background:var(--card);border-radius:14px;width:100%;max-width:640px;border:1px solid var(--line);margin:auto;}
  .wo-box-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .wo-box-head h3{font-family:Oswald;text-transform:uppercase;letter-spacing:.5px;font-size:16px;margin:0;}
  .wo-box-body{padding:16px 18px;}
  .wo-box-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
  .wo-field{margin-bottom:12px;}
  .wo-field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .wo-field input,.wo-field select{width:100%;font-family:Inter;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft);}
  .wo-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ex-search-wrap{position:relative;}
  .ex-search-wrap input{width:100%;font-family:Inter;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft);}
  .ex-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;z-index:70;max-height:200px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;}
  .ex-dropdown.open{display:block;}
  .ex-opt{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
  .ex-opt:last-child{border-bottom:none;}
  .ex-opt:hover{background:var(--soft);}
  .ex-opt .cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-left:6px;}
  .ex-block{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);}
  .ex-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .ex-name{font-weight:700;font-size:13px;}
  .ex-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0;}
  .set-row{display:grid;grid-template-columns:30px 1fr 1fr 1fr 28px;gap:6px;align-items:center;margin-bottom:4px;}
  .set-num{font-size:11px;font-weight:700;color:var(--muted);text-align:center;}
  .set-inp{font-family:Inter;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card);width:100%;text-align:center;}
  .set-inp::placeholder{color:var(--muted);}
  .set-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:0;line-height:1;}
  .set-hdr{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;text-align:center;}
  .add-set-btn{font-size:11px;font-weight:700;color:var(--red);background:none;border:none;cursor:pointer;padding:0;margin-top:4px;}
  .drop-zone{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;transition:border-color .15s,background .15s;}
  .drop-zone.over{border-color:var(--red);background:var(--soft);}
  .wo-status{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px;}
</style>
</head>
<body>

<div class="topbar">
  <img src="Retro_FH_Logo.jpg" alt="Retro Fitness" onerror="this.style.display='none'">
  <div class="t">Client <span>Profile</span></div>
  <span style="background:#1E3A5F;color:#fff;font-family:'Oswald';font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 12px;border-radius:6px;margin-left:10px">📋 Admin Record — Full File</span>
  <div class="spacer"></div>
  <div class="search"><input id="clientSearch" placeholder="Search a client..." list="clientList" onchange="pickClient(this.value)"><datalist id="clientList"></datalist></div>
  <a class="btn" href="client-management.html">👥 All Clients</a>
  <button class="btn red" onclick="openAdd()">+ New Client</button>
  <a class="btn" href="command-center.html">← Command Center</a> <a href="gym-floor.html" style="font-size:12px;color:var(--muted,#6B7280);text-decoration:none;padding:6px 12px;border:1px solid var(--border,#E4E7EC);border-radius:8px;margin-left:8px">Gym Floor →</a>
</div>

<div class="wrap" id="wrap">
  <div class="empty"><div class="big">Pick a client</div>Search above to open a client's profile, or open one from the Command Center roster.</div>
</div>

<script>
const WORKER='https://broken-cake-e9c2.tedscholl.workers.dev';
const CLUB_SLUG=(new URLSearchParams(window.location.search).get('club')||'fairless-hills').toLowerCase();
const CLUB_GYM_ID={'fairless-hills':1,'forest-hills':2,'glendale':3,'jersey-city':4,'cedar-city':5,'rego-park':6,'fairfield':7,'tottenville':8,'mt-olive':9,'whippany':10}[CLUB_SLUG]||1;

function toggleAppAccessFields(){
  const checked = document.getElementById('app-access-check').checked;
  document.getElementById('app-access-fields').style.display = checked ? 'block' : 'none';
  if (checked) loadGranters();
}

async function loadGranters(){
  const sel = document.getElementById('app-access-granter');
  try {
    const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'select', table:'staff_roster', where:{ gym_id: CLUB_GYM_ID, can_grant_app_access: 1, active: 1 }, limit:50 }) });
    const d = await r.json();
    const names = (d.results || []).map(g => g.name);
    sel.innerHTML = names.length
      ? '<option value="">Select who is granting access...</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('')
      : '<option value="">No one at this club is set up to grant access yet — check Staff Roster</option>';
  } catch(e) { sel.innerHTML = '<option value="">Could not load — try again</option>'; }
}

function genTempPassword(){
  return String(Math.floor(1000 + Math.random()*9000)); // 4-digit temp PIN — they set their own permanent PIN on first login
}

function shareAppLink(){
  const status = document.getElementById('app-access-status');
  const appUrl = 'https://myretrostrong.com/member-app.html';
  if (navigator.share) {
    navigator.share({ title: 'Retro Strong App', text: 'Log in with PT Client Login using your email.', url: appUrl }).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(appUrl);
    if (status) status.textContent = 'Link copied — paste it in a text or email.';
  }
}

function fmt12hr(timeStr){
  if (!timeStr) return '';
  const [h,m] = timeStr.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return h12 + ':' + String(m).padStart(2,'0') + ' ' + ap + ' ET';
}

async function loadUpcomingAppointments(clientId){
  const body = document.getElementById('upcoming-appts-body');
  if (!body) return;
  try {
    const r = await db({ op:'select', table:'pt_appointments', where:{ client_id: clientId }, orderBy:'appointment_date asc', limit:50 });
    const today = new Date().toISOString().slice(0,10);
    const upcoming = (r.results||[]).filter(a => a.appointment_date >= today && a.status !== 'cancelled');
    if (!upcoming.length) { body.innerHTML = '<div style="font-size:12px;color:var(--muted,#6B7280)">Nothing scheduled — use + Schedule Appointment above.</div>'; return; }
    window._upcomingAppts = upcoming;
    const typeLabels = { initial_consultation:'Initial Consultation', follow_up:'6-Week Follow-Up', monthly_checkin:'Monthly Check-In', training_session:'Training Session', tour:'New Member Tour', staff_meeting:'Staff Meeting', other:'Other' };
    body.innerHTML = upcoming.map(a => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line,#E4E7EC)">
      <div>
        <div style="font-weight:700;font-size:13px">${esc(typeLabels[a.appointment_type]||a.appointment_type)}</div>
        <div style="font-size:12px;color:var(--muted,#6B7280)">${esc(fmtDate(a.appointment_date))}${a.appointment_time?' at '+esc(fmt12hr(a.appointment_time)):''}${a.assigned_coach?' · '+esc(a.assigned_coach):''}</div>
      </div>
      <button class="btn" style="font-size:11px;padding:6px 12px" onclick="openScheduleModal(${clientId},'',${a.id})">Edit</button>
    </div>`).join('');
  } catch(e) { body.innerHTML = '<div style="font-size:12px;color:var(--muted,#6B7280)">Could not load appointments.</div>'; }
}

function openScheduleModal(clientId, clientName, editId){
  const existing = document.getElementById('schedule-modal-overlay');
  if (existing) existing.remove();
  const today = new Date();
  const minDate = new Date(today.getTime() + 24*60*60*1000).toISOString().slice(0,10);
  const isEdit = !!editId;
  const editing = isEdit ? (window._upcomingAppts||[]).find(a => a.id === editId) : null;
  const overlay = document.createElement('div');
  overlay.id = 'schedule-modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%">
    <div style="font-weight:800;font-size:16px;margin-bottom:12px">${isEdit ? 'Edit Appointment' : 'Schedule Appointment'}${clientName?' — '+esc(clientName):''}</div>
    <div class="fld"><label>Appointment Type</label>
      <select id="sm-type">
        <option value="initial_consultation">Initial Consultation</option>
        <option value="follow_up">6-Week Follow-Up</option>
        <option value="monthly_checkin">Monthly Check-In</option>
        <option value="training_session">Training Session</option>
        <option value="tour">New Member Tour</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="fld"><label>Date</label><input type="date" id="sm-date" value="${editing ? editing.appointment_date : minDate}"></div>
    <div class="fld"><label>Time (Eastern)</label><input type="time" id="sm-time" value="${editing ? (editing.appointment_time||'09:00') : '09:00'}"></div>
    <div class="fld"><label>Coach</label><input type="text" id="sm-coach" placeholder="Who's running this?" value="${esc(editing ? (editing.assigned_coach||'') : '')}"></div>
    <div class="fld"><label>Booked By <span style="font-weight:400;color:var(--muted,#6B7280)">(you — waives the 24hr rule if this is your own schedule)</span></label><input type="text" id="sm-booked-by" placeholder="Your name"></div>
    <div class="fld"><label>Notes (optional)</label><input type="text" id="sm-notes" value="${esc(editing ? (editing.notes||'') : '')}"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn red" style="flex:1" onclick="saveScheduledAppointment(${clientId},${editId||'null'})">${isEdit ? 'Save Changes' : 'Book It'}</button>
      <button class="btn" onclick="document.getElementById('schedule-modal-overlay').remove()">Cancel</button>
    </div>
    <div id="sm-status" style="font-size:12px;color:var(--muted,#6B7280);margin-top:8px"></div>
  </div>`;
  document.body.appendChild(overlay);
  if (editing) document.getElementById('sm-type').value = editing.appointment_type;
}

async function saveScheduledAppointment(clientId, editId){
  const status = document.getElementById('sm-status');
  const type = document.getElementById('sm-type').value;
  const date = document.getElementById('sm-date').value;
  const time = document.getElementById('sm-time').value;
  const coach = document.getElementById('sm-coach').value.trim();
  const bookedBy = document.getElementById('sm-booked-by').value.trim();
  const notes = document.getElementById('sm-notes').value.trim();
  if (!date) { status.textContent = 'Pick a date.'; return; }
  status.textContent = editId ? 'Saving...' : 'Booking...';
  try {
    const url = editId ? WORKER + '/appointments/update' : WORKER + '/appointments/create';
    const payload = editId
      ? { id: editId, appointment_date: date, appointment_time: time||null, appointment_type: type, assigned_coach: coach||null, notes: notes||null, booked_by: bookedBy||null }
      : { appointment_date: date, appointment_time: time||null, appointment_type: type, client_id: clientId, assigned_coach: coach||null, notes: notes||null, booked_by: bookedBy||null };
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (!d.ok) { status.textContent = d.error || 'Could not save.'; return; }
    status.textContent = editId ? 'Saved!' : 'Booked!';
    setTimeout(() => { document.getElementById('schedule-modal-overlay').remove(); loadUpcomingAppointments(clientId); }, 700);

function num(v,d){ const n=parseFloat(v); return isNaN(n)?(d||''):n; }

async function saveClient(){
  const btn=document.getElementById('m_save'); btn.disabled=true; btn.textContent='Saving...';
  const isCancelling = getF('m_status') === 'cancelled';
  const cancelReason = getF('m_cancel_reason');
  if (isCancelling && !cancelReason) {
    alert('Please select a reason for cancelling before saving.');
    btn.disabled=false; btn.textContent='Save';
    return;
  }
  const vals={
    first_name:getF('m_first'), last_name:getF('m_last'), email:getF('m_email'), phone:getF('m_phone'),
    gender:getF('m_gender'), status:getF('m_status'), coach:getF('m_coach'), advisor:getF('m_advisor'),

  };
  if (isCancelling) {
    const cancelNote = 'CANCELLED (' + new Date().toISOString().slice(0,10) + ') — Reason: ' + cancelReason + (getF('m_cancel_notes') ? '. ' + getF('m_cancel_notes') : '');
    vals.notes = ((CURRENT && CURRENT.notes) ? CURRENT.notes + ' | ' : '') + cancelNote;
  }
  if (!EDIT_ID) vals.gym_id = CLUB_GYM_ID;
  if(!vals.first_name && !vals.last_name){ alert('Enter a name'); btn.disabled=false; btn.textContent='Save'; return; }
  async function write(v){ return EDIT_ID ? db({op:'update',table:'clients',values:v,where:{id:EDIT_ID}}) : db({op:'insert',table:'clients',values:v}); }
  try{
    let res=await write(vals);
    if(res && res.error && /package/i.test(res.error)){ delete vals.package; res=await write(vals); }  // table has no package column yet
    if(res && res.error) throw new Error(res.error);
    const newId = EDIT_ID || (res && (res.id!=null?res.id:(res.meta&&res.meta.last_row_id)));
    if (isCancelling && document.getElementById('m_send_survey').checked && newId) {
      fetch(WORKER + '/churn-survey/send', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ client_id: newId, reason: cancelReason }) }).catch(function(){});

function latestStats(checkins, consults, scans){
  if(checkins.length){ const c=checkins[checkins.length-1]; return {weight:c.now_weight,lean:c.now_lean,bf:c.now_body_fat_pct,bmi:c.now_bmi,date:c.checkin_date}; }
  if(consults.length){ const c=consults[consults.length-1]; return {weight:c.weight,lean:c.lean_mass,bf:c.body_fat_pct,bmi:c.bmi,date:c.consult_date}; }
  if(scans && scans.length){ const real=scans.filter(s=>s.source!=='inbody_history'); if(real.length){ const s=real[real.length-1]; return {weight:s.weight,lean:s.lean_mass,bf:s.body_fat_pct,bmi:s.bmi,date:s.scan_date}; } }
  return {};
}
function firstStats(checkins, consults, scans){
  if(consults.length){ const c=consults[0]; return {weight:c.weight,lean:c.lean_mass,bf:c.body_fat_pct}; }
  if(checkins.length){ const c=checkins[0]; return {weight:c.prev_weight||c.now_weight,lean:c.prev_lean||c.now_lean,bf:c.prev_body_fat_pct||c.now_body_fat_pct}; }
  if(scans && scans.length){ const real=scans.filter(s=>s.source!=='inbody_history'); if(real.length){ const s=real[0]; return {weight:s.weight,lean:s.lean_mass,bf:s.body_fat_pct}; } }
  return {};
}
function deltaHtml(now, first, lowerBetter){
  const a=num(now), b=num(first);
  if(a===''||b==='') return '';
  const diff=+(a-b).toFixed(1);
  if(diff===0) return '<div class="delta flat">no change</div>';
  const good = lowerBetter ? diff<0 : diff>0;
  const arrow = diff>0?'▲':'▼';
  return '<div class="delta '+(good?'up':'down')+'">'+arrow+' '+Math.abs(diff)+' since start</div>';
}

  const dW=(num(stat.weight)!==''&&num(first.weight)!=='')?+(num(stat.weight)-num(first.weight)).toFixed(1):null;
  const dB=(num(stat.bf)!==''&&num(first.bf)!=='')?+(num(stat.bf)-num(first.bf)).toFixed(1):null;
  const dL=(num(stat.lean)!==''&&num(first.lean)!=='')?+(num(stat.lean)-num(first.lean)).toFixed(1):null;
  const nScans=(scans||[]).filter(x=>x.source!=='inbody_history').length;
  const hasProg=(dW!=null||dB!=null||dL!=null);
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Progress Summary</h3><span style="display:flex;align-items:center">'+(since?'<span class="pill">since '+esc(since)+'</span>':'')+'<span class="chev">▾</span></span></div><div class="pb">'+
    (hasProg?('<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:4px">'+
      sumItem('Weight',dW,' lb',true)+sumItem('Body Fat',dB,'%',true)+sumItem('Lean Mass',dL,' lb',false)+
    '</div>'):'<div class="empty" style="padding:8px 0">Totals appear once there are two or more dated data points.</div>')+
    '<div style="color:var(--muted);font-size:12.5px;margin-top:10px">'+
      (months?(months+' month'+(months>1?'s':'')+' training · '):'')+
      checkins.length+' check-ins · '+sessions.length+' sessions · '+nScans+' InBody scans'+
    '</div></div></div>';

  // charts — collapsible, collapsed by default
  html+='<div class="grid2">'+
    '<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Body Composition</h3><span class="chev">▾</span></div><div class="pb"><canvas id="bodyChart"></canvas><div id="bodyEmpty"></div></div></div>'+
    '<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Wellness Scores</h3><span class="chev">▾</span></div><div class="pb"><canvas id="scoreChart"></canvas><div id="scoreEmpty"></div></div></div>'+
    '</div>';

  // check-in history
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Consultation History</h3><span style="display:flex;align-items:center"><span class="pill">'+consults.length+'</span><span class="chev">▾</span></span></div><div class="pb" id="consultList"></div></div>';
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Check-In History</h3><span style="display:flex;align-items:center"><span class="pill">'+checkins.length+'</span><span class="chev">▾</span></span></div><div class="pb" id="checkinList"></div></div>';
  // training sessions
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Training Sessions</h3><span style="display:flex;align-items:center"><span class="pill">'+sessions.length+'</span><span class="chev">▾</span></span></div><div class="pb" id="sessionList"></div></div>';
  // meal plans
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Meal Plans</h3><span style="display:flex;align-items:center"><span class="pill">'+meals.length+'</span><span class="chev">▾</span></span></div><div class="pb" id="mealList"></div></div>';
  // measurements
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>Body Measurements</h3><span style="display:flex;align-items:center"><span class="pill">'+measures.length+'</span><span class="chev">▾</span></span></div><div class="pb">'+
    '<div style="margin-bottom:12px"><button class="btn red" onclick="event.stopPropagation();toggleMeasForm()">+ Add Measurements</button></div>'+
    '<div id="measForm" style="display:none"></div><div id="measureList"></div></div></div>';
  // InBody scans — 7th/8th collapsible, matches "top all the way to InBody scans"
  const realScans=(scans||[]).filter(s=>s.source!=='inbody_history');
  html+='<div class="panel collapsible collapsed" onclick="togglePanel(this,event)"><div class="ph"><h3>InBody Scans</h3><span style="display:flex;align-items:center"><span class="pill">'+realScans.length+'</span><span class="chev">▾</span></span></div><div class="pb">'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px" onclick="event.stopPropagation()">'+
    '<label class="btn red" style="cursor:pointer">Upload InBody PDF<input type="file" accept="application/pdf,image/*" style="display:none" onchange="uploadInbody(event)"></label>'+
    '<span id="ibStatus" style="font-size:12px;color:var(--muted)"></span></div>'+
    '<div id="scanTrendChart" style="margin-bottom:16px"></div>'+
    '<div id="scansList" onclick="event.stopPropagation()"></div>'+
    '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)"><h4 style="font-family:Oswald;font-size:13px;text-transform:uppercase;margin-bottom:10px">Muscle Balance</h4><div id="muscleBalance"></div></div></div></div>';
  html+='<div class="panel"><div class="ph"><h3>Progress Photos</h3><span class="pill">'+(photos||[]).length+'</span></div><div class="pb">'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
    '<label class="btn red" style="cursor:pointer">Front<input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(event,&quot;front&quot;)"></label>'+

    '<label class="btn red" style="cursor:pointer">Back<input type="file" accept="image/*" style="display:none" onchange="uploadPhoto(event,&quot;back&quot;)"></label>'+
    '<span id="phStatus" style="font-size:12px;color:var(--muted)"></span></div>'+
    '<div id="photosList"></div></div></div>';

  document.getElementById('wrap').innerHTML=html;
  renderRosterNav(client.id);

  // build chart series from consultation (start) + checkins
  const pts=[];
  if(consults.length){ const c0=consults[0]; pts.push({d:c0.consult_date,w:c0.weight,l:c0.lean_mass,b:c0.body_fat_pct}); }
  checkins.forEach(c=>pts.push({d:c.checkin_date,w:c.now_weight,l:c.now_lean,b:c.now_body_fat_pct}));
  (scans||[]).forEach(sc=>pts.push({d:sc.scan_date,w:sc.weight,l:sc.lean_mass,b:sc.body_fat_pct}));
  pts.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  drawBody(pts);
  drawScores(checkins);

  renderConsults(consults);
  renderCheckins(checkins);
  renderSessions(sessions);
  renderMeals(meals);
  renderMeasures(measures);
  renderScans(scans||[]);
  renderWorkouts(workouts||[]);
  renderPhotos(photos||[]);

function sumItem(label,v,unit,lowerGood){
  if(v==null) return '';
  const good = lowerGood ? v<0 : v>0;
  const color = v===0?'var(--muted)':(good?'var(--green)':'var(--red)');
  const sg=(v>0?'+':'')+v;
  return '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700">'+label+'</div>'+
    '<div style="font-family:Oswald;font-size:24px;font-weight:700;color:'+color+'">'+sg+(unit||'')+'</div></div>';
}
function statTile(lbl,val,unit,delta){
  const v=num(val);
  return '<div class="stat"><div class="lbl">'+lbl+'</div><div class="num">'+(v===''?'—':v+(unit?'<span style="font-size:14px;color:var(--muted)"> '+unit+'</span>':''))+'</div>'+(delta||'')+'</div>';
}

function drawBody(pts){
  pts=pts.filter(p=>p.d);
  const el=document.getElementById('bodyChart');
  if(pts.length<2){ el.style.display='none'; document.getElementById('bodyEmpty').innerHTML='<div class="empty">Two or more dated check-ins build the trend line. It fills as you complete check-ins.</div>'; return; }
  const labels=pts.map(p=>fmtDate(p.d));
  new Chart(el,{type:'line',data:{labels,datasets:[
    {label:'Weight',data:pts.map(p=>num(p.w,null)),borderColor:'#E0192B',backgroundColor:'rgba(224,25,43,.08)',tension:.3,spanGaps:true},
    {label:'Lean',data:pts.map(p=>num(p.l,null)),borderColor:'#1E9E5A',backgroundColor:'rgba(30,158,90,.08)',tension:.3,spanGaps:true},
    {label:'Body Fat %',data:pts.map(p=>num(p.b,null)),borderColor:'#2563EB',backgroundColor:'rgba(37,99,235,.08)',tension:.3,spanGaps:true,yAxisID:'y1'}
  ]},options:{plugins:{legend:{labels:{font:{family:'Inter'},boxWidth:12}}},scales:{y:{position:'left'},y1:{position:'right',grid:{drawOnChartArea:false}}}}});
}
function drawScores(checkins){
  const c=checkins.filter(x=>x.checkin_date);
  const el=document.getElementById('scoreChart');
  if(!c.length){ el.style.display='none'; document.getElementById('scoreEmpty').innerHTML='<div class="empty">Session, diet, sleep and stress scores chart here once check-ins are recorded.</div>'; return; }
  const labels=c.map(x=>fmtDate(x.checkin_date));
  new Chart(el,{type:'line',data:{labels,datasets:[
    {label:'Session',data:c.map(x=>num(x.session_score,null)),borderColor:'#1E9E5A',tension:.3,spanGaps:true},
    {label:'Diet',data:c.map(x=>num(x.diet_score,null)),borderColor:'#D98A0B',tension:.3,spanGaps:true},
    {label:'Sleep',data:c.map(x=>num(x.sleep_score,null)),borderColor:'#2563EB',tension:.3,spanGaps:true},
    {label:'Stress',data:c.map(x=>num(x.stress_score,null)),borderColor:'#E0192B',tension:.3,spanGaps:true}
  ]},options:{plugins:{legend:{labels:{font:{family:'Inter'},boxWidth:12}}},scales:{y:{min:0,max:10}}}});
}

// ---------- progress photos + measurements ----------
async function uploadPhoto(ev, pose){
  const file=ev.target.files[0]; ev.target.value=''; if(!file||!CURRENT) return;
  const st=document.getElementById('phStatus'); if(st) st.textContent='Uploading '+pose+'...';
  try{
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const buf=await file.arrayBuffer();
    const r=await fetch(WORKER+'/file/upload?client='+CURRENT.id+'&kind=photo_'+pose+'&ext='+ext+'&ct='+encodeURIComponent(file.type||'image/jpeg'),{method:'POST',body:buf});
    const d=await r.json(); if(!d.key) throw new Error(d.error||'Upload failed');
    const row={client_id:CURRENT.id, captured_at:new Date().toISOString().slice(0,10), pose:pose, r2_key:d.key, source:'profile'};
    const ins=await db({op:'insert',table:'progress_photos',values:row});
    if(ins && ins.error) throw new Error(ins.error);
    if(st) st.textContent='Saved.'; loadProfile(CURRENT.id);
  }catch(e){ if(st) st.textContent='Failed: '+e.message; }
}
function renderPhotos(photos){
  const el=document.getElementById('photosList'); if(!el) return;
  if(!photos.length){ el.innerHTML='<div class="empty">No progress photos yet. Snap front, side and back. They store privately and build a visual timeline.</div>'; return; }
  const byDate={}; photos.forEach(p=>{ const d=p.captured_at||''; (byDate[d]=byDate[d]||[]).push(p); });
  el.innerHTML=Object.keys(byDate).sort().reverse().map(d=>{
    const thumbs=byDate[d].map(p=>'<a href="'+WORKER+'/file/get?key='+encodeURIComponent(p.r2_key)+'" target="_blank" style="text-decoration:none"><div style="text-align:center"><img src="'+WORKER+'/file/get?key='+encodeURIComponent(p.r2_key)+'" loading="lazy" style="width:84px;height:108px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px">'+esc(p.pose||'')+'</div></div></a>').join('');
    return '<div style="margin-bottom:14px"><div style="font-weight:600;font-size:12.5px;margin-bottom:6px">'+esc(fmtDate(d))+'</div><div style="display:flex;gap:10px;flex-wrap:wrap">'+thumbs+'</div></div>';
  }).join('');
}
function mf(id,label,type){ return '<div class="fld"><label>'+label+'</label><input id="'+id+'" type="'+(type||'number')+'" step="0.1"></div>'; }
function togglePanel(el, ev){
  // Don't toggle if the click landed on an interactive element inside the header (buttons, links, inputs)
  if (ev && ev.target && ev.target.closest('button,a,input,label')) return;
  el.classList.toggle('collapsed');
  // Charts drawn while hidden render at 0x0 — force a resize once visible
  if (!el.classList.contains('collapsed')) {
    setTimeout(function(){
      if (window.Chart && Chart.instances) {
        Object.values(Chart.instances).forEach(function(c){ c.resize(); });
      }
    }, 50);
  }
}

function toggleMeasForm(){

// ---------- uploads + AI extraction ----------
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
function parseJSON(t){ try{ return JSON.parse(String(t).replace(/```json|```/g,'').trim()); }catch(e){ return null; } }
async function aiExtract(file, b64, prompt){
  const isPdf=(file.type==='application/pdf')|| /\.pdf$/i.test(file.name);
  const block=isPdf
    ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:b64}}
    : {type:'image', source:{type:'base64', media_type:(file.type||'image/jpeg'), data:b64}};
  const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1500,messages:[{role:'user',content:[block,{type:'text',text:prompt}]}]})});
  const d=await r.json();
  if(d.error) throw new Error((d.error.message)||'AI error');
  const text=(d.content||[]).map(b=>b.text||'').join('');
  const j=parseJSON(text); if(!j) throw new Error('Could not read the file');
  return j;
}
async function uploadFile(file, kind){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase();
  const buf=await file.arrayBuffer();
  const r=await fetch(WORKER+'/file/upload?client='+CURRENT.id+'&kind='+kind+'&ext='+ext+'&ct='+encodeURIComponent(file.type||'application/octet-stream'),{method:'POST',body:buf});
  const d=await r.json(); if(!d.key) throw new Error(d.error||'Upload failed'); return d.key;
}
const IB_PROMPT='You are reading an InBody 270 body composition result sheet (PDF or image). Return ONLY a JSON object, no prose, no markdown fences. Shape: {"test_date":"YYYY-MM-DD","weight":number,"lean_body_mass":number,"skeletal_muscle_mass":number,"body_fat_mass":number,"percent_body_fat":number,"bmi":number,"basal_metabolic_rate":number,"total_body_water":number,"segmental_lean":{"right_arm":number,"left_arm":number,"trunk":number,"right_leg":number,"left_leg":number},"history":[{"date":"YYYY-MM-DD","weight":number,"smm":number,"pbf":number}]}. Main Test Date looks like 2026.01.07 -> 2026-01-07. The Body Composition History section has several dated columns with dates like 24.09.01 (YY.MM.DD, year 20YY) -> 2024-09-01, each with Weight, SMM and PBF; include every history column. The Segmental Lean Analysis section shows each body part (Right Arm, Left Arm, Trunk, Right Leg, Left Leg) as a percentage of a normal/ideal range, e.g. "105.3%" or "98%" — extract these five percentages exactly as shown. Use null for any missing value.';
async function uploadInbody(ev){
  const file=ev.target.files[0]; ev.target.value=''; if(!file||!CURRENT) return;
  const st=document.getElementById('ibStatus'); st.textContent='Uploading and reading the scan...';
  try{
    const b64=await fileToB64(file);
    const key=await uploadFile(file,'inbody');
    const j=await aiExtract(file,b64,IB_PROMPT);
    const main={client_id:CURRENT.id, scan_date:j.test_date||new Date().toISOString().slice(0,10), file_url:key, source:'inbody_pdf',
      weight:j.weight, lean_mass:j.lean_body_mass, skeletal_muscle:j.skeletal_muscle_mass, body_fat_pct:j.percent_body_fat, fat_mass:j.body_fat_mass, bmi:j.bmi,
      segmental_json: j.segmental_lean ? JSON.stringify(j.segmental_lean) : null};
    Object.keys(main).forEach(k=>{ if(main[k]==null) delete main[k]; }); main.client_id=CURRENT.id;
    const ins=await db({op:'insert',table:'inbody_scans',values:main});
    if(ins && ins.error) throw new Error(ins.error);
    let have=new Set([main.scan_date]);
    try{ const ex=await db({op:'select',table:'inbody_scans',where:{client_id:CURRENT.id},limit:500}); (ex.results||[]).forEach(r=>have.add(r.scan_date)); }catch(e){}
    for(const h of (j.history||[])){
      if(!h.date || have.has(h.date)) continue;
      const row={client_id:CURRENT.id, scan_date:h.date, weight:h.weight, skeletal_muscle:h.smm, body_fat_pct:h.pbf, source:'inbody_history'};
      Object.keys(row).forEach(k=>{ if(row[k]==null) delete row[k]; }); row.client_id=CURRENT.id;
      try{ await db({op:'insert',table:'inbody_scans',values:row}); have.add(h.date); }catch(e){}
    }
    st.textContent='Saved. Reloading...'; loadProfile(CURRENT.id);
  }catch(e){ st.textContent='Failed: '+e.message; }
}

function renderWoCal(workouts){
  const byDate={};
  workouts.forEach(w=>{ if(w.workout_date){ const d=w.workout_date.slice(0,10); if(!byDate[d]) byDate[d]=[]; byDate[d].push(w); }});
  const apptsByDate={};
  const typeLabels={ initial_consultation:'Initial Consult', follow_up:'6-Wk Follow-Up', monthly_checkin:'Monthly Check-In', training_session:'Training', tour:'Tour', staff_meeting:'Meeting', other:'Appointment' };
  woAllAppts.forEach(a=>{ if(a.appointment_date){ if(!apptsByDate[a.appointment_date]) apptsByDate[a.appointment_date]=[]; apptsByDate[a.appointment_date].push(a); }});
  const today=new Date(); const todayStr=today.toISOString().slice(0,10);
  const first=new Date(woCalYear,woCalMonth,1);
  const lastDay=new Date(woCalYear,woCalMonth+1,0).getDate();
  const startDow=first.getDay();
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  let html='<div class="wo-cal">'+
    '<div class="wo-cal-nav">'+
      '<button class="btn" onclick="woCalNav(-1)">← Prev</button>'+
      '<div class="wo-cal-title">'+months[woCalMonth]+' '+woCalYear+'</div>'+
      '<button class="btn" onclick="woCalNav(1)">Next →</button>'+
    '</div>'+
    '<div class="wo-cal-grid">'+
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div class="wo-cal-dow">'+d+'</div>').join('');
  // empty cells before start
  for(let i=0;i<startDow;i++) html+='<div class="wo-day other-month"></div>';
  for(let d=1;d<=lastDay;d++){
    const ds=woCalYear+'-'+String(woCalMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const ws=byDate[ds]||[];
    const as=apptsByDate[ds]||[];
    const isToday=ds===todayStr;
    const hasWo=ws.length>0;
    const hasAppt=as.length>0;
    html+='<div class="wo-day'+(isToday?' today':'')+(hasWo?' has-workout':'')+'" onclick="calDayClick(\''+ds+'\')">'+'<div class="wo-day-num">'+d+'</div>'+
      (hasWo?'<div class="wo-day-label">'+esc(ws[0].title||'Workout')+(ws.length>1?' +'+( ws.length-1):'')+'</div>':'')+
      (hasAppt?'<div class="wo-day-label" style="color:#2563EB">'+esc(typeLabels[as[0].appointment_type]||as[0].appointment_type)+(as.length>1?' +'+(as.length-1):'')+'</div>':'')+
    '</div>';
  }
  html+='</div></div>';
  return html;
}

function updateSet(ei,si,field,val){
  if(woExercises[ei]&&woExercises[ei].sets[si]) woExercises[ei].sets[si][field]=val;

function addSet(ei){
  if(!woExercises[ei]) return;
  const prev=woExercises[ei].sets.slice(-1)[0]||{sets:3,reps:'',weight:''};
  woExercises[ei].sets.push({...prev});
  renderExerciseBlocks();
}
function removeSet(ei,si){ woExercises[ei].sets.splice(si,1); renderExerciseBlocks(); }
function removeExercise(ei){ woExercises.splice(ei,1); renderExerciseBlocks(); }

function addExercise(name){

async function saveSession(){
  const date=document.getElementById('woDate').value;
  const title=document.getElementById('woTitle').value||'Session '+fmtDateShort(date);
  const rpe=document.getElementById('woRpe').value;
  const notes=document.getElementById('woNotes').value;
  if(!CURRENT) return;
  const flat=woExercises.map(ex=>({name:ex.name,sets:parseInt(ex.sets[0]&&ex.sets[0].sets)||ex.sets.length,reps:ex.sets[0]&&ex.sets[0].reps,weight:ex.sets[0]&&ex.sets[0].weight,all_sets:ex.sets}));
  let vol=0;
  woExercises.forEach(ex=>ex.sets.forEach(s=>{ const sets=parseFloat(s.sets)||1,reps=parseFloat(s.reps)||0,w=parseFloat(s.weight)||0; vol+=sets*reps*w; }));
  const row={client_id:CURRENT.id,workout_date:date,title,rpe:rpe||null,exercises_json:JSON.stringify(flat),total_volume:vol||null,session_notes:notes||null,source:'manual'};
  Object.keys(row).forEach(k=>{ if(row[k]==null) delete row[k]; });
  if(woEditId){
    await db({op:'update',table:'workouts',values:row,where:{id:woEditId}});
  } else {
    await db({op:'insert',table:'workouts',values:row});
  }
  closeWoModal();
  loadProfile(CURRENT.id);
}

  const st=document.getElementById('woStatus'); st.textContent='Parsing CSV...';
  try{
    const text=await file.text();
    const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
    const title=lines[0]||'Imported Workout';
    // date range line: lines[1] — extract last date
    const dateMatch=(lines[1]||'').match(/(\d{4}-\d{2}-\d{2})/g);
    const dateRange=dateMatch?dateMatch:[]; 
    // Find all date columns from line 2
    const headerLine=lines[2]||'';
    const dateCols=headerLine.split(',').map(c=>c.trim()).filter(c=>/^\d{1,2}\s\w{3}\s\d{4}$/.test(c)||/^\d{4}-\d{2}-\d{2}$/.test(c));
    // group sessions by date
    const sessions={};
    const exMap={};
    for(let i=4;i<lines.length;i++){
      const cols=lines[i].split(',');
      const exName=cols[0].trim(); const setLabel=cols[1]?.trim();
      if(!exName||exName.toLowerCase().startsWith('rpe')||exName.toLowerCase().startsWith('comments')) continue;
      if(!exMap[exName]) exMap[exName]={};
      // cols 2+ are date values
      for(let ci=2;ci<cols.length;ci++){
        const val=cols[ci]?.trim();
        if(!val||val==='false'||val==='true'||!val) continue;
        const dateKey=dateCols[ci-2]||'Unknown date';
        if(!sessions[dateKey]) sessions[dateKey]=[];
        // find or create exercise entry
        let entry=sessions[dateKey].find(e=>e.name===exName);
        if(!entry){ entry={name:exName,sets:[]}; sessions[dateKey].push(entry); }
        if(setLabel&&setLabel.startsWith('SET')){
          // parse "10 X 135 lbs" or "3 X 135"
          const m=val.match(/(\d+)\s*[Xx]\s*([\d.]+)/);
          if(m) entry.sets.push({sets:1,reps:m[1],weight:m[2]});
        }
      }
    }
    // pick most recent date or all — save each as a workout
    const dateKeys=Object.keys(sessions);
    if(!dateKeys.length){ st.textContent='No session data found in CSV.'; return; }
    let saved=0;
    for(const dk of dateKeys){
      const exs=sessions[dk]; if(!exs.length) continue;
      let vol=0; exs.forEach(ex=>ex.sets.forEach(s=>{ vol+=parseFloat(s.reps||0)*parseFloat(s.weight||0); }));
      // parse date
      let ds=''; const dm=dk.match(/(\d{1,2})\s(\w{3})\s(\d{4})/);
      if(dm){ const months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'}; ds=dm[3]+'-'+(months[dm[2]]||'01')+'-'+String(dm[1]).padStart(2,'0'); }
      else ds=dk;
      const row={client_id:CURRENT.id,workout_date:ds||new Date().toISOString().slice(0,10),title,exercises_json:JSON.stringify(exs),total_volume:vol||null,source:'trainerize_csv'};
      Object.keys(row).forEach(k=>{ if(row[k]==null) delete row[k]; });
      await db({op:'insert',table:'workouts',values:row}); saved++;
    }
    st.textContent=saved+' session'+(saved!==1?'s':'')+' imported from CSV. Reloading...';
    setTimeout(()=>loadProfile(CURRENT.id),800);
  }catch(e){ st.textContent='CSV parse failed: '+e.message; }
}

const WO_PROMPT='You are reading a workout log screenshot (such as Trainerize). Return ONLY JSON, no prose, no fences. Shape: {"workout_date":"YYYY-MM-DD" or null,"title":"short name or null","exercises":[{"name":"...","sets":number,"reps":"as written","weight":"as written"}]}. Pull every exercise visible.';
async function uploadWorkout(ev){
  const file=ev.target.files[0]; ev.target.value=''; if(!file||!CURRENT) return;
  const st=document.getElementById('woStatus'); st.textContent='Reading workout screenshot...';
  try{
    const b64=await fileToB64(file);
    const key=await uploadFile(file,'workout');
    const j=await aiExtract(file,b64,WO_PROMPT);
    let vol=0; (j.exercises||[]).forEach(x=>{ const s=parseFloat(x.sets),rp=parseFloat(x.reps),w=parseFloat(x.weight); if(!isNaN(s)&&!isNaN(rp)&&!isNaN(w)) vol+=s*rp*w; });
    const row={client_id:CURRENT.id,workout_date:j.workout_date||new Date().toISOString().slice(0,10),title:j.title||'Workout',file_url:key,exercises_json:JSON.stringify(j.exercises||[]),total_volume:vol||null,source:'trainerize_screenshot'};
    Object.keys(row).forEach(k=>{ if(row[k]==null) delete row[k]; }); row.client_id=CURRENT.id;
    const ins=await db({op:'insert',table:'workouts',values:row});
    if(ins&&ins.error) throw new Error(ins.error);
    st.textContent='Saved. Reloading...'; loadProfile(CURRENT.id);
  }catch(e){ st.textContent='Failed: '+e.message; }
}

function renderScanTrendChart(scans){
  const el = document.getElementById('scanTrendChart');
  if (!el) return;
  const real = (scans||[]).filter(s=>s.source!=='inbody_history').slice().sort((a,b)=>String(a.scan_date).localeCompare(String(b.scan_date)));
  if (real.length < 2) { el.innerHTML = ''; return; } // need at least 2 points for a trend line to mean anything
  const W = 600, H = 200, padL = 44, padR = 16, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  function buildLine(key, color, label){
    const pts = real.map((s,i) => ({ x: i, y: num(s[key]), date: s.scan_date })).filter(p => p.y !== '');
    if (pts.length < 2) return '';
    const ys = pts.map(p=>+p.y);
    let yMin = Math.min(...ys), yMax = Math.max(...ys);
    if (yMin === yMax) { yMin -= 1; yMax += 1; } // avoid a flat zero-range chart
    const pad = (yMax - yMin) * 0.15;
    yMin -= pad; yMax += pad;
    const xStep = real.length > 1 ? plotW / (real.length - 1) : 0;
    const coords = pts.map(p => ({
      x: padL + p.x * xStep,
      y: padT + plotH - ((+p.y - yMin) / (yMax - yMin)) * plotH,
      val: p.y, date: p.date
    }));
    const path = coords.map((c,i) => (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
    const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="${color}"><title>${esc(fmtDate(c.date))}: ${c.val}</title></circle>`).join('');
    const lastPt = coords[coords.length-1];
    const firstPt = coords[0];
    const trendUp = lastPt.val > firstPt.val;
    return { svg: `<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>` + dots,
             label, color, last: lastPt.val, first: firstPt.val, trendUp };
  }

  const weightLine = buildLine('weight', '#E0192B', 'Weight');
  const bfLine = buildLine('body_fat_pct', '#2563EB', 'Body Fat %');

  const dateLabels = real.map((s,i) => {
    const x = padL + (real.length>1 ? (plotW/(real.length-1))*i : 0);
    return `<text x="${x.toFixed(1)}" y="${H-8}" font-size="10" fill="#6B7280" text-anchor="middle">${esc(fmtDate(s.scan_date).split(',')[0])}</text>`;
  }).join('');

  const legend = [weightLine, bfLine].filter(Boolean).map(l =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:12px">
      <span style="width:10px;height:10px;border-radius:50%;background:${l.color};display:inline-block"></span>
      ${esc(l.label)} <b style="color:${l.trendUp?'var(--red,#E0192B)':'var(--green,#1E9E5A)'}">${l.trendUp?'▲':'▼'} ${Math.abs(+(l.last-l.first).toFixed(1))}</b>
    </span>`).join('');

  el.innerHTML = `
    <h4 style="font-family:Oswald;font-size:13px;text-transform:uppercase;margin-bottom:8px">Progress Trend</h4>
    <div style="margin-bottom:8px">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:220px">
      ${[0,0.25,0.5,0.75,1].map(f => `<line x1="${padL}" y1="${padT+plotH*f}" x2="${W-padR}" y2="${padT+plotH*f}" stroke="#F0F2F5" stroke-width="1"/>`).join('')}
      ${weightLine ? weightLine.svg : ''}
      ${bfLine ? bfLine.svg : ''}
      ${dateLabels}
    </svg>`;
}

function renderScans(scans){
  const el=document.getElementById('scansList'); if(!el) return;
  const real=scans.filter(s=>s.source!=='inbody_history').slice().reverse();
  window._allScans = real;
  renderScanTrendChart(scans);
  if(!real.length){ el.innerHTML='<div class="empty">No InBody scans yet. Upload the PDF or a photo and the numbers read in automatically.</div>'; return; }
  el.innerHTML=real.map(s=>'<div class="row" onclick="openScanRecall('+s.id+')" style="cursor:pointer"><div class="main"><div class="name" style="text-decoration:underline;text-decoration-style:dotted">'+esc(fmtDate(s.scan_date))+'</div><div class="meta">'+
    [s.weight!=null?'Wt '+s.weight:'', s.skeletal_muscle!=null?'SMM '+s.skeletal_muscle:'', s.body_fat_pct!=null?'BF '+s.body_fat_pct+'%':'', s.bmi!=null?'BMI '+s.bmi:''].filter(Boolean).join(' · ')+
    '</div></div></div>').join('');
  renderMuscleBalanceFor(real[0]);
}
function renderMuscleBalanceFor(scan){
  const mbEl = document.getElementById('muscleBalance');
  if (mbEl) mbEl.innerHTML = renderMuscleBalance(scan);
}
function openScanRecall(scanId){
  const s = (window._allScans||[]).find(x => x.id === scanId);
  if (!s) return;
  renderMuscleBalanceFor(s); // clicking a scan updates Muscle Balance to that scan's data too
  const existing = document.getElementById('recall-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'recall-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;padding:24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-weight:800;font-size:18px">InBody Scan — ${esc(fmtDate(s.scan_date))}</div>
      <button onclick="document.getElementById('recall-overlay').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted,#6B7280)">&times;</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      ${scanStat('Weight', s.weight, 'lb')}
      ${scanStat('Lean Mass', s.lean_mass, 'lb')}
      ${scanStat('Skeletal Muscle', s.skeletal_muscle, 'lb')}
      ${scanStat('Body Fat', s.body_fat_pct, '%')}
      ${scanStat('Fat Mass', s.fat_mass, 'lb')}
      ${scanStat('BMI', s.bmi, '')}
    </div>
    <div style="font-weight:800;color:var(--red,#E0192B);margin:14px 0 8px">Muscle Balance</div>
    ${renderMuscleBalance(s)}
    ${s.file_url ? `<a class="btn" target="_blank" href="${WORKER}/file/get?key=${encodeURIComponent(s.file_url)}" style="display:block;text-align:center;margin-top:16px">View Original Upload</a>` : ''}
  </div>`;
  document.body.appendChild(overlay);
}
function scanStat(label, val, unit){
  if (val == null) return '';
  return `<div style="background:var(--soft,#F5F6F8);border-radius:10px;padding:10px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted,#6B7280)">${esc(label)}</div><div style="font-size:18px;font-weight:800">${esc(String(val))}${unit?' <span style="font-size:12px;font-weight:400">'+unit+'</span>':''}</div></div>`;
}
function renderMuscleBalance(scan){
  if (!scan || !scan.segmental_json) return '<div class="empty">No segmental data on file yet — the AI reads this automatically from the InBody scan when it includes a Segmental Lean Analysis section.</div>';
  let seg; try{ seg=JSON.parse(scan.segmental_json); }catch(e){ return ''; }
  const parts=[['Right Arm',seg.right_arm],['Left Arm',seg.left_arm],['Trunk',seg.trunk],['Right Leg',seg.right_leg],['Left Leg',seg.left_leg]];
  const rows=parts.filter(p=>p[1]!=null).map(([label,pct])=>{
    const color = pct>=100?'var(--green)':pct>=90?'var(--amber)':'var(--red)';
    const width=Math.min(100,(pct/140)*100);
    return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">'+label+'</span><span style="font-weight:700;color:'+color+'">'+pct+'%</span></div><div style="height:8px;background:var(--soft);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+width+'%;background:'+color+';border-radius:4px"></div></div></div>';
  }).join('');
  return rows || '<div class="empty">No segmental values could be read from this scan.</div>';
}
