let backfillState = {};

function initials(n){ const p=n.trim().split(/\s+/); return ((p[0]||'')[0]+((p[1]||'')[0]||'')).toUpperCase(); }

function renderCards(){
  const container = document.getElementById('cards');
  container.innerHTML = '';
  DATA.forEach((d, i) => {
    const state = backfillState[i] || 'ready';
    const badgeClass = state==='done'?'badge-done':state==='error'?'badge-error':'badge-ready';
    const badgeText = state==='done'?'Backfilled':state==='error'?'Error':'Ready';
    const card = document.createElement('div');
    card.className = 'client-card';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-header-left">
          <div class="avatar">${initials(d.name)}</div>
          <div>
            <div class="client-name">${d.name}</div>
            <div class="client-meta">${d.inbody ? 'InBody ' + d.inbody.scan_date : 'No InBody scan on file'} · Consultation notes ready</div>
          </div>
        </div>
        <span class="status-badge ${badgeClass}" id="badge-${i}">${badgeText}</span>
      </div>
      <div class="action-row">
        <button class="btn red" id="btn-${i}" onclick="backfillClient(${i})">Backfill</button>
        <span class="import-status" id="status-${i}">Ready</span>
      </div>
    `;
    container.appendChild(card);
  });
}

async function db(body){
  const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) });
  return r.json();
}

async function findClientId(name){
  const parts = name.trim().split(/\s+/);
  const first = parts[0];
  const candidates = await db({ op:'select', table:'clients', where:{ first_name:first }, limit:50 });
  const target = name.trim().toLowerCase();
  const match = (candidates.results||[]).find(c => ((c.first_name||'')+' '+(c.last_name||'')).trim().toLowerCase() === target);
  return match ? match.id : null;
}

async function backfillClient(i){
  const d = DATA[i];
  const btn = document.getElementById('btn-'+i);
  const status = document.getElementById('status-'+i);
  const badge = document.getElementById('badge-'+i);
  btn.disabled = true;
  status.textContent = 'Finding client...';
  status.className = 'import-status';

  try {
    const clientId = await findClientId(d.name);
    if (!clientId) throw new Error('Client not found in D1 — run the batch importer first.');

    if (d.inbody) {
      status.textContent = 'Writing InBody scan...';
      const payload = Object.assign({ client_id: clientId }, d.inbody);
      Object.keys(payload).forEach(k => { if (payload[k] == null) delete payload[k]; });
      const r1 = await db({ op:'insert', table:'inbody_scans', values: payload });
      if (r1.error) throw new Error('InBody: ' + r1.error);
    }

    status.textContent = 'Writing consultation notes...';
    const cPayload = Object.assign({ client_id: clientId }, d.consult);
    Object.keys(cPayload).forEach(k => { if (cPayload[k] == null || cPayload[k] === '') delete cPayload[k]; });
    const r2 = await db({ op:'insert', table:'consultations', values: cPayload });
    if (r2.error) throw new Error('Consultation: ' + r2.error);

    backfillState[i] = 'done';
    badge.textContent = 'Backfilled';
    badge.className = 'status-badge badge-done';
    status.textContent = '✓ Backfilled for client ID ' + clientId;
    status.className = 'import-status ok';
    btn.textContent = '✓ Done';
  } catch(e) {
    backfillState[i] = 'error';
    badge.textContent = 'Error';
    badge.className = 'status-badge badge-error';
    status.textContent = '✗ ' + e.message;
    status.className = 'import-status err';
    btn.disabled = false;
  }
  updateCounts();
}

async function backfillAll(){
  for (let i=0; i<DATA.length; i++){
    if (backfillState[i]==='done') continue;
    await backfillClient(i);
    await new Promise(r=>setTimeout(r,300));
  }
}

function updateCounts(){
  document.getElementById('done-count').textContent = Object.values(backfillState).filter(s=>s==='done').length;
  document.getElementById('fail-count').textContent = Object.values(backfillState).filter(s=>s==='error').length;
}

renderCards();
</script>
