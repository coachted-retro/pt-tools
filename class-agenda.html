<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<title>Class Agenda — Ironclad</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#1B4D8C;--ink:#15171A;--bg:#F5F6F8;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
.header{background:var(--ink);color:#fff;padding:24px 20px;text-align:center}
.header .cname{font-family:'Oswald';font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.header .cname span{color:var(--red)}
.header .meta{font-size:13px;color:#9CA3AF;margin-top:6px}
.wrap{max-width:640px;margin:0 auto;padding:24px 20px 60px}
.section-label{font-family:'Oswald';font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.section-label:first-child{margin-top:0}
.warmup-item, .cooldown-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600}
.warmup-item .dur, .cooldown-item .dur{color:var(--muted);font-size:14px;font-weight:700}
.station{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.station-num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:var(--red);color:#fff;font-family:'Oswald';font-weight:800;font-size:16px;border-radius:50%;margin-right:10px}
.station-name{font-family:'Oswald';font-size:22px;font-weight:700;text-transform:uppercase;display:inline-block;vertical-align:middle}
.station-work{font-size:15px;font-weight:700;color:var(--red);margin:10px 0 4px}
.station-equipment{font-size:13px;color:var(--muted);margin-bottom:10px}
.station-cue{font-size:14px;background:#FFFBEB;border-left:3px solid #7C848A;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:8px}
.station-scale{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.scale-box{padding:8px 10px;border-radius:8px}
.scale-up{background:#EAF1FA;color:#991B1B}
.scale-down{background:#E3F5EC;color:#166534}
.scale-label{font-weight:800;text-transform:uppercase;font-size:10px;display:block;margin-bottom:2px}
.rest-note{text-align:center;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:8px 0}
.loading, .empty{text-align:center;color:var(--muted);padding:60px 20px}
.print-btn{display:block;width:100%;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Oswald';font-weight:700;text-transform:uppercase;font-size:14px;cursor:pointer;margin-top:20px}
@media print{.print-btn{display:none}body{background:#fff}.station,.warmup-item,.cooldown-item{break-inside:avoid}}
</style>
</head>
<body>
<div class="header">
  <div class="cname" id="class-name">Loading...</div>
  <div class="meta" id="class-meta"></div>
</div>
<div id="timer-overlay" style="display:none;position:fixed;inset:0;background:#1B4D8C;z-index:500;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center;transition:background .4s">
  <button onclick="closeClassTimer()" style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer">&times;</button>
  <div id="timer-progress" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:8px"></div>
  <div id="timer-phase-label" style="font-family:'Oswald';font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px"></div>
  <div id="timer-name" style="font-family:'Oswald';font-size:32px;font-weight:800;text-transform:uppercase;margin-bottom:16px;max-width:500px"></div>
  <div id="timer-clock" style="font-family:'Oswald';font-size:96px;font-weight:800;line-height:1;margin-bottom:16px">0:00</div>
  <div id="timer-cue" style="font-size:15px;max-width:480px;margin-bottom:12px;opacity:.95"></div>
  <div id="timer-next" style="font-size:13px;opacity:.75;margin-bottom:30px"></div>
  <div style="display:flex;gap:16px;align-items:center">
    <button onclick="prevPhase()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:52px;height:52px;border-radius:50%;cursor:pointer">⏮</button>
    <button id="timer-playpause" onclick="toggleTimerPause()" style="background:#fff;border:none;color:#1B4D8C;font-size:26px;width:68px;height:68px;border-radius:50%;cursor:pointer">⏸</button>
    <button onclick="skipPhase()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:52px;height:52px;border-radius:50%;cursor:pointer">⏭</button>
  </div>
  <div style="font-size:11px;opacity:.6;margin-top:24px;max-width:320px">Play your music from Spotify/Apple Music in the background — these cues layer on top through the same Bluetooth speaker automatically.</div>
</div>
<button id="start-timer-btn" onclick="startClassTimer()" style="display:none;width:calc(100% - 40px);max-width:600px;margin:20px auto 0;background:var(--red);color:#fff;border:none;border-radius:12px;padding:16px;font-family:'Oswald';font-weight:800;text-transform:uppercase;font-size:16px;cursor:pointer">▶ Start Class Timer</button>
<div class="wrap" id="content">
  <div class="loading">Loading this week's class...</div>
</div>
<script>
const WORKER = RETRO_WORKER_URL;
const params = new URLSearchParams(location.search);
const classId = params.get('class_id');
const date = params.get('date');

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── CLASS TIMER — runs through the real warmup/stations/cooldown for ──
// this specific class, in order, with audio cues at every transition ──
let TIMER_QUEUE = [];
let TIMER_IDX = 0, TIMER_LEFT = 0, TIMER_RUNNING = false, TIMER_TICK = null, AC = null;

function beep(freq, dur, when){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const osc = AC.createOscillator(), gain = AC.createGain();
    osc.frequency.value = freq; osc.connect(gain); gain.connect(AC.destination);
    const t = AC.currentTime + (when||0);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t); osc.stop(t + dur);
  } catch(e) {}
}
function vib(pattern){ try { navigator.vibrate && navigator.vibrate(pattern); } catch(e) {} }
function cueGo(){ beep(880,.12); beep(880,.12,.18); vib(200); }
function cueRest(){ beep(440,.3); vib([120,80,120]); }
function cueDone(){ beep(660,.15); beep(880,.15,.18); beep(1046,.25,.36); vib([100,60,100,60,200]); }

function parseSeconds(text, fallback){
  if (!text) return fallback;
  const m = String(text).match(/(\d+)\s*sec/i);
  if (m) return parseInt(m[1],10);
  const m2 = String(text).match(/(\d+)\s*min/i);
  if (m2) return parseInt(m2[1],10) * 60;
  return fallback; // rep/distance-based station (e.g. "10 reps") - no clock time given, use a sensible default the coach can skip past
}

function buildTimerQueue(warmup, stations, cooldown, restSeconds){
  const q = [];
  (warmup||[]).forEach(w => q.push({type:'warmup', name:w.name, seconds:parseSeconds(w.duration,45)}));
  (stations||[]).forEach((st,i) => {
    q.push({type:'work', name:st.name, cue:st.cue, work:st.work, seconds:parseSeconds(st.work,40)});
    if (i < stations.length-1) q.push({type:'rest', name:'Rest', seconds:restSeconds});
  });
  (cooldown||[]).forEach(c => q.push({type:'cooldown', name:c.name, seconds:parseSeconds(c.duration,45)}));
  return q;
}

function startClassTimer(){
  if (!TIMER_QUEUE.length) { alert('Nothing to time yet.'); return; }
  TIMER_IDX = 0;
  document.getElementById('timer-overlay').style.display = 'flex';
  loadPhase();
}
function closeClassTimer(){
  clearInterval(TIMER_TICK); TIMER_TICK = null; TIMER_RUNNING = false;
  document.getElementById('timer-overlay').style.display = 'none';
}
function loadPhase(){
  clearInterval(TIMER_TICK); TIMER_TICK = null;
  if (TIMER_IDX >= TIMER_QUEUE.length) { finishClassTimer(); return; }
  const phase = TIMER_QUEUE[TIMER_IDX];
  TIMER_LEFT = phase.seconds;
  paintPhase();
  (phase.type === 'rest') ? cueRest() : cueGo();
  TIMER_RUNNING = true;
  document.getElementById('timer-playpause').textContent = '⏸';
  TIMER_TICK = setInterval(tick, 1000);
}
function tick(){
  if (!TIMER_RUNNING) return;
  TIMER_LEFT--;
  if (TIMER_LEFT <= 3 && TIMER_LEFT > 0) beep(660,.1);
  if (TIMER_LEFT <= 0) { TIMER_IDX++; loadPhase(); return; }
  paintClock();
}
function paintPhase(){
  const phase = TIMER_QUEUE[TIMER_IDX];
  const labels = { warmup:'🔥 WARM-UP', work:'💪 STATION ' + (stationNumber(TIMER_IDX)), rest:'😮‍💨 REST', cooldown:'🧘 COOL-DOWN' };
  document.getElementById('timer-phase-label').textContent = labels[phase.type] || '';
  document.getElementById('timer-name').textContent = phase.name;
  document.getElementById('timer-cue').textContent = phase.cue ? '💡 ' + phase.cue : (phase.work && phase.type==='work' ? phase.work : '');
  const next = TIMER_QUEUE[TIMER_IDX+1];
  document.getElementById('timer-next').textContent = next ? 'Up next: ' + next.name : 'Last one — almost done!';
  document.getElementById('timer-progress').textContent = (TIMER_IDX+1) + ' of ' + TIMER_QUEUE.length;
  paintClock();
}
function stationNumber(idx){
  let n = 0;
  for (let i=0;i<=idx;i++) if (TIMER_QUEUE[i].type==='work') n++;
  return n;
}
function paintClock(){
  const m = Math.floor(TIMER_LEFT/60), s = TIMER_LEFT%60;
  document.getElementById('timer-clock').textContent = m + ':' + String(s).padStart(2,'0');
  const phase = TIMER_QUEUE[TIMER_IDX];
  document.getElementById('timer-overlay').style.background = phase.type==='rest' ? '#1E9E5A' : (phase.type==='warmup'||phase.type==='cooldown') ? '#2563EB' : '#1B4D8C';
}
function toggleTimerPause(){
  TIMER_RUNNING = !TIMER_RUNNING;
  document.getElementById('timer-playpause').textContent = TIMER_RUNNING ? '⏸' : '▶';
}
function skipPhase(){ TIMER_IDX++; loadPhase(); }
function prevPhase(){ if (TIMER_IDX>0) TIMER_IDX--; loadPhase(); }
function finishClassTimer(){
  cueDone();
  document.getElementById('timer-phase-label').textContent = '✅ CLASS COMPLETE';
  document.getElementById('timer-name').textContent = 'Nice work!';
  document.getElementById('timer-cue').textContent = '';
  document.getElementById('timer-next').textContent = '';
  document.getElementById('timer-clock').textContent = '';
  document.getElementById('timer-overlay').style.background = '#1E9E5A';
}

async function load(){
  if (!classId || !date) {
    document.getElementById('content').innerHTML = '<div class="empty">No class specified.</div>';
    return;
  }
  try {
    const r = await fetch(WORKER + '/classes/session?class_id=' + encodeURIComponent(classId) + '&date=' + encodeURIComponent(date));
    const d = await r.json();
    if (!d.ok || !d.session) {
      document.getElementById('content').innerHTML = '<div class="empty">Could not load this class. It may not be generated yet — try again in a moment.</div>';
      return;
    }
    const s = d.session;
    const warmup = JSON.parse(s.warmup_json || '[]');
    const stations = JSON.parse(s.stations_json || '[]');
    const cooldown = JSON.parse(s.cooldown_json || '[]');

    const dateObj = new Date(date + 'T00:00:00');
    document.getElementById('class-meta').textContent = dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

    let html = '';
    if (warmup.length) {
      html += `<div class="section-label">🔥 Warm-Up</div>`;
      warmup.forEach(w => { html += `<div class="warmup-item"><span>${esc(w.name)}</span><span class="dur">${esc(w.duration)}</span></div>`; });
    }

    html += `<div class="section-label">💪 Stations</div>`;
    stations.forEach((st, i) => {
      html += `<div class="station">
        <div><span class="station-num">${i+1}</span><span class="station-name">${esc(st.name)}</span></div>
        <div class="station-work">${esc(st.work)}</div>
        ${st.equipment ? `<div class="station-equipment">Equipment: ${esc(st.equipment)}</div>` : ''}
        ${st.cue ? `<div class="station-cue">💡 ${esc(st.cue)}</div>` : ''}
        <div class="station-scale">
          ${st.scale_up ? `<div class="scale-box scale-up"><span class="scale-label">Harder</span>${esc(st.scale_up)}</div>` : ''}
          ${st.scale_down ? `<div class="scale-box scale-down"><span class="scale-label">Easier</span>${esc(st.scale_down)}</div>` : ''}
        </div>
      </div>`;
      if (i < stations.length - 1) html += `<div class="rest-note">— rest —</div>`;
    });

    if (cooldown.length) {
      html += `<div class="section-label">🧘 Cool-Down</div>`;
      cooldown.forEach(c => { html += `<div class="cooldown-item"><span>${esc(c.name)}</span><span class="dur">${esc(c.duration)}</span></div>`; });
    }

    html += `<div class="section-label">📸 Class Photos &amp; Video</div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:10px">For social/marketing use — not tied to a specific member. Photo release already covered by the in-gym sign-off.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <label style="cursor:pointer;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px">📷 Take Photo<input type="file" accept="image/*" capture="environment" style="display:none" onchange="captureClassMedia(event,'photo')"></label>
          <label style="cursor:pointer;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px">🎥 Take Video<input type="file" accept="video/*" capture="environment" style="display:none" onchange="captureClassMedia(event,'video')"></label>
        </div>
        <div id="class-media-status" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
        <div id="class-media-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px"></div>
      </div>`;
    html += `<button class="print-btn" onclick="window.print()">Print / Save for Whiteboard</button>`;
    document.getElementById('content').innerHTML = html;
    TIMER_QUEUE = buildTimerQueue(warmup, stations, cooldown, (CLASS_RECORD && CLASS_RECORD.rest_seconds) || 40);
    document.getElementById('start-timer-btn').style.display = 'block';
    loadClassMedia();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty">Could not connect. Try again.</div>';
  }
}

async function captureClassMedia(ev, type){
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file || !classId) return;
  const status = document.getElementById('class-media-status');
  status.textContent = 'Uploading...';
  try {
    const r = await fetch(`${WORKER}/marketing-media/upload?class=${classId}&type=${type}`, { method:'POST', body: file });
    const d = await r.json();
    if (!d.ok) { status.textContent = d.error || 'Could not upload.'; return; }
    status.textContent = 'Saved.';
    loadClassMedia();
  } catch(e) { status.textContent = 'Upload failed — try again.'; }
}

async function loadClassMedia(){
  const grid = document.getElementById('class-media-grid');
  if (!grid || !classId) return;
  try {
    const r = await fetch(`${WORKER}/marketing-media/list?class=${classId}`);
    const d = await r.json();
    const media = d.media || [];
    grid.innerHTML = media.map(m => m.media_type === 'video'
      ? `<video src="${WORKER}/marketing-media/get?key=${encodeURIComponent(m.r2_key)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px" muted></video>`
      : `<img src="${WORKER}/marketing-media/get?key=${encodeURIComponent(m.r2_key)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px" loading="lazy">`
    ).join('');
  } catch(e) {}
}

let CLASS_RECORD = null;
async function loadClassName(){
  try {
    const r = await fetch(WORKER + '/db', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op:'select', table:'group_classes', where:{ id: parseInt(classId,10) }, limit:1 }) });
    const d = await r.json();
    const cls = (d.results||[])[0];
    CLASS_RECORD = cls || null;
    if (cls) document.getElementById('class-name').innerHTML = cls.name.replace(/(Core|Camp)$/, '<span>$1</span>');
  } catch(e) {}
}

(async function(){ await loadClassName(); await load(); })();
</script>
</body>
</html>
