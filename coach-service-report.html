<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Coach Service Report</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#1B4D8C;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;--green:#1E9E5A;--amber:#7C848A;--soft:#F5F6F8;--lred:#EAF1FA;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:800px;margin:0 auto;padding:24px 20px 60px}
.picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;display:flex;gap:12px;align-items:center}
.picker select,.picker input{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-family:'Oswald';font-size:26px;font-weight:800}
.kpi .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.flag{background:var(--lred);color:var(--red);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;text-transform:uppercase}
.ok{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Coach <span>Service Report</span></div>
  <a href="coach-crm.html">&larr; My Clients</a>
</div>
<div class="wrap">
  <div class="picker">
    <select id="coach-select" onchange="load()">
      <option value="">Select coach</option>
      <option value="Ted Scholl">Ted Scholl</option>
      <option value="Danielle Pellegrini">Danielle Pellegrini</option>
      <option value="Roman Benedetti">Roman Benedetti</option>
      <option value="Marin">Marin</option>
      <option value="Tyler">Tyler</option>
      <option value="James">James</option>
    </select>
    <input type="month" id="month-select" onchange="load()">
  </div>
  <div class="kpi-grid" id="kpis"></div>
  <div class="card" id="client-list"><div class="ok">Select a coach above to see this month's engagement.</div></div>
</div>
<script>
const WORKER = RETRO_WORKER_URL;
document.getElementById('month-select').value = new Date().toISOString().slice(0,7);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function load(){
  const coach = document.getElementById('coach-select').value;
  const month = document.getElementById('month-select').value;
  if (!coach) return;
  const r = await fetch(WORKER + `/reports/coach-service?coach=${encodeURIComponent(coach)}&month=${month}`);
  const d = await r.json();
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="v">${d.total_clients}</div><div class="l">Clients</div></div>
    <div class="kpi"><div class="v">${d.total_touchpoints}</div><div class="l">Touchpoints Logged</div></div>
    <div class="kpi"><div class="v">${d.avg_per_client}</div><div class="l">Avg Per Client</div></div>
    <div class="kpi"><div class="v" style="color:${d.flagged_count>0?'var(--red)':'var(--green)'}">${d.flagged_count}</div><div class="l">Need Attention</div></div>`;
  document.getElementById('client-list').innerHTML = (d.clients||[]).map(c => `
    <div class="row">
      <div><a href="coach-client-profile.html?client=${c.client_id}&coach=${encodeURIComponent(coach)}" style="color:inherit;font-weight:600;text-decoration:none">${esc(c.name)}</a></div>
      <div style="display:flex;align-items:center;gap:10px">
        ${c.needs_attention ? '<span class="flag">No contact this month</span>' : `<span class="ok">${c.touchpoints} touchpoint${c.touchpoints===1?'':'s'} \\u00B7 ${c.coach_messages} msg${c.coach_messages===1?'':'s'}</span>`}
      </div>
    </div>`).join('') || '<div class="ok">No clients assigned.</div>';
}
</script>
</body>
</html>
