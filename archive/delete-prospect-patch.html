     3. JAVASCRIPT  —  add inside your <script> block
     ═══════════════════════════════════════════════ -->
<script>
// ── State for pending delete ──────────────────────────────────────────
let pendingDeleteRow = null;
let pendingDeleteName = '';

// ── Open the confirm modal ────────────────────────────────────────────
function openDeleteModal(rowIndex, fullName) {
  pendingDeleteRow = rowIndex;
  pendingDeleteName = fullName;
  document.getElementById('deleteModalName').textContent = fullName;
  document.getElementById('confirmDeleteBtn').disabled = false;
  document.getElementById('deleteSpinner').style.display = 'none';
  document.getElementById('confirmDeleteLabel').textContent = 'Delete Permanently';
  document.getElementById('deleteModal').classList.add('active');
}

// ── Close without acting ──────────────────────────────────────────────
function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('active');
  pendingDeleteRow = null;
  pendingDeleteName = '';
}

// ── Close if user clicks overlay backdrop ─────────────────────────────
document.getElementById('deleteModal').addEventListener('click', function(e) {
  if (e.target === this) closeDeleteModal();
});

// ── Execute delete ────────────────────────────────────────────────────
async function confirmDelete() {
  if (pendingDeleteRow === null) return;

  const btn = document.getElementById('confirmDeleteBtn');
  const spinner = document.getElementById('deleteSpinner');
  const label = document.getElementById('confirmDeleteLabel');

  btn.disabled = true;
  spinner.style.display = 'block';
  label.textContent = 'Deleting…';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'deleteProspect',
        rowIndex: pendingDeleteRow
      })
    });
    const data = await res.json();

    if (data.success) {
      closeDeleteModal();
      showToast(`✓ ${pendingDeleteName} deleted`, 'success');
      // Re-fetch the prospect list to refresh the UI
      await loadProspects();          // call your existing load function
    } else {
      showToast('Delete failed: ' + (data.error || 'unknown error'), 'error');
      btn.disabled = false;
      spinner.style.display = 'none';
      label.textContent = 'Delete Permanently';
    }
  } catch (err) {
    showToast('Network error — try again', 'error');
    btn.disabled = false;
    spinner.style.display = 'none';
    label.textContent = 'Delete Permanently';
  }
}

// ── Toast helper ──────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast toast-${type} show`;
  setTimeout(() => { t.className = 'toast'; }, 3200);
}
</script>

      var tpData = touchpointSheet.getDataRange().getValues();
      var rowsToDelete = [];
