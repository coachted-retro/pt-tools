<script id="recent-assessments-script">
(function() {
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby79Hg7mnge7SWS41RsDz9_Wjtx5DkMbQPBrszYaVqiD3eKwxvc1Zo73rInH365E0-2yw/exec';

  function initials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).map(w => w[0]).join('').substring(0, 2).toUpperCase();
  }

  function timeAgo(ts) {
    if (!ts) return 'Unknown date';
    const d = new Date(ts);
    if (isNaN(d)) return ts;
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7) return `${days}d ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function goalTags(goalsStr) {
    if (!goalsStr) return '';
    return goalsStr
      .split(/[,;|\n]+/)
      .map(s => s.trim())
      .filter(Boolean)
      .slice(0, 3)
      .map(g => `<span class="assessment-tag">${g}</span>`)
      .join('');
  }

  function renderCards(intakes) {
    const container = document.getElementById('recent-assessments');
    if (!container) return;

    if (!intakes || intakes.length === 0) {
      container.innerHTML = `<div class="assessments-empty">No assessments yet. Complete an initial consultation to see them here.</div>`;
      return;
    }

    container.innerHTML = intakes.map((intake, i) => {
      // Support both flat and nested data from Apps Script
      const name   = intake.fullName || intake['Full Name'] || intake.name || 'Unknown';
      const ts     = intake.timestamp || intake.Timestamp || intake.date || '';
      const weight = intake.weight || intake.Weight || intake.currentWeight || '';
      const goals  = intake.fitnessGoals || intake['Fitness Goals'] || intake.goals || '';
      const rowNum = intake.rowNumber || intake.row || (i + 2); // +2 because row 1 = headers

      const viewerUrl = `intake-viewer.html?row=${rowNum}`;

      return `
        <a class="assessment-card" href="${viewerUrl}">
          <div class="assessment-card-avatar">${initials(name)}</div>
          <div class="assessment-card-info">
            <div class="assessment-card-name">${name}</div>
            <div class="assessment-card-meta">
              <span>🕐 ${timeAgo(ts)}</span>
              ${weight ? `<span>⚖️ ${weight}</span>` : ''}
            </div>
            ${goals ? `<div class="assessment-card-tags" style="margin-top:6px;">${goalTags(goals)}</div>` : ''}
          </div>
          <div class="assessment-card-arrow">→</div>
        </a>
      `;
    }).join('');
  }

  async function loadRecentAssessments() {
    const container = document.getElementById('recent-assessments');
    if (!container) return;

    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getIntakes&limit=10`);
      
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      
      const json = await res.json();

      if (json.success && Array.isArray(json.data)) {
        renderCards(json.data);
      } else if (Array.isArray(json)) {
        // Some Apps Script versions return array directly
        renderCards(json);
      } else {
        throw new Error(json.error || 'Unexpected response format');
      }
    } catch (e) {
      console.error('Recent assessments error:', e);
      if (container) {
        container.innerHTML = `<div class="assessments-error">
          Could not load assessments: ${e.message}<br>
          <small style="opacity:0.6;margin-top:4px;display:block;">Check that your Apps Script has a <code>getIntakes</code> action and is deployed as "Anyone".</small>
        </div>`;
      }
    }
  }

  // Run on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadRecentAssessments);
  } else {
    loadRecentAssessments();
  }
})();
</script>

<!-- ══════════════════════════════════════════════════════════════════
  STEP 3: ADD THESE HANDLERS TO YOUR GOOGLE APPS SCRIPT (Code.gs)
  ══════════════════════════════════════════════════════════════════
  
  Add the functions below to your existing Code.gs doGet() handler.
  Your doGet() likely has a switch(action) or if/else — add cases for
  'getIntakes' and 'getIntakeByRow'.

  Example Code.gs additions:
  ─────────────────────────────────────────────────────────────────── 

function doGet(e) {
  const action = e.parameter.action;
  
  if (action === 'getIntakes') {
    return handleGetIntakes(e);
  }
  if (action === 'getIntakeByRow') {
    return handleGetIntakeByRow(e);
  }
  // ... your existing handlers ...
}

function handleGetIntakes(e) {
  try {
    const limit = parseInt(e.parameter.limit) || 10;
    const ss = SpreadsheetApp.openById('1sSLy4Zuai4Vrh1GjyRXgfXoLCBLDuLYfLdKz3VWiT4g');
    const sheet = ss.getSheetByName('All Intakes');
    
    if (!sheet) throw new Error('Sheet "All Intakes" not found');
    
    const data = sheet.getDataRange().getValues();
    if (data.length < 2) {
      return jsonResponse({ success: true, data: [] });
    }
    
    const headers = data[0];
    const rows = data.slice(1); // skip header row
    
    // Return most recent N intakes (last rows = most recent if appended)
    const recent = rows
      .slice(-limit)           // last N rows
      .reverse()               // newest first
      .map((row, i) => {
        const obj = {};
        headers.forEach((h, j) => { obj[h] = row[j]; });
        // Attach the actual sheet row number (1-indexed, +1 for header, +1 for 1-based)
        obj.rowNumber = data.length - i;  // row in sheet (1-based)
        return obj;
      });
    
    return jsonResponse({ success: true, data: recent });
  } catch(err) {
    return jsonResponse({ success: false, error: err.message });
  }
}

function handleGetIntakeByRow(e) {
  try {
    const rowNum = parseInt(e.parameter.row);
    const ss = SpreadsheetApp.openById('1sSLy4Zuai4Vrh1GjyRXgfXoLCBLDuLYfLdKz3VWiT4g');
    const sheet = ss.getSheetByName('All Intakes');
    
    if (!sheet) throw new Error('Sheet "All Intakes" not found');
    if (!rowNum || rowNum < 2) throw new Error('Invalid row number');
    
    const headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    const rowData = sheet.getRange(rowNum, 1, 1, sheet.getLastColumn()).getValues()[0];
    
    const obj = {};
    headers.forEach((h, i) => { obj[h] = rowData[i]; });
    obj.rowNumber = rowNum;
    
    return jsonResponse({ success: true, data: obj });
  } catch(err) {
    return jsonResponse({ success: false, error: err.message });
  }
}

// Helper — add this if you don't have it already
function jsonResponse(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
