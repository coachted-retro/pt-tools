<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="icons-strong/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons-strong/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons-strong/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons-strong/apple-touch-icon.png">
<title>Submit End of Day — Retro Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E0192B;--ink:#15171A;--bg:#F0F2F5;--card:#fff;--line:#E4E7EC;--muted:#6B7280;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;border-bottom:3px solid var(--red)}
.topbar .logo{font-family:'Oswald';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase}
.topbar .logo span{color:var(--red)}
.topbar a{margin-left:auto;color:#9CA3AF;font-size:12px;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:6px 14px;font-family:'Oswald';text-transform:uppercase;font-weight:700}
.wrap{max-width:500px;margin:0 auto;padding:24px 20px 60px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;cursor:pointer;text-decoration:none;color:inherit}
.card:hover{border-color:var(--red)}
.name{font-weight:700;font-size:17px}
.role{font-size:12px;color:var(--muted)}
.arrow{margin-left:auto;color:var(--red);font-size:20px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Submit <span>EOD</span></div>
  <a href="command-center.html">&larr; Command Center</a>
</div>
<div class="wrap">
  <div class="sub">Who's submitting today's End of Day report?</div>
  <a class="card" href="ted-eod.html"><div><div class="name">Ted Scholl</div><div class="role">Men's Training Lead</div></div><span class="arrow">&rarr;</span></a>
  <a class="card" href="dani-eod.html"><div><div class="name">Danielle Pellegrini</div><div class="role">Director of Fitness</div></div><span class="arrow">&rarr;</span></a>
  <a class="card" href="sarah-eod.html"><div><div class="name">Sarah</div><div class="role">MEA Manager</div></div><span class="arrow">&rarr;</span></a>
</div>
</body>
</html>
